<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GMAP-BF 対策クイズ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic Pro',sans-serif;font-size:16px;background:#f0f4f8;color:#1a1a2e;min-height:100vh}

/* ===== LOGIN SCREEN ===== */
#screen-login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 24px;background:#f0f4f8}
.login-box{background:#fff;border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 4px 20px rgba(0,0,0,.10)}
.login-title{font-size:22px;font-weight:700;color:#2d3561;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:12px;font-weight:700;color:#888;margin-bottom:6px;letter-spacing:.05em}
.login-field input{width:100%;padding:14px 16px;border-radius:12px;border:2px solid #e0e0e0;font-size:15px;color:#1a1a2e;outline:none;transition:border-color .15s}
.login-field input:focus{border-color:#4a6cf7}
.login-btn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#4a6cf7,#6a3de8);color:#fff;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px;box-shadow:0 4px 15px rgba(74,108,247,.35);letter-spacing:.05em}
.login-btn:active{transform:scale(.98)}
.login-error{font-size:13px;color:#e74c3c;text-align:center;margin-top:12px;min-height:20px;font-weight:600}

/* ===== TOP SCREEN ===== */
#screen-top{display:flex;flex-direction:column;min-height:100vh;padding:24px 16px}
.app-title{font-size:26px;font-weight:700;color:#2d3561;text-align:center;margin-bottom:4px}
.app-sub{font-size:13px;color:#666;text-align:center;margin-bottom:28px}
.section-label{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.subject-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subject-btn{padding:14px 8px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;font-size:14px;font-weight:600;color:#444;cursor:pointer;transition:all .15s;text-align:center}
.subject-btn.active{border-color:#4a6cf7;background:#eef1ff;color:#2d3561}
.subject-btn.all-btn{grid-column:1/-1;background:#4a6cf7;border-color:#4a6cf7;color:#fff;font-size:15px}
.subject-btn.all-btn.active{background:#2d3561;border-color:#2d3561}
.mode-row{display:flex;gap:10px}
.mode-btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;font-size:14px;font-weight:600;color:#444;cursor:pointer;transition:all .15s;text-align:center}
.mode-btn.active{border-color:#4a6cf7;background:#eef1ff;color:#2d3561}
.count-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.count-btn{width:52px;height:52px;border-radius:12px;border:2px solid #e0e0e0;background:#fff;font-size:15px;font-weight:700;color:#444;cursor:pointer;transition:all .15s}
.count-btn.active{border-color:#4a6cf7;background:#eef1ff;color:#2d3561}
.start-btn{width:100%;padding:18px;border-radius:16px;border:none;background:linear-gradient(135deg,#4a6cf7,#6a3de8);color:#fff;font-size:18px;font-weight:700;cursor:pointer;margin-top:auto;box-shadow:0 4px 15px rgba(74,108,247,.4);letter-spacing:.05em}
.start-btn:active{transform:scale(.98)}
.stats-row{display:flex;gap:8px;margin-top:4px}
.stat-chip{flex:1;background:#f8f8f8;border-radius:10px;padding:10px 8px;text-align:center;border:none;cursor:pointer;transition:background .15s}
.stat-chip:active{background:#eef1ff}
.stat-chip .num{font-size:22px;font-weight:700;color:#2d3561}
.stat-chip .lbl{font-size:11px;color:#888;margin-top:2px}
/* Stats modal */
.stats-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-end}
.stats-modal-overlay.open{display:flex}
.stats-modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-height:78vh;display:flex;flex-direction:column}
.stats-modal-hdr{padding:16px 16px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;flex-shrink:0}
.stats-modal-title{font-size:16px;font-weight:700;color:#1a1a2e}
.stats-modal-close{background:none;border:none;cursor:pointer;color:#888;padding:4px 8px;border-radius:8px}
.stats-modal-body{overflow-y:auto;flex:1;padding:0 16px}
.stats-modal-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f4f4f4}
.stats-modal-qtext{flex:1;font-size:13px;color:#333;line-height:1.4}
.stats-modal-score{font-size:12px;color:#888;white-space:nowrap;min-width:54px;text-align:right}
.stats-modal-del{background:none;border:none;color:#e74c3c;font-size:16px;cursor:pointer;padding:2px 6px;flex-shrink:0}
.stats-modal-footer{padding:12px 16px;border-top:1px solid #eee;flex-shrink:0}
/* Reset button */
.reset-stats-btn{width:100%;padding:12px;border-radius:12px;border:1.5px solid #e74c3c;background:#fff;color:#e74c3c;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px}
/* わからない button */
.skip-btn{width:100%;padding:14px;border-radius:14px;border:2px dashed #bbb;background:#fafafa;color:#888;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.skip-btn:active{background:#f0f0f0;border-color:#999}
.weak-warn{font-size:12px;color:#e67e22;margin-top:8px;text-align:center;display:none}
.extra-toggle{width:100%;background:none;border:none;color:#888;font-size:12px;font-weight:600;cursor:pointer;padding:8px 0 2px;letter-spacing:.04em;text-align:center}
.extra-toggle:hover{color:#555}
.extra-subjects{display:none;margin-top:8px}
.extra-subjects.open{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.subject-btn.extra{border-color:#e0e0e0;color:#888;font-size:13px}
.subject-btn.extra.active{border-color:#9b59b6;background:#f5eeff;color:#6c3483}

/* ===== QUIZ SCREEN ===== */
#screen-quiz{display:none;flex-direction:column;min-height:100vh;background:#f0f4f8}
.quiz-header{background:#fff;padding:16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.06);position:sticky;top:0;z-index:10}
.quiz-back{background:none;border:none;font-size:22px;cursor:pointer;color:#666;padding:0 4px}
.progress-wrap{flex:1}
.progress-bar{height:8px;background:#e8e8e8;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4a6cf7,#6a3de8);border-radius:4px;transition:width .3s}
.progress-text{font-size:12px;color:#888;margin-top:4px;text-align:right}
.quiz-body{padding:16px;flex:1}
.q-number{font-size:13px;font-weight:700;color:#4a6cf7;margin-bottom:8px}
.q-subject-tag{display:inline-block;font-size:11px;background:#eef1ff;color:#4a6cf7;border-radius:6px;padding:2px 8px;margin-bottom:12px;font-weight:600}
.q-text{font-size:17px;font-weight:600;line-height:1.6;color:#1a1a2e;background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.q-text u{color:#c0392b;text-decoration:underline}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{width:100%;padding:16px 18px;border-radius:14px;border:2px solid #e0e0e0;background:#fff;font-size:15px;color:#333;cursor:pointer;text-align:left;line-height:1.5;transition:all .15s;font-weight:500}
.choice-btn:active{transform:scale(.99)}
.choice-btn.correct{background:#e8f8f0;border-color:#27ae60;color:#1a7a44}
.choice-btn.wrong{background:#fdecea;border-color:#e74c3c;color:#b03a2e}
.choice-btn.reveal{background:#e8f8f0;border-color:#27ae60;color:#1a7a44;opacity:.7}
.choice-btn:disabled{cursor:default}
.feedback-area{display:none;margin-top:16px;background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.feedback-icon{font-size:28px;margin-bottom:8px}
.feedback-label{font-size:17px;font-weight:700;margin-bottom:10px}
.feedback-label.ok{color:#27ae60}
.feedback-label.ng{color:#e74c3c}
.reference-box{background:#f0f4f8;border-radius:10px;padding:12px;font-size:13px;color:#555;line-height:1.6;margin-bottom:14px}
.reference-box strong{color:#2d3561;display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.explanation-box{background:#fff8e8;border-left:4px solid #f0a500;border-radius:0 10px 10px 0;padding:12px 14px;font-size:14px;color:#4a3800;line-height:1.7;margin-bottom:14px}
.explanation-box strong{color:#c87800;display:block;margin-bottom:5px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.next-btn{width:100%;padding:16px;border-radius:14px;border:none;background:#4a6cf7;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.next-btn:active{background:#3558e0}
.bookmark-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bookmark-btn{flex-shrink:0;padding:10px 16px;border-radius:12px;border:1.5px solid #ddd;background:#fff;font-size:20px;cursor:pointer;transition:all .2s}
.bookmark-btn.active{background:#fff8e0;border-color:#f0a500}
.next-btn-wrap{flex:1}
/* Bookmark screen */
#screen-bookmarks{display:none;flex-direction:column;min-height:100vh;background:#f0f4f8}
.bm-header{background:#4a6cf7;color:#fff;padding:16px;display:flex;align-items:center;gap:12px}
.bm-header h2{font-size:17px;font-weight:700;margin:0;flex:1}
.bm-back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.bm-body{padding:16px;flex:1}
.bm-empty{text-align:center;color:#888;margin-top:60px;font-size:15px;line-height:2}
.bm-item{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.bm-item-subject{font-size:11px;color:#4a6cf7;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.bm-item-q{font-size:14px;color:#1a1a2e;line-height:1.6;margin-bottom:8px}
.bm-item-ref{font-size:12px;color:#888;background:#f0f4f8;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.bm-item-del{border:none;background:none;color:#e74c3c;font-size:12px;cursor:pointer;padding:0}
.bm-clear-btn{width:100%;padding:14px;border-radius:12px;border:1.5px solid #e74c3c;background:#fff;color:#e74c3c;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px}
/* home bookmark button */
.bm-home-btn{width:100%;padding:14px;border-radius:14px;border:1.5px solid #f0a500;background:#fff8e0;color:#c87800;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
/* SVG icon helpers */
.icon{display:inline-block;vertical-align:middle;flex-shrink:0}

/* Calc problem */
.calc-table-wrap{overflow-x:auto;margin-bottom:16px}
.calc-table{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border-radius:10px;overflow:hidden}
.calc-table th{background:#4a6cf7;color:#fff;padding:8px 10px;text-align:center;font-size:13px}
.calc-table td{padding:8px 10px;border:1px solid #e0e0e0;text-align:right}
.calc-table td:first-child{text-align:left;font-weight:600;color:#333;background:#f8f9ff}
.calc-table .target-row td{background:#fffbea}
.formula-box{background:#f8f9ff;border-left:4px solid #4a6cf7;border-radius:0 10px 10px 0;padding:12px;font-size:14px;color:#333;line-height:1.8;margin-bottom:14px;font-family:monospace}

/* ===== RESULT SCREEN ===== */
#screen-result{display:none;flex-direction:column;min-height:100vh;padding:24px 16px;background:#f0f4f8}
.result-header{text-align:center;margin-bottom:24px}
.result-score-circle{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,#4a6cf7,#6a3de8);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 20px rgba(74,108,247,.35)}
.result-score-num{font-size:44px;font-weight:700;color:#fff;line-height:1}
.result-score-denom{font-size:16px;color:rgba(255,255,255,.8)}
.result-pct{font-size:20px;font-weight:700;color:#2d3561;margin-bottom:4px}
.result-msg{font-size:14px;color:#666}
.result-stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px}
.result-stat{background:#fff;border-radius:14px;padding:16px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.result-stat .num{font-size:26px;font-weight:700}
.result-stat .lbl{font-size:11px;color:#888;margin-top:2px}
.result-stat.ok .num{color:#27ae60}
.result-stat.ng .num{color:#e74c3c}
.result-stat.skip .num{color:#888}
.weak-list-title{font-size:14px;font-weight:700;color:#333;margin-bottom:10px}
.weak-item{background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;font-size:13px;border-left:4px solid #e74c3c;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.weak-item .wq{font-weight:600;color:#1a1a2e;margin-bottom:4px;line-height:1.5}
.weak-item .wq u{color:#c0392b}
.weak-item .ws{font-size:11px;color:#888}
.result-btn-row{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.result-btn{width:100%;padding:16px;border-radius:14px;border:none;font-size:16px;font-weight:700;cursor:pointer}
.result-btn.primary{background:linear-gradient(135deg,#4a6cf7,#6a3de8);color:#fff;box-shadow:0 4px 15px rgba(74,108,247,.35)}
.result-btn.secondary{background:#fff;color:#4a6cf7;border:2px solid #4a6cf7}
.result-btn.danger{background:#fff;color:#e74c3c;border:2px solid #e74c3c}
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="screen-login">
  <div class="login-box">
    <div class="login-title">GMAP-BF 対策クイズ</div>
    <div class="login-sub">ログインしてください</div>
    <div class="login-field">
      <label>ユーザー名</label>
      <input type="text" id="login-user" placeholder="username" autocomplete="username">
    </div>
    <div class="login-field">
      <label>パスワード</label>
      <input type="password" id="login-pass" placeholder="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')checkLogin()">
    </div>
    <button class="login-btn" onclick="checkLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== TOP SCREEN ===== -->
<div id="screen-top">
  <div class="app-title">GMAP-BF 対策</div>
  <div class="app-sub">グロービス・マネジメント・アプティチュード</div>

  <div class="card">
    <div class="section-label">学習状況</div>
    <div class="stats-row" id="stats-row">
      <button class="stat-chip" onclick="showStatsList('total')"><div class="num" id="stat-total">0</div><div class="lbl">解答済み</div></button>
      <button class="stat-chip" onclick="showStatsList('correct')"><div class="num" id="stat-correct">0</div><div class="lbl">正解</div></button>
      <button class="stat-chip" onclick="showStatsList('weak')"><div class="num" id="stat-weak">0</div><div class="lbl">苦手</div></button>
    </div>
    <button class="reset-stats-btn" onclick="clearHistory()">
      <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/></svg>
      学習履歴をリセット
    </button>
  </div>

  <div class="card">
    <div class="section-label">科目を選ぶ</div>
    <div class="subject-grid">
      <button class="subject-btn all-btn active" onclick="selectSubject('全科目')">全科目（GMAP-BF）</button>
      <button class="subject-btn" onclick="selectSubject('経営戦略')">経営戦略</button>
      <button class="subject-btn" onclick="selectSubject('マーケティング')">マーケティング</button>
      <button class="subject-btn" onclick="selectSubject('アカウンティング')">アカウンティング</button>
      <button class="subject-btn" onclick="selectSubject('ファイナンス')">ファイナンス</button>
      <button class="subject-btn" onclick="selectSubject('人・組織')">人・組織</button>
      <button class="subject-btn" onclick="selectSubject('計算問題')">計算問題</button>
      <button class="extra-toggle" onclick="toggleExtra(this)">追加科目を表示 ▼</button>
      <div class="extra-subjects" id="extra-subjects">
        <button class="subject-btn extra" onclick="selectSubject('IT')">IT</button>
        <button class="subject-btn extra" onclick="selectSubject('ゲーム理論・交渉術')">ゲーム理論・交渉術</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="section-label">出題モード</div>
    <div class="mode-row">
      <button class="mode-btn active" onclick="selectMode('normal')" id="mode-normal">通常</button>
      <button class="mode-btn" onclick="selectMode('weak')" id="mode-weak">苦手のみ</button>
    </div>
    <div class="weak-warn" id="weak-warn">※苦手問題がまだありません</div>
  </div>

  <div class="card">
    <div class="section-label">出題数</div>
    <div class="count-row">
      <button class="count-btn active" onclick="selectCount(10)">10</button>
      <button class="count-btn" onclick="selectCount(20)">20</button>
      <button class="count-btn" onclick="selectCount(30)">30</button>
      <button class="count-btn" onclick="selectCount(999)">全問</button>
    </div>
  </div>

  <button class="start-btn" onclick="startQuiz()">スタート</button>
  <button class="bm-home-btn" id="bm-home-btn" onclick="showScreen('bookmarks')">
    <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="#f0a500" stroke="#c87800" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    あとで確認リスト <span id="bm-count-badge"></span>
  </button>
</div>

<!-- ===== STATS MODAL ===== -->
<div class="stats-modal-overlay" id="stats-modal-overlay" onclick="if(event.target===this)closeStatsModal()">
  <div class="stats-modal">
    <div class="stats-modal-hdr">
      <div class="stats-modal-title" id="stats-modal-title">解答済み問題</div>
      <button class="stats-modal-close" onclick="closeStatsModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="stats-modal-body" id="stats-modal-body"></div>
    <div class="stats-modal-footer">
      <button class="reset-stats-btn" onclick="clearHistoryFromModal()">
        <svg class="icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/></svg>
        全履歴をリセット
      </button>
    </div>
  </div>
</div>

<!-- ===== BOOKMARKS SCREEN ===== -->
<div id="screen-bookmarks">
  <div class="bm-header">
    <button class="bm-back" onclick="showScreen('top')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h2>
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1.5" style="margin-right:4px"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      あとで確認リスト
    </h2>
  </div>
  <div class="bm-body" id="bm-body"></div>
</div>

<!-- ===== QUIZ SCREEN ===== -->
<div id="screen-quiz">
  <div class="quiz-header">
    <button class="quiz-back" onclick="goTop()">✕</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="screen-result">
  <div class="result-header">
    <div class="result-score-circle">
      <div class="result-score-num" id="res-correct">0</div>
      <div class="result-score-denom" id="res-total">/ 0問</div>
    </div>
    <div class="result-pct" id="res-pct">0%</div>
    <div class="result-msg" id="res-msg"></div>
  </div>

const QUESTIONS = [{"id":1,"subject":"経営戦略","question":"経営戦略の3つのレベルに<u>含まれない</u>ものはのはどれか？","choices":["市場戦略","全社戦略","事業戦略","機能戦略"],"correct":0,"reference":"1-2 経営理念と戦略レベル","weight":2,"explanation":"経営戦略の3つのレベルは「全社戦略（企業全体の方向性）」「事業戦略（各事業での競争方法）」「機能戦略（マーケティング・財務・人事等の各機能の戦略）」。「市場戦略」というレベルは存在しない（マーケティング戦略は機能戦略の一部）。"},{"id":2,"subject":"経営戦略","question":"事業ドメイン、事業ポートフォリオ、多角化企業、シナジーに最も関係が深い、戦略レベルはどれか？","choices":["全社戦略","機能戦略","市場戦略","事業戦略"],"correct":0,"reference":"1-2 経営理念と戦略レベル","weight":2,"explanation":"「全社戦略」は企業全体の方向性を決める最上位の戦略レベル。事業ドメイン（何の事業をやるか）・事業ポートフォリオ（どの事業に投資するか）・多角化・シナジーといった全社的意思決定を扱う。BCGのPPMフレームワークはこの全社戦略策定ツール。"},{"id":3,"subject":"経営戦略","question":"人事戦略、財務戦略、生産戦略、開発戦略に最も関係が深い、戦略レベルはどれか？","choices":["機能戦略","市場戦略","全社戦略","事業戦略"],"correct":0,"reference":"1-2 経営理念と戦略レベル","weight":2,"explanation":"「機能戦略」は人事・財務・生産・開発など各機能部門ごとの戦略。事業戦略を実行するための具体的な機能レベルの計画。「事業戦略」はある特定事業での競合に対する競争方法（差別化・コストリーダーシップなど）を扱う。"},{"id":4,"subject":"経営戦略","question":"コア・コンピタンスの見極めに重要な5つの点に<u>含まれない</u>ものはどれか？","choices":["信頼性","希少性","移転可能性","代替可能性"],"correct":0,"reference":"1-5 全社戦略の構成要素（２）：コア・コンピタンスと資源配分","weight":3,"explanation":"コア・コンピタンスの見極めには「希少性（他社が持っていない）」「移転可能性（他事業に転用できる）」「代替可能性（他の手段に代えられない）」「耐久性（長期的に維持できる）」「市場価値性」の5点が重要。「信頼性」はこの5項目に含まれない。"},{"id":5,"subject":"経営戦略","question":"事業ポートフォリオの検討に必要な3つの視点に<u>含まれない</u>ものはどれか？","choices":["従業員満足度","事業の魅力度","競争上の優位性","事業間のシナジー"],"correct":0,"reference":"1-6 事業ポートフォリオと事業ライフサイクル","weight":3,"explanation":"事業ポートフォリオの検討には「①事業の魅力度（市場規模・成長率）」「②競争上の優位性（自社のシェアや強み）」「③事業間のシナジー（相互補完・コスト共有）」の3つの視点が必要。「従業員満足度」は事業評価の視点ではなく人事管理の指標。"},{"id":6,"subject":"経営戦略","question":"事業ライフサイクルの導入期について適切に説明しているものはどれか？","choices":["売上、利益が少なく、キャッシュフローもマイナス。PR活動が重要。","売上高、利益が急上昇。キャッシュフローもプラスに転じるが競合参入。","売上高低成長、利益低下するが、投資額が少ないのでキャッシュフローはプラス。","利益低下。新規投資不要で一部のリーダーは利益だすが、効率化必要。"],"correct":0,"reference":"1-6 事業ポートフォリオと事業ライフサイクル","weight":3,"explanation":"事業ライフサイクルの導入期は、製品・サービスの認知がまだ低く売上・利益ともに少ない。市場開拓にコストがかかるためキャッシュフローはマイナス。競合がいない間にPR活動を通じた認知拡大が重要な戦略となる。"},{"id":7,"subject":"経営戦略","question":"事業ライフサイクルの成長期について適切に説明しているものはどれか？","choices":["売上高、利益が急上昇。キャッシュフローもプラスに転じるが競合参入。","売上、利益が少なく、キャッシュフローもマイナス。PR活動が重要。","売上高低成長、利益低下するが、投資額が少ないのでキャッシュフローはプラス。","利益低下。新規投資不要で一部のリーダーは利益だすが、効率化必要。"],"correct":0,"reference":"1-6 事業ポートフォリオと事業ライフサイクル","weight":3,"explanation":"成長期は製品の認知が広まり売上・利益が急上昇する。キャッシュフローもプラスに転じるが、市場の魅力度が高まることで競合他社が参入してくる段階。市場シェアの確保が最重要課題となる。"},{"id":8,"subject":"経営戦略","question":"事業ライフサイクルの成熟期について適切に説明しているものはどれか？","choices":["売上高低成長、利益低下するが、投資額が少ないのでキャッシュフローはプラス。","売上高、利益が急上昇。キャッシュフローもプラスに転じるが競合参入。","売上、利益が少なく、キャッシュフローもマイナス。PR活動が重要。","利益低下。新規投資不要で一部のリーダーは利益だすが、効率化必要。"],"correct":0,"reference":"1-6 事業ポートフォリオと事業ライフサイクル","weight":3,"explanation":"成熟期は市場の成長が鈍化し売上高は低成長、利益も低下する。しかし設備投資の必要性が低いため、キャッシュフローはプラスを維持する。コスト削減と効率化による利益確保が重要な時期。"},{"id":9,"subject":"経営戦略","question":"市場成長率とマーケットシェアの高低で、製品や事業を「花形産業」、「問題児」、「金のなる木」、「負け犬」に分類した人物・もしくは団体はどれか？","choices":["BCG(ボストン・コンサルタント・グループ)","マイケル・ポーター","ミンツーバーグ","アンゾフ"],"correct":0,"reference":"1-7 ポートフォリオ・マトリクス","weight":3,"explanation":"PPM（プロダクト・ポートフォリオ・マネジメント）はBCG（ボストン・コンサルティング・グループ）が開発したフレームワーク。市場成長率と相対的マーケットシェアの2軸で事業・製品を「花形」「問題児」「金のなる木」「負け犬」に分類し、資源配分の意思決定に使う。"},{"id":10,"subject":"経営戦略","question":"PPMにおいて、市場成長率が高く、マーケットシェアが高い製品や事業を何と呼ぶか？","choices":["花形産業","問題児","金のなる木","負け犬"],"correct":0,"reference":"1-7 ポートフォリオ・マトリクス","weight":3,"explanation":"PPMで「花形産業（Star）」は市場成長率・マーケットシェアともに高い象限。高成長市場でのシェア維持に多くの投資が必要だが、収益も大きい。将来的に「金のなる木」に成長することが期待される。"},{"id":11,"subject":"経営戦略","question":"PPMにおいて、市場成長率が高く、マーケットシェアが低い製品や事業を何と呼ぶか？","choices":["問題児","花形産業","金のなる木","負け犬"],"correct":0,"reference":"1-7 ポートフォリオ・マトリクス","weight":3,"explanation":"「金のなる木（Cash Cow）」は市場成長率が低く、マーケットシェアが高い事業。成熟市場でのリーダーポジションのため、投資が少なくても安定的に利益・キャッシュを生み出す。他事業への資金源として機能する。"},{"id":12,"subject":"経営戦略","question":"PPMにおいて、市場成長率が低く、マーケットシェアが高い製品や事業を何と呼ぶか？","choices":["金のなる木","問題児","花形産業","負け犬"],"correct":0,"reference":"1-7 ポートフォリオ・マトリクス","weight":3,"explanation":"「問題児（Question Mark）」は市場成長率が高いが、マーケットシェアが低い事業。成長市場への参加は魅力だが、シェア向上には多額の投資が必要。投資継続か撤退かの意思決定が重要な事業。"},{"id":13,"subject":"経営戦略","question":"市場軸と製品軸を新規・既存で分類された事業拡大マトリクスを提唱した人物・もしくは団体はどれか？","choices":["アンゾフ","BCG(ボストン・コンサルタント・グループ)","マイケル・ポーター","アーカー"],"correct":0,"reference":"1-8 事業拡大と多角化の基本戦略","weight":2,"explanation":"アンゾフが「製品（既存・新規）×市場（既存・新規）」の2軸で事業拡大の方向性を分類したマトリクス（4象限）：市場浸透・新製品開発・市場開拓・多角化。BCGはPPM、ポーターは5つの力・バリューチェーン、アーカーはブランド・マネジメントで有名。"},{"id":14,"subject":"経営戦略","question":"事業拡大マトリクス(市場軸と製品軸)に第3の軸を追加した人物・もしくは団体はどれか？","choices":["アーカー","アンゾフ","BCG(ボストン・コンサルタント・グループ)","マイケル・ポーター"],"correct":0,"reference":"1-8 事業拡大と多角化の基本戦略","weight":2,"explanation":"アーカーがアンゾフの製品×市場の2軸マトリクスに第3の軸「企業スキル」を追加し、3次元マトリクスへと拡張した。これにより既存スキルの活用か、新スキルの開発かという観点が多角化戦略の分析に加わる。"},{"id":15,"subject":"経営戦略","question":"ポーターが提唱した3つの基本戦略に<u>含まれない</u>ものはどれか？","choices":["多角化戦略","コスト・リーダーシップ戦略","差別化戦略","集中戦略"],"correct":0,"reference":"1-9 ポートフォリオ・マトリクス","weight":3,"explanation":"「負け犬（Dog）」は市場成長率・マーケットシェアともに低い事業。利益創出力も低く、投資リターンが期待できない。原則として撤退や売却が推奨されるが、コスト管理を徹底して現金化を維持する場合もある。"},{"id":16,"subject":"経営戦略","question":"累積生産量が増加することによって・固定費・変動費ともに低減する現象を何と呼ぶか？","choices":["経験曲線","規模の経済","範囲の経済","費用体効果"],"correct":0,"reference":"1-10 事業の経済性分析","weight":3,"explanation":"規模の経済（Economies of Scale）は生産量の増加に伴い単位あたりコストが低下する効果。固定費の分散が主因。一方、範囲の経済（Economies of Scope）は複数の製品・事業を同時に展開することでコストが下がる効果（共有リソース・ブランドの転用など）。"},{"id":17,"subject":"経営戦略","question":"生産量を増やすことで単位当たりの固定費を低減することを何と呼ぶか？","choices":["規模の経済","経験曲線","範囲の経済","費用体効果"],"correct":0,"reference":"1-10 事業の経済性分析","weight":3,"explanation":"経験曲線効果（BCGが発見）とは、製品の累積生産量が倍増するたびにコストが一定割合（約20〜30%）低下する現象。学習効果・プロセス改善・規模の経済などが複合的に働く。市場シェアを高め経験を積むことがコスト競争力につながる。"},{"id":18,"subject":"経営戦略","question":"異なる複数の事業の共有可能なコストを一元化することにより経営を効率化することを何と呼ぶか？","choices":["範囲の経済","規模の経済","経験曲線","費用体効果"],"correct":0,"reference":"1-10 事業の経済性分析","weight":3,"explanation":"損益分岐点とは売上と総費用が等しくなる売上高のこと（利益がゼロの点）。損益分岐点売上高＝固定費÷限界利益率。限界利益率＝（売上高－変動費）÷売上高。固定費が高いビジネスほど損益分岐点が高くなるリスクがある。"},{"id":19,"subject":"経営戦略","question":"マクロ環境分析のフレームワークとして適切なものはどれか？","choices":["PEST","3C","SWOT","事業拡大マトリクス"],"correct":0,"reference":"1-11 外部環境分析","weight":3,"explanation":"PEST分析はマクロ環境を「Political（政治）・Economic（経済）・Social（社会）・Technological（技術）」の4つの切り口で分析するフレームワーク。外部環境の大きなトレンドや変化を把握するための手法。3C・SWOTと合わせて使われる。"},{"id":20,"subject":"経営戦略","question":"3C戦略に<u>含まれない</u>ものはどれか？","choices":["コスト分析","市場分析","競合分析","自社分析"],"correct":0,"reference":"1-11 外部環境分析","weight":3,"explanation":"3C分析は「Customer（顧客・市場）・Competitor（競合）・Company（自社）」の3つを分析するフレームワーク。「コスト分析」は3Cの項目に含まれない。顧客ニーズ・競合の動向・自社の強みを把握し、戦略立案の基礎とする。"},{"id":21,"subject":"経営戦略","question":"SWOT分析の項目について、正しく説明しているのはどれか？","choices":["内部分析：Strengths,Weaknesses 外部分析：Opotunities,Threats","内部分析：Styles,Weight 外部分析：Organization,Thinking","内部分析：Opotunities,Threats 外部分析：Style,Weaknesses","内部分析：Organization,Thinking 外部分析：Styles,Weight"],"correct":0,"reference":"1-11 外部環境分析","weight":3,"explanation":"SWOT分析では内部分析として「Strengths（強み）・Weaknesses（弱み）」、外部分析として「Opportunities（機会）・Threats（脅威）」を分析する。内部環境（自社コントロール可能）と外部環境（市場・競合・マクロ）を区別して分析するのがポイント。"},{"id":22,"subject":"経営戦略","question":"業界の収益性に影響を与える「5つの競争要因」を提唱した人物・もしくは団体はどれか？","choices":["マイケル・ポーター","アーカー","アンゾフ","BCG(ボストン・コンサルタント・グループ)"],"correct":0,"reference":"1-12 業界分析：業界構造と「５つの力」","weight":3,"explanation":"マイケル・ポーターが提唱した業界の収益性を決める「5つの競争要因（ファイブフォース）」：①新規参入の脅威、②代替品の脅威、③買い手の交渉力、④売り手（供給者）の交渉力、⑤業界内の既存競合他社の脅威。これら5力が強いほど業界収益性は低下する。"},{"id":23,"subject":"経営戦略","question":"業界の競争環境を分析する手法として「アドバンテージ・マトリクス」を提唱した人物・もしくは団体はどれか？","choices":["BCG(ボストン・コンサルタント・グループ)","マイケル・ポーター","アーカー","アンゾフ"],"correct":0,"reference":"1-13 業界分析：アドバンテージ・マトリクス","weight":3,"explanation":"アドバンテージ・マトリクスはBCGが提唱した業界分析ツール。「競争優位の源泉の数」と「優位性の大きさ」の2軸で4種類の業界タイプ（規模型・特化型・分散型・手づまり型）に分類する。業界特性に応じた競争戦略を考える際に使用される。"},{"id":24,"subject":"経営戦略","question":"アドバンテージ・マトリクスにおいて、計測器、医薬品などが分類される事業はどれか？","choices":["特化型事業","規模型事業","分散型事業","手づまり型事業"],"correct":0,"reference":"1-13 業界分析：アドバンテージ・マトリクス","weight":3,"explanation":"アドバンテージ・マトリクスにおける「特化型事業」は競争優位の源泉が多く（多様なニッチ戦略が可能）、各優位性の差異が大きい業界。医薬品・計測器などが該当。ニッチ特化で高収益が見込める。"},{"id":25,"subject":"経営戦略","question":"アドバンテージ・マトリクスにおいて、半導体、コンピュータ自動車などが分類される事業はどれか？","choices":["規模型事業","特化型事業","分散型事業","手づまり型事業"],"correct":0,"reference":"1-13 業界分析：アドバンテージ・マトリクス","weight":3,"explanation":"「規模型事業」は競争優位の源泉は少ないが、優位性の差が大きい業界。大量生産によるコスト優位が決定的に重要。半導体・コンピュータ・自動車などが該当。規模拡大によるコストダウンがカギ。"},{"id":26,"subject":"経営戦略","question":"アドバンテージ・マトリクスにおいて、規模が大きくなると収益率が低下する事業はどれか？","choices":["分散型事業","規模型事業","特化型事業","手づまり型事業"],"correct":0,"reference":"1-13 業界分析：アドバンテージ・マトリクス","weight":3,"explanation":"「分散型事業」は競争優位の源泉は多いが、各優位性の差は小さい業界（規模を大きくしても利益率が上がらない）。飲食業・サービス業などが該当。地域密着・差別化が重要で、大企業よりも中小企業が強みを発揮しやすい。"},{"id":27,"subject":"経営戦略","question":"事業活動を機能ごとに分類し、どの部分（機能）で付加価値が生み出されているか、競合と比較してどの部分に強み・弱みがあるかを分析し、事業戦略の有効性や改善の方向を探ることを何と呼ぶか？","choices":["バリューチェーン","PEST","差別化戦略","アドバンテージ・マトリクス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーン（価値連鎖）はマイケル・ポーターが提唱。企業活動を「購買物流→製造→出荷物流→販売・マーケティング→サービス（主活動）」と「全般管理・人事労務・技術開発・調達（支援活動）」に分解し、どの活動で付加価値を創出しているかを分析するフレームワーク。"},{"id":28,"subject":"経営戦略","question":"「バリューチェーン」を提唱した人物・もしくは団体はどれか？","choices":["マイケル・ポーター","アーカー","アンゾフ","BCG(ボストン・コンサルタント・グループ)"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの「主活動」は製品・サービスの直接的な創造・提供に関わる活動（購買物流・製造・出荷物流・販売マーケティング・サービス）。「支援活動」は主活動を支える全般管理・人事・技術・調達。コスト削減や差別化の源泉を活動ごとに特定できる。"},{"id":29,"subject":"経営戦略","question":"バリューチェーンにおける主活動に<u>含まれない</u>ものはどれか？","choices":["全般管理","購買物流","販売・マーケティング","サービス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの主活動（5つ）：購買物流・製造・出荷物流・販売・マーケティング・サービス。「全般管理」は支援活動に分類される（主活動ではない）。主活動は製品の物理的な流れに沿った活動群。"},{"id":30,"subject":"経営戦略","question":"バリューチェーンにおける主活動に<u>含まれない</u>ものはどれか？","choices":["人事・労務管理","出荷物流","製造","サービス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの主活動：購買物流・製造・出荷物流・販売マーケティング・サービス。「人事・労務管理」は支援活動に含まれる。支援活動は主活動を横断的に支える機能（全般管理・人事・技術開発・調達）。"},{"id":31,"subject":"経営戦略","question":"バリューチェーンにおける主活動に<u>含まれない</u>ものはどれか？","choices":["技術管理","出荷物流","製造","サービス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの主活動：購買物流・製造・出荷物流・販売マーケティング・サービス。「技術管理」（技術開発）は支援活動に含まれる。支援活動は全般管理・人事労務管理・技術開発・調達活動の4つ。"},{"id":32,"subject":"経営戦略","question":"バリューチェーンにおける主活動に<u>含まれない</u>ものはどれか？","choices":["調達活動","購買物流","販売・マーケティング","サービス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの主活動：購買物流・製造・出荷物流・販売マーケティング・サービス。「調達活動」は支援活動に含まれる。調達は原材料・設備の購入プロセスを指し、それ自体は製品の付加価値を直接生み出さないため支援活動に分類される。"},{"id":33,"subject":"経営戦略","question":"バリューチェーンにおける支援活動に含まれるものはどれか？","choices":["全般管理","購買物流","販売・マーケティング","サービス"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの支援活動（4つ）：①全般管理（企業インフラ）・②人事労務管理・③技術開発・④調達活動。「全般管理」は支援活動であり、「購買物流・販売マーケティング・サービス」は主活動に含まれる。"},{"id":34,"subject":"経営戦略","question":"バリューチェーンにおける支援活動に含まれるものはどれか？","choices":["人事・労務管理","製造","出荷物流","販売・マーケティング"],"correct":0,"reference":"1-14 内部分析：バリューチェーン（価値連鎖）","weight":3,"explanation":"バリューチェーンの支援活動：全般管理・人事労務管理・技術開発・調達活動。「人事・労務管理」は支援活動に含まれる。「製造・出荷物流・販売マーケティング」は主活動に属する。支援活動も競争優位の源泉となり得る点が重要。"},{"id":35,"subject":"経営戦略","question":"競争上のトップ企業を追随し、競合から極端から反撃されない戦略をとるのはどれか？","choices":["フォロワー","リーダー","チャレンジャー","ニッチャー"],"correct":0,"reference":"1-15 競争上の地位に応じた戦略","weight":1,"explanation":"コトラーの競争地位別戦略：「フォロワー」はリーダー企業の戦略を追随しつつ、反撃を招かないよう目立たない戦略をとる。「リーダー」は市場全体を拡大、「チャレンジャー」はリーダーへの挑戦、「ニッチャー」は特定市場への特化。"},{"id":36,"subject":"経営戦略","question":"成熟期の戦略として<u>適切でない</u>ものはどれか？","choices":["撤退メリットがデメリットを上回ったら、撤退の意思決定する。","製品構成の合理化と正しい価格政策をとる。","コスト競争力を強化する。","既存顧客への品揃えの充実させ、購買幅を拡張する。"],"correct":0,"reference":"1-16 事業ライフサイクルに応じた戦略","weight":1,"explanation":"成熟期の戦略：製品合理化・コスト強化・既存顧客への品揃え充実は適切。「撤退メリットがデメリットを上回ったら撤退」は成熟期ではなく衰退期に検討する意思決定。成熟期はまだ利益を創出できる段階であり、撤退判断は時期尚早。"},{"id":37,"subject":"経営戦略","question":"企業が競争優位を保てるかどうかは企業の経営資源とやケイパビリティ次第であるという考え方を何と呼ぶか？","choices":["リソース・ベースド・ビュー","コンピテンシー・ベースド・ビュー","アビリティ・ベースド・ビュー","ポテンシャル・ベースド・ビュー"],"correct":0,"reference":"1-17 戦略形成に関する見方","weight":1,"explanation":"RBV（リソース・ベースド・ビュー：資源ベース論）は「企業の競争優位は業界構造よりも、企業固有の経営資源（Resource）とケイパビリティ（Capability）次第」という考え方。ポーターの外部環境重視に対し、内部資源の独自性を重視する戦略論。"},{"id":38,"subject":"経営戦略","question":"特定の付加価値活動で優位性を築くビジネスモデルを何と呼ぶか？","choices":["レイヤーマスター","オーケストレーター","マーケット・メーカー","パーソナル・エージェント"],"correct":0,"reference":"1-19 バリューチェーンの再構築","weight":3,"explanation":"バリューチェーン再構築の「レイヤーマスター」は、特定の付加価値活動（レイヤー）に特化して優位性を築くビジネスモデル。例：OSや検索エンジンで特定レイヤーを独占するMicrosoftやGoogleのような戦略。業界横断的に特定機能を支配する。"},{"id":39,"subject":"経営戦略","question":"以下の例は、何というビジネスモデルに分類されるか？<br>(例)PCメーカーが部品メーカーの組織化と業務の外注による効率化を行う。","choices":["オーケストレーター","レイヤーマスター","マーケット・メーカー","パーソナル・エージェント"],"correct":0,"reference":"1-19 バリューチェーンの再構築","weight":3,"explanation":"「オーケストレーター」はバリューチェーンの設計・管理・組織化（オーケストラの指揮者的役割）に特化し、実際の製造・物流などを外部に委託するビジネスモデル。PCメーカーが部品調達と組立を外部委託するケースが典型例。コア機能に集中しつつ全体をマネジメントする。"},{"id":40,"subject":"経営戦略","question":"既存チャネルの弱みや欠陥をついて新市場を開拓するビジネスモデルを何と呼ぶか？","choices":["マーケット・メーカー","レイヤーマスター","オーケストレーター","パーソナル・エージェント"],"correct":0,"reference":"1-19 バリューチェーンの再構築","weight":3,"explanation":"「マーケット・メーカー」は既存流通チャネルの弱みや欠陥をつき、新しい市場を開拓・仲介するビジネスモデル。既存の非効率な流通を打破し、売り手と買い手を効率的につなぐ新しい場（マーケット）を作る。ネットオークションやECプラットフォームなどが代表例。"},{"id":41,"subject":"経営戦略","question":"以下の例は、何というビジネスモデルに分類されるか？<br>(例)ネット上の情報を整理するナビゲータが購買代理店として機能する。","choices":["パーソナル・エージェント","オーケストレーター","レイヤーマスター","マーケット・メーカー"],"correct":0,"reference":"1-19 バリューチェーンの再構築","weight":3,"explanation":"「パーソナル・エージェント」はネット上の情報を整理・フィルタリングし、顧客の購買代理人として最適な選択を支援するビジネスモデル。顧客の好みや行動データを活用して個別化されたナビゲーション・推薦を提供する（レコメンドエンジンなど）。"},{"id":42,"subject":"マーケティング","question":"以下のうち、マーケティング・ミックスに最も関係が深いものはのはどれか？","choices":["4P","5R","6 Tools","5つの競争要因"],"correct":0,"reference":"2-3 マーケティング・マネジメント","weight":3,"explanation":"マーケティング・ミックスは「4P：Product（製品）・Price（価格）・Place（流通）・Promotion（プロモーション）」の組み合わせ。顧客視点からは「4C：Customer Value・Cost・Convenience・Communication」とも整理される。「5R」「6 Tools」は別のフレームワーク。"},{"id":43,"subject":"マーケティング","question":"SWOT分析の項目について、正しく説明しているのはどれか？","choices":["内部分析：Strengths,Weaknesses 外部分析：Opotunities,Threats","内部分析：Styles,Weight 外部分析：Organization,Thinking","内部分析：Opotunities,Threats 外部分析：Style,Weaknesses","内部分析：Organization,Thinking 外部分析：Styles,Weight"],"correct":0,"reference":"2-4 市場の機会の発見","weight":3,"explanation":"SWOT分析：内部環境分析は「Strengths（強み）・Weaknesses（弱み）」、外部環境分析は「Opportunities（機会）・Threats（脅威）」。SとWは自社のコントロール可能な要因、OとTは市場・競合・マクロ環境など自社がコントロールできない外部要因を指す。"},{"id":44,"subject":"マーケティング","question":"SWOT分析によって導き出すものとして、もっとも適切なものはどれか？","choices":["KSF","KBF","KPI","KBI"],"correct":0,"reference":"2-4 市場の機会の発見","weight":3,"explanation":"SWOT分析から導き出すのは「KSF（Key Success Factors：重要成功要因）」。市場での競合優位性を得るために何が必要かを特定する。KBFは顧客の購買決定要因。KPIは業績評価指標。SWOTは現状分析のツールで、その後の戦略オプション検討につなげる。"},{"id":45,"subject":"マーケティング","question":"ポジショニング成功のために<u>不適切なもの</u>はどれか？","choices":["想定する顧客像を明確にし過ぎないこと","顧客に正確に伝わること","顧客にとって共感できること","企業全体のポジショニングと整合しいること"],"correct":0,"reference":"2-7 ポジショニング","weight":3,"explanation":"ポジショニング成功の条件：「顧客に正確に伝わること」「顧客にとって共感できること（ニーズに合致）」「企業全体のポジショニングと整合していること」が必要。「想定する顧客像を明確にし過ぎないこと」は誤り。ターゲット顧客像を明確に絞り込むことがポジショニングの基本。"},{"id":46,"subject":"マーケティング","question":"購買プロセス上、消費者が特別な努力せず頻繁に購入購入するものは、何と呼ばれる？","choices":["最寄品","買回品","専門品","比較品"],"correct":0,"reference":"2-8 製品特性","weight":3,"explanation":"「最寄品」は消費者が特別な努力をせず頻繁・習慣的に購入する製品（食品・日用品・コンビニ商品など）。「買回品」は比較検討して購入、「専門品」は特別な知識・趣味性が必要な製品（高級時計・専門書など）。購買プロセスの違いが流通・プロモーション戦略に影響する。"},{"id":47,"subject":"マーケティング","question":"購買プロセス上、いくつかの製品を比較検討して購入するものは、何と呼ばれる？","choices":["買回品","最寄品","専門品","比較品"],"correct":0,"reference":"2-8 製品特性","weight":3,"explanation":"「買回品」は複数の製品・店舗を比較検討してから購入する製品（家電・衣料品・家具など）。品質・価格・デザインを比較するため、店舗の品揃えや比較しやすい陳列が重要。最寄品より購買頻度は低い。"},{"id":48,"subject":"マーケティング","question":"購買プロセス上、特別な知識や趣味性を要するものは、何と呼ばれる？","choices":["専門品","買回品","最寄品","比較品"],"correct":0,"reference":"2-8 製品特性","weight":3,"explanation":"「専門品」は購買に特別な知識・趣味性・こだわりを必要とする製品（楽器・スポーツ用品・高級ブランド品・専門医薬品など）。顧客は特定ブランドへの強い選好を持ち、購入のために特別な努力（遠出・調査）をいとわない。"},{"id":49,"subject":"マーケティング","question":"ブランドの役割として、<u>関係のない説明</u>をしているのはどれか？","choices":["生産～販売を効率化する「流通」機能","購買に関する情報処理の時間やコストを節約する「識別」機能","購買リスクの軽減・回避に役立つ「品質保証」機能","満足感の高まり、自己実現の手段になる「意味づけ」機能"],"correct":0,"reference":"2-9 ブランド","weight":3,"explanation":"ブランドの役割は主に3つ：①「識別」機能（購買時の情報処理コスト節約）②「品質保証」機能（購買リスクの軽減）③「意味づけ」機能（自己実現・自己表現の手段）。「生産〜販売を効率化する流通機能」はブランドの直接的な役割ではない（流通効率化はブランド効果の間接的恩恵）。"},{"id":50,"subject":"マーケティング","question":"新製品開発プロセスとして、適切なものはどれか？","choices":["コンセプト開発→仮説検討→製品化→市場参入","コンセプト開発→製品化→仮説検討→市場参入","仮説検討→コンセプト開発→市場参入→製品化","仮説検討→コンセプト開発→製品化→市場参入"],"correct":0,"reference":"2-10 新製品開発","weight":3,"explanation":"新製品開発のプロセス：「①コンセプト開発（顧客ニーズ把握・アイデア創出）→②仮説検討（市場調査・フィージビリティ評価）→③製品化（プロトタイプ開発・テスト）→④市場参入（ローンチ・拡販）」の順序が正しい。"},{"id":51,"subject":"マーケティング","question":"イノベーター（革新者）とは、どのような顧客タイプか？","choices":["仲間内で情報交換するが他の購買層に影響与えない。","オピニオン・リーダーとして影響力もつ。","成長期の中心的顧客。","流行に無関心。"],"correct":0,"reference":"2-11 製品ライフサイクル","weight":3,"explanation":"イノベーター（革新者）はロジャーズの普及理論における最初の採用者層（全体の約2.5%）。新技術をいち早く試したい好奇心旺盛な人々で、仲間内での情報交換は活発だが、広い購買層への影響力は限定的。市場普及の起点となる層。"},{"id":52,"subject":"マーケティング","question":"アーリー・アダプタ（初期採用者）とは、どのような顧客タイプか？","choices":["オピニオン・リーダーとして影響力もつ。","仲間内で情報交換するが他の購買層に影響与えない。","成長期の中心的顧客。","流行に無関心。"],"correct":0,"reference":"2-11 製品ライフサイクル","weight":3,"explanation":"アーリー・アダプター（初期採用者、全体の約13.5%）はオピニオン・リーダーとして周囲への影響力が大きい。新製品を評価し積極的に情報発信するため、製品の普及において最も重要な層。この層を獲得できれば「キャズム」を越えて大衆市場への普及が加速する。"},{"id":53,"subject":"マーケティング","question":"フォロワー（初期大衆）とは、どのような顧客タイプか？","choices":["成長期の中心的顧客。","オピニオン・リーダーとして影響力もつ。","仲間内で情報交換するが他の購買層に影響与えない。","流行に無関心。"],"correct":0,"reference":"2-11 製品ライフサイクル","weight":3,"explanation":"アーリー・マジョリティ（フォロワー/初期大衆、全体の約34%）は成長期の中心的顧客層。信頼できる人の推薦や実績を見て購入を決める慎重派。この層を取り込めれば製品は本格的な普及フェーズに入る。"},{"id":54,"subject":"マーケティング","question":"価格決定に影響を与える要素として、最も<u>関連性の低いもの</u>はどれか？","choices":["法規制","コスト","カスタマー・バリュー","競争環境"],"correct":0,"reference":"2-13 戦略的価格設定","weight":3,"explanation":"価格決定に影響する主要要素は「コスト・顧客バリュー・競争環境・企業の目標利益」など。「法規制」（例：価格カルテル禁止・薬価規制）は例外的な制約となるが、一般的な価格決定の主要要素ではないため最も関連性が低い。"},{"id":55,"subject":"マーケティング","question":"市場シェア獲得のため価格をコストと同じかそれ以下にする価格決定方法は何と呼ばれるか？","choices":["ペネトレーション・プライシング","スキミング・プライシング","ターゲット・プライシング","マークアップ・プライシング"],"correct":0,"reference":"2-13 戦略的価格設定","weight":3,"explanation":"ペネトレーション・プライシング（浸透価格戦略）は市場参入時にコスト以下の低価格設定でシェアを素早く獲得する手法。逆に「スキミング・プライシング」は高価格から始め徐々に下げる手法（革新的製品・ブランド品に多い）。"},{"id":56,"subject":"マーケティング","question":"流通チャネルの3つのフローに<u>含まれない</u>ものは？","choices":["市流","物流","商流","情報流"],"correct":0,"reference":"2-14 流通チャネルの意義","weight":3,"explanation":"流通チャネルの「3つのフロー」は「①物流（モノの移動）②商流（所有権の移動）③情報流（情報の移動）」。「市流」という概念は存在しない。なお「金流（資金の流れ）」を加えて4つのフローとする場合もある。"},{"id":57,"subject":"マーケティング","question":"仲介業者持たず、顧客のネットワークをフル活用する方式を何と呼ぶか？","choices":["マルチレベル方式","フランチャイズ方式","ライセンス方式","トレードマーク方式"],"correct":0,"reference":"2-14 流通チャネルの意義","weight":3,"explanation":"マルチレベル方式（MLM/ネットワークマーケティング）は仲介業者を持たず、顧客・販売員のネットワークを活用して商品を流通させる方式。アムウェイなどが代表例。一般流通を介さず個人間のつながりで販売する。"},{"id":58,"subject":"マーケティング","question":"ビジネスシステムの提供者が特定地域内におけるビジネスの展開、トレードマーク使用権、ノウハウなどを提供する方式を何と呼ぶか？","choices":["フランチャイズ方式","マルチレベル方式","ライセンス方式","トレードマーク方式"],"correct":0,"reference":"2-14 流通チャネルの意義","weight":3,"explanation":"フランチャイズ方式は、ビジネスシステムの提供者（フランチャイザー）が加盟者（フランチャイジー）に対して特定地域での営業権・商標使用権・ノウハウを提供し、加盟者は対価（ロイヤリティ）を支払うビジネスモデル。コンビニ・飲食チェーンなどで広く活用される。"},{"id":59,"subject":"マーケティング","question":"自社ブランドのカテゴリ別使用権を第三者に与え、売り上げに応じてロイヤリティを徴収する方式を何と呼ぶか？","choices":["ライセンス方式","フランチャイズ方式","マルチレベル方式","トレードマーク方式"],"correct":0,"reference":"2-14 流通チャネルの意義","weight":3,"explanation":"ライセンス方式は自社ブランドや特許などの知的財産の使用権（ライセンス）を第三者に付与し、売上に応じたロイヤリティを受け取るビジネスモデル。フランチャイズとの違いは、ノウハウ・システム全体ではなく「ブランド使用権」の供与が主体という点。"},{"id":60,"subject":"マーケティング","question":"メーカーが直営店で販売するのは、何段階チャネルか？","choices":["0段階チャネル","1段階チャネル","2段階チャネル","3段階チャネル"],"correct":0,"reference":"2-14 流通チャネルの意義","weight":3,"explanation":"流通チャネルの「段階数」はメーカーと消費者の間の仲介業者の数で決まる。メーカーが直営店で直接販売する場合は仲介業者がゼロ＝「0段階チャネル（直接流通）」。メーカー→小売→消費者は1段階、メーカー→卸→小売→消費者は2段階チャネル。"},{"id":61,"subject":"マーケティング","question":"販売先限定せず広範囲に販売したい場合、最も適した流通政策はどれか？","choices":["開放的流通政策","選択的流通政策","排他的流通政策","優先的流通政策"],"correct":0,"reference":"2-15 流通チャネルの構築プロセス","weight":3,"explanation":"「開放的流通政策」は販売先を限定せず、できるだけ多くの流通業者に扱ってもらうことで広範囲にリーチする政策。日用品・食品などに向いている。逆に「選択的」は一部業者を選び、「排他的」は独占販売権を付与する。"},{"id":62,"subject":"マーケティング","question":"仲介業者の力、メーカーへの協力度合い、立地など照らして選定した流通業者に優先的に販売させたい場合、最も適した流通政策はどれか？","choices":["選択的流通政策","開放的流通政策","排他的流通政策","優先的流通政策"],"correct":0,"reference":"2-15 流通チャネルの構築プロセス","weight":3,"explanation":"「選択的流通政策」は特定の基準（仲介業者の販売力・立地・協力度合い）に基づき流通業者を絞り込み、選ばれた業者に優先的に販売させる政策。家電・化粧品などに多い。品質管理と販売力のバランスを取れる手法。"},{"id":63,"subject":"マーケティング","question":"独占販売権与えるかわりに同業他社製品取扱禁止させたい場合、最も適した流通政策はどれか？","choices":["排他的流通政策","開放的流通政策","選択的流通政策","優先的流通政策"],"correct":0,"reference":"2-15 流通チャネルの構築プロセス","weight":3,"explanation":"「排他的流通政策」は特定地域で独占販売権を与える代わりに他社競合品の取り扱いを禁止する政策。ブランド管理や価格コントロールが容易になる。高級ブランド品・特定メーカー専売店に多く見られる。"},{"id":64,"subject":"マーケティング","question":"AIDMAが示す購入までのプロセスとして、適切なものはどれか？","choices":["注意→興味→欲求→記憶→行動","注意→興味→欲求→検索→行動","注意→興味→欲求→確信→行動","注意→興味→欲求→評価→行動"],"correct":0,"reference":"2-16 購買決定プロセスとコミュニケーション手段","weight":2,"explanation":"AIDMA（アイドマ）モデルは消費者の購買プロセス：Attention（注意）→Interest（興味）→Desire（欲求）→Memory（記憶）→Action（行動）。AIDASはS=Satisfaction（満足）、AISASはS=Search（検索）+S=Share（共有）でデジタル時代に対応。"},{"id":65,"subject":"マーケティング","question":"広告など利用し直接顧客に働きかけて、指名買いさせる戦略はどれか？","choices":["プル戦略","プッシュ戦略","アクティブ戦略","パッシブ戦略"],"correct":0,"reference":"2-16 購買決定プロセスとコミュニケーション手段","weight":2,"explanation":"プル戦略は広告などで消費者に直接働きかけ、消費者が店舗へ商品を「引っ張る（Pull）」よう指名買いを促す戦略。対してプッシュ戦略は流通・小売へのインセンティブで店頭での積極販売を「押す（Push）」戦略。"},{"id":66,"subject":"アカウンティング","question":"流動負債について、正しく説明しているのはどれか？","choices":["営業サイクル中または短期間に支払う負債である。","長期的（1年を超える）負債である。","主に財務活動（資金調達活動）に対応する。","社債、退職給付引当金、賞与引当金などがある。"],"correct":0,"reference":"3-7 貸借対照表（負債＋純資産）","weight":3,"explanation":"流動負債は「営業サイクル内または1年以内に支払いが発生する負債」。支払手形・買掛金・未払費用・短期借入金などが該当。固定負債（社債・長期借入金・退職給付引当金）と区別して、企業の短期的な支払い能力を評価する際の基準となる。"},{"id":67,"subject":"アカウンティング","question":"固定負債について、<u>誤った説明</u>をしているのはどれか？","choices":["支払手形、買掛金、未払費用、未払金などがある。","長期的（1年を超える）負債である。","社債、退職給付引当金などがある。","主に財務活動（資金調達活動）に対応する。"],"correct":0,"reference":"3-7 貸借対照表（負債＋純資産）","weight":3,"explanation":"固定負債は1年を超える長期の負債。社債・長期借入金・退職給付引当金などが該当し、主に設備投資などの財務活動（資金調達）に対応する。「支払手形・買掛金・未払費用・未払金」は流動負債であり、固定負債の説明としては誤り。"},{"id":68,"subject":"アカウンティング","question":"成長中の企業について、適切に説明をしているのはどれか？","choices":["営業収支：マイナス、投資活動：マイナス、財務活動：プラス","営業収支：プラス、投資活動：マイナス、財務活動：プラス","営業収支：プラス 、投資活動：マイナス、財務活動：均衡状態","営業収支：プラス 、投資活動：抑え気味、財務活動：マイナス"],"correct":0,"reference":"3-8 キャッシュフロー計算書","weight":3,"explanation":"成長中の企業のCF特徴：「営業CF：マイナス（事業がまだ黒字化していない）・投資CF：マイナス（成長のための積極投資）・財務CF：プラス（資金調達・借入）」。スタートアップや急成長企業がこのパターンを示す。"},{"id":69,"subject":"アカウンティング","question":"安定期の企業について、適切に説明をしているのはどれか？","choices":["営業収支：プラス 、投資活動：マイナス、財務活動：均衡状態","営業収支：マイナス、投資活動：マイナス、財務活動：プラス","営業収支：プラス 、投資活動：抑え気味、財務活動：マイナス","営業収支：マイナス、投資活動：マイナス、財務活動：プラス"],"correct":0,"reference":"3-8 キャッシュフロー計算書","weight":3,"explanation":"安定期の企業のCF特徴：「営業CF：プラス（本業で安定的に稼いでいる）・投資CF：マイナス（既存事業の維持・更新投資）・財務CF：均衡状態（借入・返済がバランス）」。成熟した健全企業が示す典型パターン。"},{"id":70,"subject":"アカウンティング","question":"成熟期の企業について、適切に説明をしているのはどれか？","choices":["営業収支：プラス 、投資活動：抑え気味、財務活動：マイナス","営業収支：プラス 、投資活動：マイナス、財務活動：均衡状態","営業収支：マイナス、投資活動：マイナス、財務活動：プラス","営業収支：マイナス、投資活動：マイナス、財務活動：プラス"],"correct":0,"reference":"3-8 キャッシュフロー計算書","weight":3,"explanation":"成熟・衰退期の企業のCF特徴：「営業CF：プラス・投資CF：抑え気味（設備更新は最小限）・財務CF：マイナス（借入返済・配当支払い）」。本業の収益で借入を返済しながら株主に還元するフェーズ。"},{"id":71,"subject":"アカウンティング","question":"子会社・連結会社の基準について、<u>誤った説明</u>をしているのはどれか？","choices":["持ち株が50%未満の場合、子会社とは認定されない。","親会社が過半数の株式所有している場合、子会社と認定される。","親会社が20%以上50%以下の議決権付き株式を所有している場合、連結会社と認定される。","親会社と連結子会社のBSを合算するが、内部の取引項目は相殺する。"],"correct":0,"reference":"3-9 連結会計","weight":2,"explanation":"子会社認定：親会社が過半数（50%超）の議決権を持つ場合に子会社。持ち株50%未満でも実質支配の場合は子会社になりうる（「50%未満は子会社にならない」は誤り）。持ち株20〜50%は「関連会社」（連結ではなく持分法適用）。"},{"id":72,"subject":"アカウンティング","question":"財務会計の視点で計算した今期の納税額よりも税務会計で計算した納税額が少ない場合について、適切に説明をしているのはどれか？","choices":["将来の租税負担として「繰延税金負債」を計上する。","将来の租税負担として「繰延税金資産」を計上する。","将来の租税負担として「繰上げ税金負債」を計上する。","将来の租税負担として「繰上げ税金資産」を計上する。"],"correct":0,"reference":"3-10 税効果会計と退職給付会計","weight":2,"explanation":"財務会計上の税額＞税務会計上の税額の場合、今期は少ない税金を払うが将来は多く払う。この将来負担を「繰延税金負債」として計上する。逆に財務上＜税務上（今期多く払う）なら将来の節税効果を「繰延税金資産」として計上。"},{"id":73,"subject":"アカウンティング","question":"売買目的の有価証券の計上基準はどれか？","choices":["時価法","低価法","原価法","償却原価法"],"correct":0,"reference":"3-11 有価証券(時価会計)","weight":2,"explanation":"有価証券の計上基準：売買目的有価証券→時価法（期末に時価評価、評価損益をP/Lに計上）。短期的な売買益狙いの有価証券は市場価値を随時反映させる必要がある。"},{"id":74,"subject":"アカウンティング","question":"満期保有目的の債権の計上基準はどれか？","choices":["償却原価法","時価法","低価法","原価法"],"correct":0,"reference":"3-11 有価証券(時価会計)","weight":2,"explanation":"満期保有目的債券→償却原価法（取得原価と額面価格の差額を満期まで期間按分して加減する）。長期保有目的のため時価変動は計上しない。満期時に確実に額面で償還されることが前提。"},{"id":75,"subject":"アカウンティング","question":"子会社・関連会社株式の計上基準はどれか？","choices":["原価法","償却原価法","時価法","低価法"],"correct":0,"reference":"3-11 有価証券(時価会計)","weight":2,"explanation":"子会社・関連会社株式→原価法（取得原価のまま計上、時価変動は反映しない）。支配・影響力の行使を目的とした長期保有であり、市場価格の変動で価値が変わらないとみなされる。"},{"id":76,"subject":"アカウンティング","question":"ROA(ReturnOnAssets)について、適切に説明をしているのはどれか？","choices":["利益／総資産","利益／売上高","売上高／総資産","利益／負債"],"correct":0,"reference":"3-12 総合力分析：ROAとROE","weight":3,"explanation":"ROA（Return on Assets：総資産利益率）＝利益÷総資産×100%。企業が保有する全資産（負債＋純資産）をどれだけ効率的に使って利益を生んでいるかを示す総合的な収益性指標。ROAが高いほど資産の活用効率が良い。"},{"id":77,"subject":"アカウンティング","question":"ROE(ReturnOnEquty)について、適切に説明をしているのはどれか？","choices":["利益／自己資本","総資産／自己資本","売上高／総資産","利益／総資産"],"correct":0,"reference":"3-12 総合力分析：ROAとROE","weight":3,"explanation":"ROE（Return on Equity：自己資本利益率）＝利益÷自己資本×100%。株主が拠出した資本（純資産）に対してどれだけの利益を生んでいるかを示す。株主にとって最重要な収益性指標の一つ。デュポン分析でROEを「利益率×回転率×レバレッジ」に分解できる。"},{"id":78,"subject":"アカウンティング","question":"売上高営業利益率（営業利益／売上高について）、<u>誤った説明</u>をしているのはどれか？","choices":["財務活動なども含めた通常の企業活動における利益率を示す。","本業の利益率が高いかどうかを示す。","販売活動や管理活動の効率性を示す。","広告宣伝費の金額比較でマーケティング戦略の相違などが把握できる。"],"correct":0,"reference":"3-13 収益性分析","weight":3,"explanation":"売上高営業利益率（＝営業利益÷売上高）は本業の収益性を示す指標。営業利益とは売上高から売上原価・販売費及び一般管理費を差し引いた利益（本業の利益）。この指標が高いほど本業での稼ぐ力が強い。財務活動（金利等）の影響は含まない。"},{"id":79,"subject":"アカウンティング","question":"インタレスト・カバレッジ・レシオについて、適切に説明をしているのはどれか？","choices":["事業利益が支払うべき金利の何倍あるか、金利支払能力を示す指標。","固定資産の調達がどれだけ純資産によって賄われているかを示す指標。","流動資産のうち現金化しにくい棚卸資産などを除いたもの。","短期間（1年以内）に現金化される資産と、短期間に返済すべき負債の比率。"],"correct":0,"reference":"3-14 安全性分析","weight":3,"explanation":"インタレスト・カバレッジ・レシオ＝事業利益（営業利益＋受取利息等）÷支払利息。企業が支払うべき金利の何倍の事業利益を稼いでいるかを示す金利支払能力の指標。値が高いほど金利負担に対する余裕がある。一般に1.5倍以上が安全水準の目安とされる。"},{"id":80,"subject":"アカウンティング","question":"固定比率の算出方法について、適切に説明をしているのはどれか？","choices":["固定資産／純資産","固定資産／流動資産","固定資産／(負債+純資産)","固定資産／(純資産+固定負債)"],"correct":0,"reference":"3-14 安全性分析","weight":3,"explanation":"固定比率＝固定資産÷純資産（×100%）。固定資産が自己資本（純資産）でどれだけ賄われているかを示す指標。100%以下が望ましい（固定資産を全額自己資本で調達できている状態）。高いほど長期的な財務リスクが高い。"},{"id":81,"subject":"アカウンティング","question":"配当性向の算出方法について、適切に説明をしているのはどれか？","choices":["配当金総額／税引き後当期純利益","税引き後当期純利益／発行済み株式数","時価総額／税引き後当期純利益","株価／1株当たりの純資産額"],"correct":0,"reference":"3-15 株式市場が企業評価する指標","weight":3,"explanation":"配当性向＝配当金総額÷税引き後当期純利益（×100%）。当期利益のうち何%を配当として株主に還元したかを示す指標。高いほど株主還元が手厚い一方、内部留保が少なく成長投資に使える資金が限られる。"},{"id":82,"subject":"アカウンティング","question":"EPSの算出方法について、適切に説明をしているのはどれか？","choices":["税引き後当期純利益／発行済み株式数","配当金総額／税引き後当期純利益","時価総額／税引き後当期純利益","株価／1株当たりの純資産額"],"correct":0,"reference":"3-15 株式市場が企業評価する指標","weight":3,"explanation":"EPS（Earnings Per Share：1株当たり純利益）＝税引き後当期純利益÷発行済み株式数。1株が生み出す利益の大きさを示し、株式の収益力評価に使われる。EPSが高いほど投資家にとって魅力的。"},{"id":83,"subject":"アカウンティング","question":"PERの算出方法について、適切に説明をしているのはどれか？","choices":["時価総額／税引き後当期純利益","税引き後当期純利益／発行済み株式数","配当金総額／税引き後当期純利益","株価／1株当たりの純資産額"],"correct":0,"reference":"3-15 株式市場が企業評価する指標","weight":3,"explanation":"PER（株価収益率）＝時価総額÷税引き後当期純利益（または株価÷EPS）。現在の株価が利益の何倍かを示す。PERが高いほど「割高」または「成長期待が高い」と評価される。業種や成長ステージにより適切な水準は異なる。"},{"id":84,"subject":"アカウンティング","question":"PBRの算出方法について、適切に説明をしているのはどれか？","choices":["株価／1株当たりの純資産額","時価総額／税引き後当期純利益","税引き後当期純利益／発行済み株式数","配当金総額／税引き後当期純利益"],"correct":0,"reference":"3-15 株式市場が企業評価する指標","weight":3,"explanation":"PBR（株価純資産倍率）＝株価÷1株当たり純資産（BPS）。純資産（帳簿価値）の何倍で株が取引されているかを示す。PBR1倍未満は「解散価値以下」で割安とされる。成長性・収益性が高い企業ほどPBRは高くなる傾向。"},{"id":85,"subject":"アカウンティング","question":"たな卸資産の評価方法について、<u>誤った用語</u>はどれか？","choices":["先入後出法","先入先出法","後入先出法","平均法"],"correct":0,"reference":"3-16 たな卸資産","weight":2,"explanation":"たな卸資産の評価方法：先入先出法・後入先出法・移動平均法・総平均法・個別法・最終仕入原価法などが使われる。「先入後出法」という用語は存在しない（先入先出法と後入先出法があり、「先入後出」は誤った名称）。"},{"id":86,"subject":"アカウンティング","question":"減価償却の定額法の算出方法について、適切に説明しているのはどれか？","choices":["（取得原価－残存価値）×（１÷耐用年数）","（取得原価－減価償却費の累計）×償却率","（取得原価－残存価値）×償却率","（取得原価－減価償却費の累計）×（１÷耐用年数）"],"correct":0,"reference":"3-17 減価償却と固定資産","weight":2,"explanation":"定額法の減価償却費＝（取得原価－残存価値）×（1÷耐用年数）。毎年均等額を費用計上。残存価値は従来10%だったが現在は1円まで償却可能。「残存価値」を差し引いてから耐用年数で割る点がポイント。"},{"id":87,"subject":"アカウンティング","question":"減価償却の定率法の算出方法について、適切に説明しているのはどれか？","choices":["（取得原価－減価償却費の累計）×償却率","（取得原価－残存価値）×（１÷耐用年数）","（取得原価－残存価値）×償却率","（取得原価－減価償却費の累計）×（１÷耐用年数）"],"correct":0,"reference":"3-17 減価償却と固定資産","weight":2,"explanation":"定率法の減価償却費＝（取得原価－減価償却費の累計）×償却率。未償却残高（帳簿価額）に一定率を掛ける。初年度の費用が最も大きく、年々逓減する。設備の経済的価値が早期に減少するものに適している。"},{"id":88,"subject":"アカウンティング","question":"売上：290万円、変動費：60万円、固定費：70万円の時、損益分岐点売上高に一番近いのはどれか？","choices":["88万円","79万円","76万円","92万円"],"correct":0,"reference":"3-18 損益分岐点分析","weight":3,"explanation":"損益分岐点売上高の計算：限界利益率＝（売上290万－変動費60万）÷売上290万≒0.793。損益分岐点売上高＝固定費70万÷0.793≒88万円。選択肢の中で最も近いのは88万円。"},{"id":89,"subject":"アカウンティング","question":"会計上の原価計算方法として、適切なものはどれか？","choices":["全部原価計算","部分原価計算","直接原価計算","間接原価計算"],"correct":0,"reference":"3-19 原価計算","weight":3,"explanation":"会計上の正式な原価計算方法は「全部原価計算」。製造に関わるすべての費用（直接材料費・直接労務費・製造間接費）を製品原価に含める方法。「直接原価計算」は変動費のみ製品に配賦する管理会計上の手法で、外部報告（財務会計）には使用が認められていない。"},{"id":90,"subject":"アカウンティング","question":"BSC（BalancedScorecard）の4つの視点に<u>含まれない</u>ものはどれか？","choices":["マーケティング","財務","顧客","学習"],"correct":0,"reference":"3-20 マネジメント・コントロール","weight":2,"explanation":"BSC（バランスト・スコアカード）の4つの視点：「財務の視点」「顧客の視点」「内部ビジネスプロセスの視点」「学習と成長の視点」。「マーケティング」は4つの視点に含まれない。財務だけでなく非財務指標も含め、戦略を多角的に測定・管理するツール。"},{"id":91,"subject":"組織行動学","question":"人・組織のマネジメントに影響を及ぼす外部要因に<u>含まれない</u>ものはどれか？","choices":["経営理念","法的規制","技術的進歩","労働組合"],"correct":0,"reference":"5-2 人・組織のマネジメントに影響を及ぼす要因","weight":1,"explanation":"人・組織のマネジメントに影響する外部要因：法的規制・技術的進歩・労働組合・文化・経済環境など。「経営理念」は自社が内部で設定するもの（内部要因）であり、外部要因には含まれない。"},{"id":92,"subject":"人的資源管理","question":"人的資源管理の視点で「HR（Human Resource）ポリシー」を適切に説明しているのはどれか？","choices":["ビジョンを実現するため、組織と人がどうあるべきかを示す。","構成員をどのように組み合わせて戦略を遂行させるか。","構成員をどのように活用・管理するか。","構成員が共有する信念、価値観、行動規範の集合体。"],"correct":0,"reference":"5-3 組織行動学と人的資源管理","weight":3,"explanation":"HRポリシーとは「ビジョン実現のために組織と人がどうあるべきかを示す基本方針」。人事制度・採用基準・育成方針など人事全般の指針となる。「組織構造」は構成員の組み合わせ方（機能別・事業部制など）、「組織文化」は構成員が共有する価値観・行動規範を指す。"},{"id":93,"subject":"人的資源管理","question":"人的資源管理の視点で「組織構造」を適切に説明しているのはどれか？","choices":["構成員をどのように組み合わせて戦略を遂行させるか。","ビジョンを実現するため、組織と人がどうあるべきかを示す。","構成員をどのように活用・管理するか。","構成員が共有する信念、価値観、行動規範の集合体。"],"correct":0,"reference":"5-3 組織行動学と人的資源管理","weight":3,"explanation":"人的資源管理における「組織構造」は「構成員をどのように組み合わせて戦略を遂行させるか（部門編成・階層・職務分担）」を決める枠組み。機能別組織・事業部制・マトリクス型などの組織設計がこれにあたる。"},{"id":94,"subject":"人的資源管理","question":"人的資源管理の視点で「HRシステム」を適切に説明しているのはどれか？","choices":["構成員をどのように活用・管理するか。","構成員をどのように組み合わせて戦略を遂行させるか。","ビジョンを実現するため、組織と人がどうあるべきかを示す。","構成員が共有する信念、価値観、行動規範の集合体。"],"correct":0,"reference":"5-3 組織行動学と人的資源管理","weight":3,"explanation":"「HRシステム」は「構成員をどのように活用・管理するか」を定める具体的な人事制度・仕組み（採用・評価・報酬・育成・配置など）。HRポリシー（方針・理念）をオペレーションレベルで実現するための管理システム全体を指す。"},{"id":95,"subject":"人的資源管理","question":"人的資源管理の視点で「組織文化」を適切に説明しているのはどれか？","choices":["構成員が共有する信念、価値観、行動規範の集合体。","構成員をどのように活用・管理するか。","構成員をどのように組み合わせて戦略を遂行させるか。","ビジョンを実現するため、組織と人がどうあるべきかを示す。"],"correct":0,"reference":"5-3 組織行動学と人的資源管理","weight":3,"explanation":"「組織文化」は「構成員が共有する信念・価値観・行動規範の集合体」。組織の個性・アイデンティティを形成し、意思決定や行動に暗黙的な影響を与える。強い組織文化は戦略実行力を高めるが、変化への適応を妨げることもある。"},{"id":96,"subject":"組織行動学","question":"「高度のリーダーシップが必要」、「マネジメント機能への要求が少ない」のはどのような組織か？","choices":["創業期の組織","19世紀における大部分の企業組織","高度成長期の大企業","現在の大部分の大企業"],"correct":0,"reference":"5-4 リーダーシップとマネジメント","weight":3,"explanation":"創業期の組織では、明確なルールや管理システムが未整備のため高度なリーダーシップが求められる。一方、マネジメント機能（計画・統制・仕組み）の整備はまだ少なくてよい。創業者のビジョンと行動力が組織を引っ張る段階。"},{"id":97,"subject":"組織行動学","question":"「高度のマネジメント機能が必要」、「リーダー機能へのニーズが少ない」のはどのような組織か？","choices":["高度成長期の大企業","創業期の組織","19世紀における大部分の企業組織","現在の大部分の大企業"],"correct":0,"reference":"5-4 リーダーシップとマネジメント","weight":3,"explanation":"高度成長期の大企業（安定成長・大量生産モデル）では、効率的な業務管理・計画・統制などの「マネジメント機能」が最重要。組織が大きく仕組みが整っているため、リーダーシップよりもシステム化された管理が中心となる。"},{"id":98,"subject":"組織行動学","question":"エンパワーメントの成功要件として<u>適切でない</u>ものはどれか？","choices":["強制力と報酬力","経営理念、ビジョンの共有","正当な評価と報奨","能力の把握と資源の提供"],"correct":0,"reference":"5-5 エンパワーメント","weight":2,"explanation":"エンパワーメント（権限委譲）の成功要件：①経営理念・ビジョンの共有、②正当な評価と報奨、③能力の把握と資源（情報・権限・予算）の提供が必要。「強制力と報酬力」は上司が部下をコントロールするパワーの概念であり、エンパワーメントの本質（自律性促進）と相反する。"},{"id":99,"subject":"組織行動学","question":"パワーは「強制力」、「報酬力」、「正当権力」、「専門力」、「同一視力」の5つで構成されていると提唱したのは誰か？","choices":["ジョン・フレンチとバートラム・ラーベン","マズロー","マクレガー","ハーズバーグ"],"correct":0,"reference":"5-6 パワー","weight":2,"explanation":"フレンチとラーベンが提唱したパワー（影響力）の5源泉：①強制力（罰則）②報酬力（報奨）③正当権力（役職・地位）④専門力（専門知識）⑤同一視力（魅力・尊敬）。モチベーション理論（マズロー・マクレガー・ハーズバーグ）とは別の研究者。"},{"id":100,"subject":"組織行動学","question":"欲求5段階説（「生理的」→「安全」→「社会的」→「尊厳」→「自己実現」）を提唱したのは誰か？","choices":["マズロー","ジョン・フレンチとバートラム・ラーベン","マクレガー","ハーズバーグ"],"correct":0,"reference":"5-7 モチベーションとインセンティブ","weight":3,"explanation":"マズローの欲求5段階説：「①生理的欲求（食・睡眠）→②安全の欲求→③社会的欲求（帰属・愛情）→④尊厳の欲求（承認・地位）→⑤自己実現の欲求」の順に低次から高次へ。下位の欲求が満たされると上位の欲求が生じる。リーダーシップ・モチベーション理論の基礎。"},{"id":101,"subject":"組織行動学","question":"「人は怠け者で責任を回避しようとする。」というX理論と「人は勤勉で進んで仕事し、責任を取ろうとする。」というY理論を提唱したのは誰か？","choices":["マクレガー","マズロー","ジョン・フレンチとバートラム・ラーベン","ハーズバーグ"],"correct":0,"reference":"5-7 モチベーションとインセンティブ","weight":3,"explanation":"マクレガーのX理論・Y理論：X理論は「人間は本来怠け者で責任を嫌い、強制されなければ働かない」という人間観。Y理論は「人間は自発的に働き、適切な条件のもとでは責任を取ろうとする」という人間観。Y理論に基づく管理が高いモチベーションを引き出せるとされる。"},{"id":102,"subject":"組織行動学","question":"動機づけ・衛生理論を提唱したのは誰か？","choices":["ハーズバーグ","マクレガー","マズロー","ジョン・フレンチとバートラム・ラーベン"],"correct":0,"reference":"5-7 モチベーションとインセンティブ","weight":3,"explanation":"ハーズバーグの動機づけ・衛生理論（二要因理論）：「動機づけ要因（達成感・承認・成長・責任）」は満足を高めるが、「衛生要因（給与・会社方針・作業条件・対人関係）」は不満を減らすだけで積極的なモチベーション向上にはつながらない。"},{"id":103,"subject":"組織行動学","question":"集団の発展段階として適切なのはどれか？","choices":["形成期→激動期→規範形成期→実現期→終了期","形成期→規範形成期→激動期→実現期→終了期","形成期→実現期→激動期→規範形成期→終了期","形成期→実現期→規範形成期→激動期→終了期"],"correct":0,"reference":"5-9 チーム・マネジメント","weight":1,"explanation":"タックマン・モデルの集団発展段階：「形成期（Forming）→激動期（Storming）→規範形成期（Norming）→実現期（Performing）→終了期（Adjourning）」の5段階。激動期の対立・混乱を乗り越えて規範が形成され、高パフォーマンスが実現される。"},{"id":104,"subject":"組織行動学","question":"コミュニケーション・プロセスとして適切なのはどれか？","choices":["記号化→伝達→解読→フィードバック","伝達→記号化→解読→フィードバック","記号化→伝達→フィードバック→解読","伝達→記号化→フィードバック→解読"],"correct":0,"reference":"5-10 コンフリクト状況の分析","weight":2,"explanation":"コミュニケーション・プロセス：「記号化（Encoding：送り手がメッセージを言語・記号化）→伝達（Channel：媒体で送信）→解読（Decoding：受け手が解釈）→フィードバック（理解確認・返信）」の順。ノイズ（障害）がコミュニケーションの歪みを生む。"},{"id":105,"subject":"人的資源管理","question":"組織文化の機能として最も関連性が<u>低い</u>のはどれか？","choices":["各事業部が利益責任を負う。","とるべき判断の行動や指針を与える。","公的な情報伝達において情報量を低減する。","昇進や昇給などの評価基準を明確にする。"],"correct":0,"reference":"5-12 組織文化と企業経営","weight":1,"explanation":"組織文化の機能：行動指針の提供・評価基準の明確化・情報伝達の効率化（暗黙の了解）など。「各事業部が利益責任を負う」は事業部制組織の特徴（分権化・独立採算）であり、組織文化の機能ではなく、組織構造・設計の話。"},{"id":106,"subject":"人的資源管理","question":"「組織は戦略に従う。」と提唱したのは誰か？","choices":["チャンドラー","シンドラー","ハンドラー","アンドラー"],"correct":0,"reference":"5-13 組織設計","weight":1,"explanation":"チャンドラーは「組織は戦略に従う（Structure follows strategy）」と提唱。企業が多角化・国際化などの新しい戦略を選択した際、それを効果的に実行するために組織構造が変化（事業部制など）するという命題。"},{"id":107,"subject":"人的資源管理","question":"組織形態の説明として適切なのはどれか？","choices":["機能別組織では、責任が曖昧になりやすい。","事業部制組織では、意思決定に時間がかかる。","マトリクス型組織では、指揮命令系を明確にしやすい。","事業部制組織では、部分最適に陥りやすい。"],"correct":0,"reference":"5-14 組織形態","weight":3,"explanation":"組織形態の特徴：「機能別組織」は専門性が高く責任は比較的明確（責任が曖昧というのは誤り）。「事業部制組織」は意思決定が速いが部分最適に陥りやすい（正しい）。「マトリクス型組織」は2つの命令系統が並存するため指揮命令系が複雑になりやすい（明確にしにくい）。"},{"id":108,"subject":"人的資源管理","question":"人材を外部調達した場合と内部調達した場合、発生する違いとして<u>適切でない</u>のはどれか？","choices":["人材能力","人材調達コスト","人材評価の精度","組織構成員に与える影響"],"correct":0,"reference":"5-15 人員配置","weight":1,"explanation":"人材の外部調達（中途採用）と内部調達（内部育成・異動）の違い：調達コスト・評価精度・組織への影響は異なる。「人材能力」の差は生じない（外部調達でも内部調達でも高能力者は採用できる）。適切でないのは人材能力が違うという点。"},{"id":109,"subject":"人的資源管理","question":"従業員がポイントの範囲内で福利厚生を選択する仕組みを何と呼ぶか？","choices":["カフェテリア・プラン","フリンジ・ベネフィット","インセンティブ・システム","確定拠出年金"],"correct":0,"reference":"5-16 報奨","weight":1,"explanation":"カフェテリア・プラン（選択型福利厚生）は従業員が付与されたポイント（予算）の範囲内で、必要な福利厚生メニューを自由に選択できる制度。多様なニーズ・ライフスタイルに対応でき、従業員満足度・定着率の向上に有効。"},{"id":110,"subject":"人的資源管理","question":"ある対象を評価するときに、目立ちやすい特徴に引きずられて他の特徴についての評価が歪められる現象を何と呼ぶか？","choices":["ハロー効果","フィーチャー効果","先入観効果","固定観念効果"],"correct":0,"reference":"5-17 評価","weight":2,"explanation":"ハロー効果（Halo Effect）は、ある特定の目立つ特徴（学歴・外見・第一印象など）によって、他の特徴についての評価が歪められる認知バイアス。業績評価や採用面接での「寛大化傾向」と並ぶ代表的な評価エラー。"},{"id":111,"subject":"人的資源管理","question":"ビジネスにおける能力で、「経営に関する問題解決に必要な思考、分析の枠組み」に関するものはどれか？","choices":["ビジネス・フレームワーク","コンセプチュアル・スキル","ヒューマン・スキル","変革マネジメント"],"correct":0,"reference":"5-18 能力開発","weight":2,"explanation":"「ビジネス・フレームワーク」は経営上の問題解決に必要な思考・分析の枠組み（SWOT・PPM・ファイブフォースなど）。コンセプチュアル・スキルは状況を構造化し本質把握する高次思考能力、ヒューマン・スキルは対人関係能力。"},{"id":112,"subject":"人的資源管理","question":"ビジネスにおける能力で、「状況を構造化し、問題の本質把握と解決策導出」に関するものはどれか？","choices":["コンセプチュアル・スキル","ビジネス・フレームワーク","ヒューマン・スキル","変革マネジメント"],"correct":0,"reference":"5-18 能力開発","weight":2,"explanation":"「コンセプチュアル・スキル（概念化能力）」は複雑な状況を構造化・抽象化し、問題の本質を把握して解決策を導き出す思考能力。上位管理職に特に重要で、ビジネス・フレームワークを使いこなす基盤となる能力。"},{"id":113,"subject":"組織行動学","question":"クルト・レビンが定義した組織変革の状態に<u>含まれない</u>ものはどれか？","choices":["衝突","解凍","移動","再凍結"],"correct":0,"reference":"5-19 変革のマネジメント","weight":1,"explanation":"クルト・レビンの組織変革3段階：「解凍（Unfreezing：現状の否定・変化への準備）→移動（Moving：新しい行動・価値観への変化）→再凍結（Refreezing：新しい状態の定着）」の3段階。「衝突」はこの3段階に含まれない。"},{"id":114,"subject":"組織行動学","question":"組織における学習プロセスには「シングルループ・ラーニング」と「ダブルループ・ラーニング」の２形態があると提唱したのは誰か？","choices":["アージリス","センゲ","レビン","チャンドラー"],"correct":0,"reference":"5-20 組織学習","weight":1,"explanation":"アージリスは「シングルループ・ラーニング（既存のルール・手順内での問題解決）」と「ダブルループ・ラーニング（前提・価値観そのものを問い直す根本的学習）」を提唱。センゲは「5つのディシプリン」、レビンは変革の3段階理論。"},{"id":115,"subject":"組織行動学","question":"組織学習に必要な要素としてゼンゲが提唱したものはどれか？","choices":["5つのディシプリン","3つのディシプリン","4つのディシプリン","6つのディシプリン"],"correct":0,"reference":"5-20 組織学習","weight":1,"explanation":"センゲ（Peter Senge）が「学習する組織」理論で提唱した「5つのディシプリン（修練）」：①システム思考、②自己実現（パーソナル・マスタリー）、③メンタル・モデルの克服、④共有ビジョンの構築、⑤チーム学習。"},{"id":116,"subject":"経営戦略","question":"ポーターの「5つの力」に<u>含まれない</u>ものはどれか？","choices":["マクロ経済環境の変化","新規参入の脅威","代替品の脅威","買い手の交渉力"],"correct":0,"reference":"Mbook 1-12 業界分析：5つの力","weight":3,"explanation":"ポーターの「5つの力（ファイブフォース）」は①新規参入の脅威、②代替品の脅威、③買い手の交渉力、④売り手（供給者）の交渉力、⑤業界内の既存競合他社の5つ。「マクロ経済環境の変化」はPEST分析で扱う外部環境要因であり、5つの力には含まれない。"},{"id":117,"subject":"経営戦略","question":"バリューチェーンにおける「マージン」とは何か？","choices":["総価値から活動コストを差し引いた利益","主活動と支援活動の合計コスト","顧客が支払う総価格","売上高と変動費の差"],"correct":0,"reference":"Mbook 1-14 バリューチェーン","weight":3,"explanation":"バリューチェーンにおける「マージン」は「企業が創出した総価値（顧客の支払う価格）から、すべての活動にかかったコストの合計を差し引いた利益」のこと。各活動が価値を積み上げ、そこから総コストを引いた残りがマージン（利益）となる。"},{"id":118,"subject":"経営戦略","question":"CSR（企業の社会的責任）のコアとなる要素として<u>最も適切でない</u>ものはどれか？","choices":["利益最大化のための価格引き上げ","コンプライアンス","積極的な環境対策","障害者の雇用"],"correct":0,"reference":"Mbook 1-20 CSR","weight":2,"explanation":"CSR（企業の社会的責任）のコア要素：コンプライアンス（法令遵守）・積極的な環境対策・障害者雇用などの社会貢献活動。「利益最大化のための価格引き上げ」は企業の利益追求行動であり、社会的責任（社会への貢献・配慮）とは方向が異なる。"},{"id":119,"subject":"経営戦略","question":"社会問題を解決することをミッションとしてビジネスを展開する人物を何と呼ぶか？","choices":["社会起業家（ソーシャル・アントレプレナー）","フランチャイザー","ベンチャー起業家","シリアル・アントレプレナー"],"correct":0,"reference":"Mbook 1-21 社会起業家","weight":2,"explanation":"社会起業家（ソーシャル・アントレプレナー）は社会問題（貧困・環境・教育等）の解決をミッションとしてビジネスを展開する起業家。利益追求のみを目的とする通常のベンチャー起業家や、成長後も繰り返し起業するシリアル・アントレプレナーとは異なる。"},{"id":120,"subject":"経営戦略","question":"製品・技術の規格が業界標準として広く普及した状態を何と呼ぶか？","choices":["デファクト・スタンダード","デジュール・スタンダード","ISO規格","JIS規格"],"correct":0,"reference":"Mbook 1-18 デファクト・スタンダード","weight":1,"explanation":"デファクト・スタンダード（事実上の標準）は、政府や標準化機関が制定したのではなく、市場競争の結果として業界標準として広く普及した規格（例：WindowsのOS、VHSのビデオ規格）。デジュール・スタンダードはISO・JISなど公的機関が定める標準。"},{"id":121,"subject":"経営戦略","question":"あるネットワークの利用者が増えるほど、そのネットワークの価値が高まる効果を何と呼ぶか？","choices":["ネットワーク外部性","規模の経済","範囲の経済","経験曲線"],"correct":0,"reference":"Mbook 1-18 デファクト・スタンダード","weight":1,"explanation":"ネットワーク外部性（Network Externality）はあるネットワーク（製品・サービス・プラットフォーム）の利用者が増えるほど、その価値が高まる効果。電話・SNS・OS・クレジットカードなどに見られる。勝者総取り（Winner-takes-all）の市場構造を生み出す。"},{"id":122,"subject":"経営戦略","question":"ポーターの「5つの力」において、安価な代替サービスが多く存在する業界では何が高まるか？","choices":["代替品の脅威が高まり、業界の収益性が低下する","新規参入の脅威が高まる","買い手の交渉力が低下する","業界内の競争が低下する"],"correct":0,"reference":"Mbook 1-12 業界分析：5つの力","weight":3,"explanation":"5つの力の「代替品の脅威」：安価な代替サービスが多く存在すると、顧客は業界の製品・サービスから代替品に乗り換えやすくなる。これにより業界プレイヤーは価格を上げられず、業界全体の収益性が低下する。"},{"id":123,"subject":"経営戦略","question":"ポーターの「5つの力」において、原材料の供給業者が少ない場合、何が起きるか？","choices":["売り手（供給者）の交渉力が高まり、業界の収益性が低下する","買い手の交渉力が高まる","新規参入の脅威が高まる","業界内の競争が激化する"],"correct":0,"reference":"Mbook 1-12 業界分析：5つの力","weight":3,"explanation":"5つの力の「売り手（供給者）の交渉力」：原材料の供給業者が少ない（寡占・独占状態）場合、供給者は価格や条件を有利に交渉できる。これにより購買コストが上昇し、業界の収益性が低下する。"},{"id":124,"subject":"マーケティング","question":"ターゲティングの基準「6R」に<u>含まれない</u>ものはどれか？","choices":["Revenue（売上高）","Realistic（有効規模）","Reach（到達可能性）","Rival（競合状況）"],"correct":0,"reference":"Mbook 2-6 ターゲティング","weight":3,"explanation":"ターゲティングの基準「6R」：Realistic（有効規模）・Reach（到達可能性）・Rival（競合状況）・Rate of Growth（成長率）・Response（反応測定可能性）・Rank/Priority（優先度）。「Revenue（売上高）」は6Rに含まれない（名称に注意）。"},{"id":125,"subject":"マーケティング","question":"マーケティング・リサーチにおける「1次データ」の説明として正しいものはどれか？","choices":["特定の調査目的のために独自に収集したデータ","既存の公刊物や社内記録などから収集したデータ","競合他社が発表した財務データ","政府統計局が公表する統計データ"],"correct":0,"reference":"Mbook 2-5 マーケティング・リサーチ","weight":3,"explanation":"マーケティング・リサーチにおける「1次データ（プライマリデータ）」は特定の調査目的のために独自に収集したデータ（アンケート・インタビュー・観察調査など）。「2次データ（セカンダリデータ）」は既存の公刊物・統計・社内記録などから収集したデータ。"},{"id":126,"subject":"マーケティング","question":"KBF（Key Buying Factor）とは何か？","choices":["顧客が購買を決定する際の重要な判断基準","企業が利益を最大化するための主要な経営指標","マーケティング戦略の重要成功要因","ブランド価値を高めるための主要要素"],"correct":0,"reference":"Mbook 2-4 市場の機会の発見","weight":3,"explanation":"KBF（Key Buying Factor：購買決定重要要因）は顧客が購買を決定する際の最も重要な判断基準。価格・品質・ブランド・利便性など顧客が重視する要素を特定することで、マーケティング戦略や製品開発の方向性が明確になる。KSF（重要成功要因）と区別して覚えること。"},{"id":127,"subject":"マーケティング","question":"セグメンテーション変数の「心理的変数」に該当するものはどれか？","choices":["ライフスタイル、価値観","年齢、性別、所得","地域、都市規模","購買頻度、ブランドへの忠誠心"],"correct":0,"reference":"Mbook 2-5 STP","weight":3,"explanation":"セグメンテーション変数の「心理的変数（サイコグラフィック）」はライフスタイル・価値観・パーソナリティなどの心理的特性で顧客を分類する変数。「年齢・性別・所得」は人口統計変数、「地域・都市規模」は地理的変数、「購買頻度・ブランド忠誠心」は行動変数。"},{"id":128,"subject":"マーケティング","question":"製品の「コア」とは何か？","choices":["製品が顧客に提供する本質的な便益やサービス","製品の物理的形状や包装","アフターサービスや保証などの付随機能","製品の価格設定の核となる部分"],"correct":0,"reference":"Mbook 2-8 製品特性","weight":3,"explanation":"製品の「コア（核）」は製品が顧客に提供する本質的な便益やサービス（機能・効用）。例えばドリルの「コア」は「穴を開ける機能」ではなく「穴を開けたい」という顧客ニーズの充足。コアの外側に「形態（物理的形状）」→「付随機能（アフターサービス・保証）」の層が重なる。"},{"id":129,"subject":"マーケティング","question":"市場導入期に高価格を設定し、早期採用者から収益を回収する価格戦略を何と呼ぶか？","choices":["スキミング・プライシング","ペネトレーション・プライシング","バリュー・プライシング","コスト・プラス・プライシング"],"correct":0,"reference":"Mbook 2-13 戦略的価格設定","weight":3,"explanation":"スキミング・プライシング（上澄み価格戦略）は市場導入期に高価格を設定し、価格感度の低い早期採用者（イノベーター・アーリーアダプター）から高利益を回収する戦略。その後徐々に価格を下げて市場を広げる。革新的製品・ブランド品に多く使われる。"},{"id":130,"subject":"マーケティング","question":"BtoB（企業間取引）マーケティングの特徴として<u>適切でない</u>ものはどれか？","choices":["感情的な動機が購買に大きく影響する","購買は組織的意思決定による","取引金額が大きく関係の継続性が重要","合理的・機能的ニーズが重視される"],"correct":0,"reference":"Mbook 2-20 BtoBマーケティング","weight":1,"explanation":"BtoBマーケティングの特徴：購買は組織的意思決定（複数の関与者）、取引金額が大きく関係継続性が重要、合理的・機能的ニーズが重視される。「感情的な動機が購買に大きく影響する」は個人消費（BtoC）の特徴であり、BtoBには当てはまらない。"},{"id":131,"subject":"マーケティング","question":"セールス・プロモーションの説明として正しいものはどれか？","choices":["短期的に購買や試用を促すための手段（クーポン、試供品など）","ブランド認知向上を目的とした長期的な広告活動","口コミによる自然発生的な製品推薦","SNSを活用したデジタルマーケティング"],"correct":0,"reference":"Mbook 2-17 セールス・プロモーション","weight":2,"explanation":"セールス・プロモーション（SP）は短期的に購買・試用を促進するための手段。具体例：クーポン・試供品・価格割引・キャンペーン・店頭POP等。長期的なブランド構築を目的とする広告とは異なり、即時的な販売促進効果を狙う。"},{"id":132,"subject":"マーケティング","question":"製品ライフサイクルにおいて、アーリー・アダプターが全体に占める割合はおよそどれくらいか？","choices":["約13.5%","約2.5%","約34%","約16%"],"correct":0,"reference":"Mbook 2-11 製品ライフサイクル","weight":3,"explanation":"ロジャーズの普及曲線における各層の比率：イノベーター（革新者）約2.5%、アーリー・アダプター（初期採用者）約13.5%、アーリー・マジョリティ（前期大衆）約34%、レイト・マジョリティ（後期大衆）約34%、ラガード（遅滞者）約16%。"},{"id":133,"subject":"アカウンティング","question":"損益計算書（P/L）における5段階の利益の順番として正しいものはどれか？","choices":["売上総利益→営業利益→経常利益→税金等調整前当期純利益→当期純利益","営業利益→売上総利益→経常利益→当期純利益→税金等調整前当期純利益","売上総利益→経常利益→営業利益→税金等調整前当期純利益→当期純利益","営業利益→経常利益→売上総利益→当期純利益→税金等調整前当期純利益"],"correct":0,"reference":"Mbook 3-5 損益計算書","weight":3,"explanation":"損益計算書（P/L）の5段階の利益の順序：「①売上総利益（粗利）→②営業利益（本業の儲け）→③経常利益（金融収支含む）→④税金等調整前当期純利益（特別損益含む）→⑤当期純利益（税引き後の最終利益）」。この順序は頻出なので完全に覚えること。"},{"id":134,"subject":"アカウンティング","question":"営業利益から経常利益を計算する際に加減算する項目はどれか？","choices":["営業外収益・費用（受取利息、支払利息など）","特別利益・損失","法人税等","売上原価"],"correct":0,"reference":"Mbook 3-5 損益計算書","weight":3,"explanation":"経常利益＝営業利益＋営業外収益－営業外費用。営業外収益・費用の代表例は「受取利息・受取配当金（収益）」「支払利息・社債利息（費用）」。本業以外の財務活動による損益を加減することで経常利益が算出される。"},{"id":135,"subject":"アカウンティング","question":"財務会計・税務会計・管理会計の違いについて正しい説明はどれか？","choices":["財務会計は外部報告用、管理会計は内部意思決定用、税務会計は税務申告用","財務会計は内部管理用、管理会計は外部報告用、税務会計は予算策定用","財務会計と税務会計は同一であり、管理会計のみ異なる","3つはすべて同じ目的で作成される"],"correct":0,"reference":"Mbook 3-3 アカウンティングの目的","weight":3,"explanation":"会計の3分類：「財務会計」は株主・債権者など外部関係者向けの報告（財務諸表作成）が目的。「税務会計」は税務当局への申告（課税所得計算）が目的。「管理会計」は経営者の内部意思決定・業績管理のための情報提供が目的。"},{"id":136,"subject":"アカウンティング","question":"BSC（バランスト・スコアカード）の4つの視点に含まれるものはどれか？","choices":["内部ビジネスプロセスの視点","マーケティングの視点","技術革新の視点","サプライチェーンの視点"],"correct":0,"reference":"Mbook 3-20 マネジメント・コントロール","weight":2,"explanation":"BSC（バランスト・スコアカード）の4視点：①財務の視点、②顧客の視点、③内部ビジネスプロセスの視点、④学習と成長の視点。「マーケティングの視点」「技術革新の視点」「サプライチェーンの視点」はBSCの4視点に含まれない。"},{"id":137,"subject":"アカウンティング","question":"内部統制のCOSOフレームワークの5要素に<u>含まれない</u>ものはどれか？","choices":["コスト削減","統制環境","リスク評価","情報と伝達"],"correct":0,"reference":"Mbook 3-21 内部統制","weight":1,"explanation":"COSOフレームワーク（内部統制の国際標準）の5要素：①統制環境、②リスク評価、③統制活動、④情報と伝達、⑤モニタリング。「コスト削減」は内部統制の構成要素ではなく、経営効率化の課題であり含まれない。"},{"id":138,"subject":"アカウンティング","question":"活動基準原価計算（ABC: Activity-Based Costing）の特徴として正しいものはどれか？","choices":["製造活動を細分化し、各活動に基づいて間接費を製品に配賦する","製品の直接材料費のみを原価として計算する","固定費を売上高比率で均等配賦する","標準原価と実際原価の差異を分析する手法"],"correct":0,"reference":"Mbook 3-19 原価計算","weight":3,"explanation":"ABC（活動基準原価計算）は製造プロセスを「活動（Activity）」に細分化し、各活動が消費したリソースコストをコストドライバーに基づいて製品に配賦する手法。従来の一律配賦より正確な原価把握が可能で、収益性分析・プロセス改善に有効。"},{"id":139,"subject":"アカウンティング","question":"デュポン分析式におけるROEの分解として正しいものはどれか？","choices":["売上高純利益率 × 総資産回転率 × 財務レバレッジ","売上高純利益率 × 固定資産回転率 × 自己資本比率","営業利益率 × 総資産回転率 × 負債比率","経常利益率 × 自己資本回転率 × 財務レバレッジ"],"correct":0,"reference":"Mbook 3-12 ROAとROE","weight":3,"explanation":"デュポン分析式によるROEの分解：ROE＝売上高純利益率（利益÷売上）×総資産回転率（売上÷総資産）×財務レバレッジ（総資産÷自己資本）。この分解により「利益率・資産効率・レバレッジのどの要因でROEが高い/低いか」を分析できる。"},{"id":140,"subject":"アカウンティング","question":"流動比率（流動資産÷流動負債）の一般的な目安として正しいものはどれか？","choices":["150〜200%以上が望ましい","50〜80%以上が望ましい","100%以下が望ましい","200〜300%が標準的"],"correct":0,"reference":"Mbook 3-14 安全性分析","weight":3,"explanation":"流動比率（＝流動資産÷流動負債×100%）は短期的な支払い能力を示す安全性指標。一般的な目安は150〜200%以上が望ましい（100%超えていれば短期債務は流動資産で賄える。200%以上あれば余裕あり）。100%を下回ると流動性危機のリスクがある。"},{"id":141,"subject":"アカウンティング","question":"インフレ環境下において、先入先出法（FIFO）を採用した場合の影響として正しいものはどれか？","choices":["期末在庫の評価が高くなり、売上原価が低くなるため利益が大きくなる","期末在庫の評価が低くなり、売上原価が高くなるため利益が小さくなる","期末在庫と利益への影響はない","売上原価が高くなり、期末在庫評価も高くなる"],"correct":0,"reference":"Mbook 3-16 たな卸資産","weight":2,"explanation":"インフレ環境で先入先出法（FIFO）を採用すると：古い安い仕入れコストが先に費用計上（売上原価が低くなる）→利益が大きくなる。同時に期末在庫は新しい高い価格で評価→在庫評価額が高くなる。後入先出法（LIFO）は逆の効果（日本の会計基準では廃止）。"},{"id":142,"subject":"ファイナンス","question":"WACCの計算式として正しいものはどれか？","choices":["D/(D+E)×rD×(1-税率) + E/(D+E)×rE","D/(D+E)×rE + E/(D+E)×rD×(1-税率)","(rD+rE)/2","D×rD + E×rE"],"correct":0,"reference":"Mbook 4-10 WACC","weight":3,"explanation":"WACC（加重平均資本コスト）の計算式：WACC＝D/(D+E)×rD×(1-税率) ＋ E/(D+E)×rE。D＝負債、E＝株主資本、rD＝負債コスト、rE＝株主資本コスト。負債の利子は損金算入できるため税引き後コストを使う。企業の資本コストの加重平均値。"},{"id":143,"subject":"ファイナンス","question":"CAPMの式として正しいものはどれか？","choices":["期待収益率 = 無リスク資産利回り + β×(市場期待収益率 - 無リスク資産利回り)","期待収益率 = 市場期待収益率 + β×無リスク資産利回り","期待収益率 = β×市場期待収益率 - 無リスク資産利回り","期待収益率 = 無リスク資産利回り + (市場期待収益率 - β)"],"correct":0,"reference":"Mbook 4-9 CAPM","weight":3,"explanation":"CAPM（資本資産価格モデル）の式：期待収益率＝無リスク資産利回り＋β×（市場期待収益率－無リスク資産利回り）。β（ベータ）は市場リスクに対する感応度。括弧内「市場期待収益率－無リスク資産利回り」をリスクプレミアムと呼ぶ。βが大きいほど期待収益率が高くなる。"},{"id":144,"subject":"ファイナンス","question":"βが1.5の株式の特性として正しいものはどれか？","choices":["市場全体が10%上昇すると、その株式は約15%上昇する傾向がある","市場全体の動きと無関係に1.5倍の収益を生む","リスクが市場平均より50%低い","配当利回りが市場平均の1.5倍である"],"correct":0,"reference":"Mbook 4-9 CAPM","weight":3,"explanation":"βが1.5の株式は市場全体の動きに対して1.5倍の感応度を持つ。市場が10%上昇すれば約15%上昇し、市場が10%下落すれば約15%下落する傾向がある。β>1はハイリスク・ハイリターン、β<1はローリスク・ローリターンの特性を示す。"},{"id":145,"subject":"ファイナンス","question":"フリー・キャッシュフロー（FCF）の計算式として最も適切なものはどれか？","choices":["EBIT×(1-税率) + 減価償却費 - 設備投資 - 運転資本増加","EBITDA - 税金 - 設備投資","当期純利益 + 減価償却費","営業キャッシュフロー - 財務キャッシュフロー"],"correct":0,"reference":"Mbook 4-16 フリー・キャッシュフロー","weight":3,"explanation":"FCF（フリー・キャッシュフロー）の計算式：FCF＝EBIT×(1-税率)＋減価償却費－設備投資(CAPEX)－運転資本の増加。EBITは支払利息前・税引き前利益。FCFは企業が事業活動後に自由に使えるキャッシュを示し、DCF法での企業価値算定の基礎となる。"},{"id":146,"subject":"ファイナンス","question":"DCF法による企業価値評価において使用する割引率として正しいものはどれか？","choices":["WACC（加重平均資本コスト）","リスクフリーレート","ROE","PER"],"correct":0,"reference":"Mbook 4-17 企業価値の算出","weight":3,"explanation":"DCF（割引キャッシュフロー）法による企業価値評価では、将来FCFをWACC（加重平均資本コスト）で割り引いて現在価値を算出する。WACCは株主・債権者両方の資本コストを加重平均したもので、企業全体の必要収益率として使用される。"},{"id":147,"subject":"ファイナンス","question":"NPV法で「投資すべき」と判断する基準はどれか？","choices":["NPV > 0（正）のとき","NPV < 0（負）のとき","NPV = 0のとき","IRR < ハードル・レートのとき"],"correct":0,"reference":"Mbook 4-5 NPV法","weight":3,"explanation":"NPV（正味現在価値）法の投資判断：NPV＞0（正）のとき投資すべき。NPVは将来キャッシュインフローの現在価値合計から初期投資を差し引いた値。NPV>0は投資によって資本コスト以上のリターンが期待できることを意味し、企業価値が増加する。"},{"id":148,"subject":"ファイナンス","question":"IRR法で「投資すべき」と判断する基準はどれか？","choices":["IRR > ハードル・レート","IRR < ハードル・レート","IRR = 0","IRR < WACCのとき"],"correct":0,"reference":"Mbook 4-6 IRR法","weight":3,"explanation":"IRR（内部収益率）法の投資判断：IRR＞ハードル・レート（最低必要収益率）のとき投資すべき。IRRは投資のNPVをゼロにする割引率。IRRがハードル・レート（通常WACC）を上回ればその投資は受け入れ可能な収益率を確保できる。"},{"id":149,"subject":"ファイナンス","question":"ポートフォリオ理論における「システマティック・リスク」の説明として正しいものはどれか？","choices":["分散投資によっても除去できない市場全体のリスク","分散投資によって除去できる個別銘柄固有のリスク","リスクフリー資産に投資することで回避できるリスク","企業の倒産リスクのみを指す概念"],"correct":0,"reference":"Mbook 4-8 ポートフォリオ理論","weight":3,"explanation":"ポートフォリオ理論における「システマティック・リスク（市場リスク）」は分散投資によっても除去できないリスク（市場全体の変動・金利変化・景気後退など）。一方「アンシステマティック・リスク（固有リスク）」は分散投資で低減可能な個別企業・業種固有のリスク。"},{"id":150,"subject":"ファイナンス","question":"EVA（経済的付加価値）の説明として正しいものはどれか？","choices":["税引後営業利益から投下資本コストを差し引いた経済的付加価値","EBITDAから設備投資を差し引いた指標","純資産の増加額","FCFの割引現在価値"],"correct":0,"reference":"Mbook 4-19 EVA","weight":2,"explanation":"EVA（Economic Value Added：経済的付加価値）＝税引後営業利益（NOPAT）－投下資本×WACC。企業が資本コストを上回る利益を生み出した付加価値を示す。EVA>0なら企業価値を高めている。従来のROEやROAより資本効率を厳密に評価できる。"},{"id":151,"subject":"ファイナンス","question":"モジリアーニ＝ミラーの命題（完全市場仮定）の内容として正しいものはどれか？","choices":["完全市場では負債の活用による節税効果がなく、資本構成は企業価値に影響しない","負債比率が高いほど企業価値は常に高まる","自己資本のみで資金調達すべきである","資本構成は常に企業価値に影響する"],"correct":0,"reference":"Mbook 4-13 資本構成","weight":2,"explanation":"モジリアーニ＝ミラー（MM）の命題（完全市場仮定）：税金や取引コストのない完全市場では、負債と株式の組み合わせ（資本構成）は企業価値に影響しない。しかし現実には法人税の節税効果（負債の利子は損金算入）があるため、資本構成は企業価値に影響する。"},{"id":152,"subject":"ファイナンス","question":"コール・オプションの権利とは何か？","choices":["原資産を将来の特定日時に、決められた価格で「買う」権利","原資産を将来の特定日時に、決められた価格で「売る」権利","原資産を今すぐ市場価格で買う義務","将来の価格変動リスクを完全に排除する契約"],"correct":0,"reference":"Mbook 4-20 オプション理論","weight":2,"explanation":"コール・オプション（Call Option）は「原資産（株式・商品等）を将来の特定日時に、あらかじめ決められた価格（行使価格）で買う権利」。買う権利を持つが義務ではない。対するプット・オプション（Put Option）は「売る権利」。"},{"id":153,"subject":"IT","question":"ERP（Enterprise Resource Planning）の特徴として正しいものはどれか？","choices":["「One Fact One Place」の原則で、企業全体の情報を統合データベースで一元管理する","部門ごとに個別最適化されたシステムを構築する","特定業務に特化した専用ソフトウェアである","主に中小企業向けに設計された会計システム"],"correct":0,"reference":"Mbook IT-6 ERP","weight":2,"explanation":"ERP（Enterprise Resource Planning）は「One Fact One Place」の原則で全社の情報（会計・製造・販売・在庫・人事等）を統合データベースで一元管理するシステム。部門間の情報サイロを解消し、リアルタイムで経営情報を把握できる。"},{"id":154,"subject":"IT","question":"SCM（サプライチェーン・マネジメント）の目的として正しいものはどれか？","choices":["原材料の供給者から消費者に至るまでの一連の業務を統合的に最適化する","自社の製造プロセスのみを効率化する","在庫を最大化することでサービスレベルを高める","各部門が個別に最適な調達を行う"],"correct":0,"reference":"Mbook IT-7 サプライチェーン・マネジメント","weight":2,"explanation":"SCM（サプライチェーン・マネジメント）は原材料の供給者から最終消費者までの一連の業務フロー（調達→製造→在庫→配送→販売）を統合的に最適化する経営手法。在庫削減・リードタイム短縮・コスト削減・サービスレベル向上が目的。"},{"id":155,"subject":"IT","question":"TOC（制約理論）においてスループットを最大化するために注目すべきポイントはどれか？","choices":["業務の流れを妨げているボトルネック（制約条件）の解消","全工程の均等な効率化","在庫の最小化のみ","経費削減のみ"],"correct":0,"reference":"Mbook IT-7 TOC制約理論","weight":2,"explanation":"TOC（制約理論：Theory of Constraints）はゴールドラット博士が提唱。業務全体のスループット（売上高－変動費）を最大化するために、業務の流れを妨げているボトルネック（制約条件）を特定・解消することに集中する管理手法。"},{"id":156,"subject":"IT","question":"BPR（Business Process Re-engineering）の説明として正しいものはどれか？","choices":["既存のビジネスプロセスを根本から見直し、業務のやり方を抜本的に変える手法","既存プロセスの小さな改善を積み重ねる継続的改善活動","IT導入前に業務プロセスを文書化する作業","コスト削減のために人員を削減すること"],"correct":0,"reference":"Mbook IT-5 BPR","weight":2,"explanation":"BPR（Business Process Re-engineering：業務プロセス再設計）はハマー＆チャンピーが提唱。既存の業務プロセスを抜本的にゼロベースで見直し、劇的な業績改善を目指す。漸進的な改善（カイゼン）とは異なる根本的な変革アプローチ。"},{"id":157,"subject":"IT","question":"「リエンジニアリング・ダイアモンド」の4要素に<u>含まれない</u>ものはどれか？","choices":["マーケティング戦略","情報技術","ビジネスプロセス","カルチャー・価値観"],"correct":0,"reference":"Mbook IT-5 BPR","weight":2,"explanation":"リエンジニアリング・ダイアモンドの4要素：①ビジネスプロセス、②情報技術（IT）、③組織・人・管理システム、④カルチャー・価値観。「マーケティング戦略」はダイアモンドの4要素に含まれない。この4要素が相互に整合的に変革されることが重要。"},{"id":158,"subject":"IT","question":"ナレッジ経営のSECIモデルにおける「表出化」とは何か？","choices":["暗黙知を言語や図式などの形式知に変換するプロセス","形式知を実践を通じて個人の暗黙知として取り込むプロセス","個人間の経験共有によって暗黙知を移転するプロセス","複数の形式知を組み合わせて新たな形式知を創造するプロセス"],"correct":0,"reference":"Mbook IT-14 ナレッジ経営","weight":1,"explanation":"SECIモデルの「表出化（Externalization）」は暗黙知（個人の経験・勘・コツ）を言語・図式・マニュアルなどの形式知に変換するプロセス。「共同化」は暗黙知を体験共有で伝達、「連結化」は形式知同士の組み合わせ、「内面化」は形式知を暗黙知として習得。"},{"id":159,"subject":"IT","question":"ナレッジ経営のSECIモデルの4段階として正しい順序はどれか？","choices":["共同化→表出化→連結化→内面化","表出化→共同化→内面化→連結化","内面化→連結化→共同化→表出化","連結化→共同化→表出化→内面化"],"correct":0,"reference":"Mbook IT-14 ナレッジ経営","weight":1,"explanation":"SECIモデルの4段階：「共同化（S：Socialization）→表出化（E：Externalization）→連結化（C：Combination）→内面化（I：Internalization）」の順。暗黙知と形式知が変換・共有・創造される知識創造のスパイラル。野中郁次郎が提唱。"},{"id":160,"subject":"IT","question":"CIO（Chief Information Officer）の主な役割として正しいものはどれか？","choices":["ITを戦略的に企業に導入し、意思決定や戦略遂行活動の質とスピードを高める責任者","日常の情報システム保守・運用を担当する管理者","データベースの設計と管理を専門とする技術者","IT投資予算の最終承認のみを行う役員"],"correct":0,"reference":"Mbook IT-1 企業経営とIT","weight":1,"explanation":"CIO（Chief Information Officer：最高情報責任者）はITを戦略的に活用して企業の意思決定・戦略遂行の質とスピードを高める責任者。単なるITシステムの保守・運用担当ではなく、ITと経営戦略を結びつける経営レベルの役割を担う。"},{"id":161,"subject":"IT","question":"ムーアの法則とは何か？","choices":["半導体の性能（集積度）は約18ヶ月ごとに2倍になる","インターネット利用者数は毎年倍増する","ソフトウェアの開発コストは毎年半減する","データ通信速度は2年ごとに2倍になる"],"correct":0,"reference":"Mbook IT-3 技術進化のとらえ方","weight":1,"explanation":"ムーアの法則（Moore's Law）：半導体集積回路のトランジスタ数（性能）は約18〜24ヶ月ごとに2倍になるという経験則。インテル共同創業者のゴードン・ムーアが1965年に提唱。IT産業の急速な技術進歩・低コスト化の根拠となった。"},{"id":162,"subject":"IT","question":"情報の経済性において「リッチネス」と「リーチ」の関係について、インターネット登場以前の正しい説明はどれか？","choices":["リッチネスを高めるとリーチが小さくなるトレードオフがあった","リッチネスとリーチは正比例の関係があった","リーチを広げるとリッチネスも自動的に高まった","リッチネスとリーチは無関係だった"],"correct":0,"reference":"Mbook IT-11 バーチャルとリアル","weight":1,"explanation":"インターネット登場以前：リッチネス（情報の深さ・豊かさ）を高めると伝達できる相手の数（リーチ）が制限されるトレードオフがあった（例：雑誌はリッチだが読者が限定的）。インターネットはこのトレードオフを破壊し、リッチかつリーチ可能にした。"},{"id":163,"subject":"IT","question":"ワン・トゥ・ワン・マーケティングの4ステップの正しい順序はどれか？","choices":["顧客の特定→顧客の差異化→顧客とのコミュニケーション→企業活動のカスタマイゼーション","顧客の差異化→顧客の特定→カスタマイゼーション→コミュニケーション","コミュニケーション→顧客特定→差異化→カスタマイゼーション","カスタマイゼーション→差異化→コミュニケーション→顧客特定"],"correct":0,"reference":"Mbook IT-13 ワン・トゥ・ワン・マーケティング","weight":1,"explanation":"ワン・トゥ・ワン・マーケティングの4ステップ：「①顧客の特定（IDを付与）→②顧客の差異化（価値・ニーズで分類）→③顧客とのコミュニケーション（対話・学習）→④企業活動のカスタマイゼーション（個別対応）」。顧客を個別に認識・対話・カスタマイズする。"},{"id":164,"subject":"IT","question":"VMI（Vendor Managed Inventory）の説明として正しいものはどれか？","choices":["ベンダー（サプライヤー）が小売業者の店舗在庫を管理・補充する仕組み","消費者が自ら在庫を管理するシステム","メーカーが自社工場の在庫のみを管理する手法","政府が食料品の在庫を管理する制度"],"correct":0,"reference":"Mbook IT-8 ロジスティクス","weight":1,"explanation":"VMI（Vendor Managed Inventory：サプライヤー管理在庫）はサプライヤー（ベンダー）が小売業者・顧客の在庫を監視・管理し、自動的に補充注文を行う仕組み。発注業務の効率化・在庫最適化・欠品防止につながるSCMの重要手法。"},{"id":165,"subject":"IT","question":"クロス・ドッキングの説明として正しいものはどれか？","choices":["流通センターの入荷ドックで受け入れた商品を保管せず、そのまま出荷ドックまで運び直ちに配送する手法","複数の商品を一つの梱包にまとめる作業","商品の品質検査を入荷時に行うプロセス","在庫を複数の倉庫に分散させる戦略"],"correct":0,"reference":"Mbook IT-8 ロジスティクス","weight":1,"explanation":"クロス・ドッキングは物流センターへの入荷商品を保管することなく、即座に仕分け・積み替えして出荷する物流手法。在庫保管コストの削減・リードタイム短縮・鮮度維持に有効。ウォルマートが大規模導入したことで広く知られる。"},{"id":166,"subject":"ゲーム理論・交渉術","question":"ゲーム理論における「同時進行ゲーム」の説明として正しいものはどれか？","choices":["プレイヤーが互いに相手の次の行動を知らない状態で意思決定を行うゲーム","プレイヤーが順番に行動するゲーム","一方のプレイヤーだけが全情報を持つゲーム","プレイヤーが協力して行動するゲーム"],"correct":0,"reference":"Mbook 7-2 ゲームの類型","weight":2,"explanation":"同時進行ゲーム：プレイヤーが相手の行動を知らない状態（同時に意思決定）で戦略を選ぶゲーム。代表例：価格設定競争・入札。対する「交互進行ゲーム（逐次ゲーム）」はプレイヤーが順番に行動し、先手の戦略が後手に見える。"},{"id":167,"subject":"ゲーム理論・交渉術","question":"「ゼロサム・ゲーム」の説明として正しいものはどれか？","choices":["あるプレイヤーの利得が増えると、その分だけ他のプレイヤーの損失が増えるゲーム","全プレイヤーの利得の合計がプラスになるゲーム","全プレイヤーが協力することで全員の利得が増えるゲーム","全プレイヤーが損失を被るゲーム"],"correct":0,"reference":"Mbook 7-2 ゲームの類型","weight":2,"explanation":"ゼロサム・ゲームはあるプレイヤーの利得の増加が必ず他のプレイヤーの損失となるゲーム（利得の合計が常にゼロ）。チェス・将棋・交渉での利権争いが例。対するプラスサム・ゲームは協力により全体利益が増加できる（ビジネス協業等）。"},{"id":168,"subject":"ゲーム理論・交渉術","question":"「絶対優位の戦略（Dominant Strategy）」の説明として正しいものはどれか？","choices":["相手がどの戦略をとっても、常に自分にとって最も高い利得をもたらす戦略","相手の行動を予測した場合のみ有利な戦略","協力ゲームにおいて最も公平な分配を実現する戦略","特定の相手に対してのみ有効な戦略"],"correct":0,"reference":"Mbook 7-3 同時進行ゲーム（1）","weight":1,"explanation":"絶対優位戦略（Dominant Strategy）：相手がどの戦略を選んでも、常に自分にとって最も良い利得をもたらす戦略。囚人のジレンマでの「自白する」がその例。絶対優位戦略が存在するプレイヤーは必ずその戦略を選ぶことが合理的とされる。"},{"id":169,"subject":"ゲーム理論・交渉術","question":"「囚人のジレンマ」の本質的な問題として正しいものはどれか？","choices":["各プレイヤーが絶対優位の戦略（自白する）を選択すると、協力した場合より両者に悪い結果をもたらす","互いに協力することが不可能なゲーム構造","情報の非対称性によって生じるゲームの歪み","プレイヤー間の利益が完全に一致するゲーム"],"correct":0,"reference":"Mbook 7-4 囚人のジレンマ","weight":2,"explanation":"囚人のジレンマ：各プレイヤーが個人合理的に絶対優位戦略（自白）を選ぶと、両者にとって協力（黙秘）した場合より悪い結果（双方長期刑）になるジレンマ。個人合理性と集団合理性が矛盾する状況。企業間価格競争・軍拡競争などに応用される。"},{"id":170,"subject":"ゲーム理論・交渉術","question":"囚人のジレンマを回避するための有効な方法として<u>適切でない</u>ものはどれか？","choices":["ゲームの参加者を増やして多数決で決める","繰り返しゲームにする","裏切りに対する罰則メカニズムを導入する","サイド・ペイメント（約束を守った場合の報酬）を設ける"],"correct":0,"reference":"Mbook 7-4 囚人のジレンマ","weight":2,"explanation":"囚人のジレンマの回避策：①繰り返しゲーム（長期的関係で協力が合理的になる）、②罰則メカニズムの導入（裏切りに対するペナルティ）、③サイド・ペイメント（協力への報酬）。「参加者を増やして多数決で決める」は囚人のジレンマの解決策ではない。"},{"id":171,"subject":"ゲーム理論・交渉術","question":"「ナッシュ均衡」の説明として正しいものはどれか？","choices":["各プレイヤーが相手の戦略を前提にすると、自分の選択を変えるインセンティブがない均衡点","全プレイヤーの利得が最大化される均衡点","ゲームの結果が必ずパレート最適になる均衡点","協調行動によってのみ達成できる均衡点"],"correct":0,"reference":"Mbook 7-5 男女の争い","weight":1,"explanation":"ナッシュ均衡：各プレイヤーが相手の戦略を所与として自分の戦略を決めた結果、誰も戦略を変えるインセンティブがない均衡状態。必ずしも全員にとって最善（パレート最適）ではない（囚人のジレンマのナッシュ均衡はパレート最適でない）。"},{"id":172,"subject":"ゲーム理論・交渉術","question":"「ミニマックス定理」が成立するのはどのようなゲームか？","choices":["ゼロサム2人ゲーム","プラスサム多人数ゲーム","マイナスサムゲーム","情報非対称ゲーム"],"correct":0,"reference":"Mbook 7-7 ミニマックス定理","weight":1,"explanation":"ミニマックス定理：ゼロサム2人ゲームでは、各プレイヤーが「最悪の場合の損失を最小化する（ミニマックス）戦略」をとると必ずナッシュ均衡に至るという定理。フォン・ノイマンが証明。非ゼロサムゲームやプラスサムゲームには直接適用できない。"},{"id":173,"subject":"ゲーム理論・交渉術","question":"交互進行ゲームの分析に用いる「後向き帰納法（Backward Induction）」の説明として正しいものはどれか？","choices":["ゲームの木の末尾から逆向きに各分岐点での最適戦略をたどっていく手法","ゲームの最初の手から順番に全選択肢を列挙する手法","相手の戦略の平均値を計算して最適行動を決める手法","ナッシュ均衡を直接計算する数学的手法"],"correct":0,"reference":"Mbook 7-8 交互進行ゲーム","weight":1,"explanation":"後向き帰納法（Backward Induction）：交互進行ゲームの分析手法。ゲームの木（意思決定ツリー）の最終結果から逆向きに、各分岐点での合理的選択を順次決定していく方法。完全情報の逐次ゲームで均衡戦略を求めるのに使われる。"},{"id":174,"subject":"ゲーム理論・交渉術","question":"「シグナリング・ゲーム」の特徴として正しいものはどれか？","choices":["情報面で優位なプレイヤーが行動（シグナル）を発し、情報面で劣位なプレイヤーがそのシグナルを見て戦略を決めるゲーム","全プレイヤーが同等の情報を持つゲーム","シグナルを発することが常にコストゼロのゲーム","協調行動のみが均衡となるゲーム"],"correct":0,"reference":"Mbook 7-9 情報非対称ゲーム","weight":1,"explanation":"シグナリング・ゲーム：情報優位なプレイヤー（例：能力の高い求職者）が行動（高学歴というシグナル）を発し、情報劣位なプレイヤー（採用企業）がそのシグナルを観察して戦略を決めるゲーム。逆選択（情報の非対称性による市場失敗）への対応策の一つ。"},{"id":175,"subject":"ゲーム理論・交渉術","question":"BATNA（Best Alternative To a Negotiated Agreement）の説明として正しいものはどれか？","choices
