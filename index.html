":["交渉が決裂した場合に利用できる最も望ましい代替案","交渉における自分の最低要求ライン（限界値）","交渉相手が必ず合意する条件の範囲","交渉を有利に進めるための心理的戦術"],"correct":0,"reference":"Mbook 7-13 交渉構造分析の基本概念","weight":2,"explanation":"BATNA（Best Alternative To a Negotiated Agreement：交渉が決裂した場合の最善の代替案）は交渉における留保価値の基準。BATNAが強い（良い代替案がある）ほど交渉力が高まる。交渉前にBATNAを明確にし、可能なら改善しておくことが重要。"},{"id":176,"subject":"ゲーム理論・交渉術","question":"ZOPA（Zone of Possible Agreement）の説明として正しいものはどれか？","choices":["買い手の限界値と売り手の限界値の間にある、交渉が妥結する可能性のある範囲","交渉相手のBATNAの価値","交渉における最初の提示価格","全プレイヤーの利得が最大化される条件"],"correct":0,"reference":"Mbook 7-13 交渉構造分析の基本概念","weight":2,"explanation":"ZOPA（Zone of Possible Agreement：合意可能ゾーン）は買い手の最大支払い意思額（上限）と売り手の最低受入価格（下限）の間にある、交渉が妥結する可能性のある価格範囲。ZOPAが存在しなければ合意は不可能。"},{"id":177,"subject":"ゲーム理論・交渉術","question":"交渉を妥結に導く「3層構造」の正しい順序はどれか？","choices":["感情→論理→利害→妥結","論理→感情→利害→妥結","利害→感情→論理→妥結","感情→利害→論理→妥結"],"correct":0,"reference":"Mbook 7-15 交渉と説得の3層構造","weight":2,"explanation":"交渉妥結の3層構造アプローチ：「感情（信頼関係の構築・相手への配慮）→論理（データ・根拠による説得）→利害（双方のニーズの充足）→妥結」の順序が効果的。感情面の信頼構築なしに論理・利害の議論をしても妥結しにくい。"},{"id":178,"subject":"ゲーム理論・交渉術","question":"交渉準備の「4ステップ・アプローチ」に<u>含まれない</u>ものはどれか？","choices":["競合他社の財務状況の分析","交渉の構造の把握","相手の心象風景に立つ","Win-Winの妥結点を探る"],"correct":0,"reference":"Mbook 7-16 交渉の準備プロセス","weight":2,"explanation":"交渉準備の4ステップ：①交渉の構造の把握（ZOPAの特定）、②相手の心象風景に立つ（相手の利害・BATNA理解）、③Win-Winの妥結点を探る、④事前準備・練習。「競合他社の財務状況の分析」は交渉準備の4ステップには含まれない。"},{"id":179,"subject":"ゲーム理論・交渉術","question":"交渉における「立場固定」の原因となる「埋没費用（Sunk Cost）」の説明として正しいものはどれか？","choices":["すでに投資・消費されており、将来の意思決定に影響すべきでない過去のコスト","将来の投資に必要な初期費用","取引コストの中で最も回収しやすいコスト","交渉を打ち切ることで発生するコスト"],"correct":0,"reference":"Mbook 7-17 心理バイアス（1）","weight":1,"explanation":"埋没費用（サンクコスト）：過去にすでに投資・消費されており、将来の意思決定に関係なく回収不能なコスト。合理的意思決定では「過去のコストは将来の選択に影響すべきでない」。しかし心理的に「もったいない」と感じて意思決定が歪む「サンクコスト効果」が生じやすい。"},{"id":180,"subject":"ゲーム理論・交渉術","question":"「アンカリング（Anchoring）」効果の説明として正しいものはどれか？","choices":["交渉の最初に提示された数値が基準点となり、その後の合意点に大きく影響する効果","交渉相手の感情に働きかけて合意を引き出す手法","自分の立場を固定して譲歩しない戦術","相手の提案を自動的に低く評価する心理バイアス"],"correct":0,"reference":"Mbook 7-18 心理バイアス（2）","weight":1,"explanation":"アンカリング（Anchoring）効果：交渉や価格設定において、最初に提示された数値（アンカー）が基準点として認知に刻まれ、その後の判断・合意点に大きく引き寄せられる心理バイアス。交渉では先手でアンカーを設定することが有利になりやすい。"},{"id":181,"subject":"ゲーム理論・交渉術","question":"「勝者の呪縛（Winner's Curse）」の説明として正しいものはどれか？","choices":["オークションで落札した勝者が、実は経済的に損をしている現象","交渉に勝った側が相手との関係を損ねてしまう現象","競合他社との競争に勝っても利益が出ない状態","交渉担当者が組織内で評価されない現象"],"correct":0,"reference":"Mbook 7-17 心理バイアス（1）","weight":1,"explanation":"勝者の呪縛（Winner's Curse）：オークション（競争入札）で最も高い金額を提示した落札者が、実際には資産の真の価値を上回る価格で購入してしまい経済的損失を被る現象。情報の非対称性がある市場で生じやすく、M&Aの買収価格過払いにも見られる。"},{"id":182,"subject":"ゲーム理論・交渉術","question":"「フット・イン・ザ・ドア・テクニック」の説明として正しいものはどれか？","choices":["最初に小さな依頼を承諾させ、その後に本来の大きな依頼をする心理的説得法","最初に理不尽な要求を提示し、相手が断った後に本来の要求を提示する手法","ドアを開けて部屋に入ることを交渉の比喩として用いる手法","交渉相手を物理的に不利な状況に置く戦術"],"correct":0,"reference":"Mbook 7-19 交渉の諸戦術","weight":2,"explanation":"フット・イン・ザ・ドア・テクニック：最初に小さな依頼（承諾しやすいもの）を受け入れてもらい、次に本来の大きな依頼をする心理的説得法。一度承諾すると「一貫性」を保とうとする心理を利用。逆に最初に大きな要求をして断られた後に本来の要求をする手法は「ドア・イン・ザ・フェイス」。"},{"id":183,"subject":"ゲーム理論・交渉術","question":"「Win-Win交渉」の本質として正しいものはどれか？","choices":["双方の合計利得が最大化され、両者ともに満足できる妥結点を見つけること","どちらか一方が最大の利益を得ること","交渉に時間をかけず迅速に合意すること","相手の要求をすべて受け入れること"],"correct":0,"reference":"Mbook 7-11 ビジネスパーソンと交渉","weight":2,"explanation":"Win-Win交渉の本質：双方の利害（Interest）を満足させる合計利得が最大化される妥結点を見つけること（パレート最適な合意）。単純な妥協（折半）ではなく、異なる優先事項・利害を交換することで双方の満足度を高める「統合的交渉」が理想。"},{"id":184,"subject":"経営戦略","question":"プラスサム・ゲームの特徴として正しいものはどれか？","choices":["プレイヤーが協調することで互いの利益が増える可能性がある","あるプレイヤーが得をすれば必ず他のプレイヤーが損をする","全プレイヤーの利得合計がゼロになる","競争のみが存在し、協力の余地がない"],"correct":0,"reference":"Mbook 7-2 ゲームの類型","weight":1,"explanation":"プラスサム・ゲーム：プレイヤーが協調・協力することで全体の利益（利得の合計）を増やせるゲーム。ビジネスパートナーシップ・貿易・技術標準化協議などが例。全員が利益を得られる可能性があるという点でゼロサム・ゲームと根本的に異なる。"},{"id":185,"subject":"マーケティング","question":"顧客との長期的関係を重視し、生涯価値（LTV）を最大化することを目的とするマーケティングの考え方を何と呼ぶか？","choices":["顧客維持型マーケティング（リテンション・マーケティング）","マス・マーケティング","プッシュ型マーケティング","トランザクション型マーケティング"],"correct":0,"reference":"Mbook 2-19 顧客維持型マーケティング","weight":1,"explanation":"顧客維持型マーケティング（リテンション・マーケティング）は新規顧客獲得よりも既存顧客との長期的関係を深め、顧客生涯価値（LTV：Lifetime Value）を最大化することを目的とする。顧客離反コスト（Churn）削減と繰り返し購入促進が核心。"},{"id":186,"subject":"アカウンティング","question":"貸借対照表において「繰延資産」に該当するものとして正しいものはどれか？","choices":["開業費や社債発行費など将来の収益に貢献することが期待される支出","現金や預金などの流動資産","土地や建物などの固定資産","仕入れた製品の在庫"],"correct":0,"reference":"Mbook 3-6 貸借対照表（資産）","weight":3,"explanation":"貸借対照表の「繰延資産」は将来の収益に貢献することが期待される支出で、複数期間に費用配分するために計上される資産（例：創立費・開業費・社債発行費など）。通常の資産とは異なり実態のない「費用の繰り延べ」。近年は計上できる繰延資産の種類が制限されている。"},{"id":187,"subject":"ファイナンス","question":"効率的市場仮説の「セミストロング型」の説明として正しいものはどれか？","choices":["公表された情報（財務諸表、ニュースなど）はすでに株価に織り込まれており、公開情報で超過リターンは得られない","過去の株価データのみが織り込まれており、テクニカル分析で超過リターンは得られない","内部情報を含む全情報が株価に織り込まれている","株価は過去の情報に依存しない完全にランダムな動きをする"],"correct":0,"reference":"Mbook 4-15 効率的市場仮説","weight":2,"explanation":"効率的市場仮説のセミストロング型（Semi-strong Form）：すべての公表情報（財務諸表・ニュース・アナリストレポートなど）は即座に株価に織り込まれており、公開情報を使った分析（ファンダメンタルズ分析）では超過リターンは得られない。ウィーク型は過去株価のみ、ストロング型は内部情報も含む。"},{"id":188,"subject":"IT","question":"ナレッジ経営における「コード化戦略」と「個人化戦略」の違いとして正しいものはどれか？","choices":["コード化戦略は知識をデータベースに蓄積・再利用し、個人化戦略は人と人とのコミュニケーションを通じて知識を移転する","コード化戦略は人材育成を重視し、個人化戦略はIT活用を重視する","コード化戦略は対面会議を、個人化戦略は文書化を重視する","両者は同じ目的のための代替手段で、どちらを選んでもよい"],"correct":0,"reference":"Mbook IT-14 ナレッジ経営","weight":1,"explanation":"ナレッジ経営の2戦略：「コード化戦略（Codification）」は知識をデータベースに蓄積・文書化して組織全体で再利用する戦略（ITへの大規模投資）。「個人化戦略（Personalization）」は人と人との直接対話・ネットワークを通じて暗黙知を移転する戦略（専門家育成重視）。"},{"id":189,"subject":"組織行動学","question":"「5つのディシプリン」をシステム思考・自己実現と自己研鑽・メンタル・モデルの克服・共有ビジョンの構築・チーム学習として提唱したのは誰か？","choices":["ピーター・センゲ","アージリス","コッター","チャンドラー"],"correct":0,"reference":"Mbook 5-20 組織学習","weight":1,"explanation":"ピーター・センゲは著書「The Fifth Discipline」で学習する組織の「5つのディシプリン」を提唱：①システム思考（全体最適の思考）②パーソナル・マスタリー（自己実現・成長）③メンタル・モデルの克服④共有ビジョンの構築⑤チーム学習。"},{"id":190,"subject":"組織行動学","question":"「ハーズバーグの動機づけ・衛生理論」において、仕事の満足度を高める「動機づけ要因」として正しいものはどれか？","choices":["達成感、承認、仕事そのもの、責任、昇進","給与、会社の方針、対人関係、作業条件","福利厚生、安全な職場環境","チームワーク、組織の規模"],"correct":0,"reference":"Mbook 5-7 モチベーション","weight":3,"explanation":"ハーズバーグの動機づけ要因（満足を高める要因）：達成感・他者からの承認・仕事そのものへの興味・責任・昇進・成長の機会。これらは内発的動機づけに関わる。一方、衛生要因（不満を防ぐが満足を高めない）：給与・会社の方針・対人関係・作業条件・地位・安全など外的要因。"},{"id":191,"subject":"組織行動学","question":"「衛生要因」の説明として正しいものはどれか？","choices":["不満足を防ぐことはできるが、それ自体が満足や動機づけを高めるわけではない要因（給与、作業条件など）","積極的に仕事へのモチベーションを高める要因","自己実現の欲求に直結する要因","チームの凝集性を高める要因"],"correct":0,"reference":"Mbook 5-7 モチベーション","weight":3,"explanation":"衛生要因は「不満足を防ぐことはできるが、それ自体が積極的な満足や動機づけを高めるわけではない要因」（給与・作業条件・会社方針・対人関係など）。ハーズバーグは衛生要因を充実させるだけでは社員のモチベーションは上がらないと主張した。"},{"id":192,"subject":"人的資源管理","question":"マトリクス型組織の特徴として正しいものはどれか？","choices":["機能別と事業別の2つの指揮命令系統が並存するため、指揮命令が複雑になりやすい","一つの指揮命令系統のみで運営される","全社的な意思決定を各事業部に完全に委譲する","組織の柔軟性が低く、環境変化への対応が遅い"],"correct":0,"reference":"Mbook 5-14 組織形態","weight":3,"explanation":"マトリクス型組織は「機能別（職能別）」と「事業別（製品・地域別）」という2つの指揮命令系統が並存する組織形態。柔軟な人材配置が可能だが、2つのボスが生じるため命令系統が複雑になり、責任の所在が不明確になりやすい（デメリット）。"},{"id":193,"subject":"組織行動学","question":"「ダブルループ・ラーニング」の説明として正しいものはどれか？","choices":["既存の前提や価値観そのものを見直して学習する、より根本的な組織学習の形態","設定された目標に対してPDCAを回す通常の問題解決型学習","個人の学習を組織全体に展開するプロセス","外部コンサルタントによる組織診断と改善提案"],"correct":0,"reference":"Mbook 5-20 組織学習","weight":1,"explanation":"ダブルループ・ラーニング（Double-Loop Learning）：既存の目標・前提・価値観そのものを問い直して学習する根本的・変革的な組織学習。「なぜこのルールが存在するのか」を問う。シングルループ・ラーニングは既存の枠組みの中での問題解決（エラー修正のみ）。"},{"id":194,"subject":"経営戦略","question":"バリューチェーンの「支援活動」として<u>正しい組み合わせ</u>はどれか？","choices":["全般管理・人事労務管理・技術開発・調達活動","購買物流・製造・出荷物流・販売マーケティング","全般管理・製造・人事労務管理・サービス","技術開発・購買物流・出荷物流・調達活動"],"correct":0,"reference":"Mbook 1-14 バリューチェーン","weight":3,"explanation":"バリューチェーンの「支援活動」は主活動を支える4つの活動：①全般管理（企業インフラ）・②人事労務管理・③技術開発・④調達活動。「主活動」は購買物流・製造・出荷物流・販売マーケティング・サービスの5つ。支援活動も競争優位の源泉となり得る。"},{"id":195,"subject":"アカウンティング","question":"損益計算書において「経常利益」を計算するための正しい式はどれか？","choices":["営業利益 ＋ 営業外収益 ー 営業外費用","売上高 ー 売上原価","売上総利益 ー 販売費及び一般管理費","税金等調整前当期純利益 ー 法人税等"],"correct":0,"reference":"Mbook 3-5 損益計算書","weight":3,"explanation":"経常利益の計算式：経常利益＝営業利益＋営業外収益－営業外費用。例：受取利息（営業外収益）を加え、支払利息（営業外費用）を差し引く。「売上高－売上原価」は売上総利益、「売上総利益－販管費」は営業利益の計算式。"},{"id":196,"subject":"ファイナンス","question":"永久年金の現在価値（PV）を計算する正しい式はどれか？","choices":["PV = CF ÷ r（毎期のキャッシュフローを割引率で割る）","PV = CF × r","PV = CF × (1+r)^n","PV = CF ÷ (1+r)^n"],"correct":0,"reference":"Mbook 4-3 現在価値の計算","weight":2,"explanation":"永久年金の現在価値（PV）＝CF（毎期のキャッシュフロー）÷ r（割引率）。永久に毎期一定額を受け取る場合の現在価値を求める公式。例：毎期100万円、割引率5%なら PV＝100万÷0.05＝2000万円。企業の継続価値（Terminal Value）算定にも使われる考え方。"},{"id":197,"subject":"IT","question":"ビジネスモデルを構成する5要素に<u>含まれない</u>ものはどれか？","choices":["人材戦略モデル","市場モデル","戦略モデル","収益モデル"],"correct":0,"reference":"Mbook IT-10 インターネット・ビジネス","weight":1,"explanation":"インターネット・ビジネスモデルの5要素：①市場モデル（誰に・何を・どのように）②戦略モデル（競争優位）③収益モデル（どう稼ぐか）④調達・供給モデル⑤組織モデル。「人材戦略モデル」は5要素の一つとして独立して定義されていない。"},{"id":198,"subject":"ゲーム理論・交渉術","question":"「反射的価値低下（Reactive Devaluation）」の説明として正しいものはどれか？","choices":["相手側から提案された内容を、その出所が相手だというだけで自動的に低く評価してしまう心理バイアス","自分の提案が相手に評価されないことで意欲が低下する現象","交渉で最初に提示された価格が低すぎると交渉全体の価値が下がる効果","相手の反応を見て自動的に自分の要求を下げてしまう現象"],"correct":0,"reference":"Mbook 7-17 心理バイアス（1）","weight":1,"explanation":"反射的価値低下（Reactive Devaluation）：交渉において、相手側から提案された内容を、その出所が「相手側だ」というだけで自動的に低く評価してしまう認知バイアス。同じ内容でも第三者や中立者が提案すれば受け入れやすくなる。"},{"id":199,"subject":"経営戦略","question":"「アドバンテージ・マトリクス」の2つの軸として正しいものはどれか？","choices":["競争要因の数（多い・少ない） × 優位性構築の可能性（大きい・小さい）","市場成長率（高い・低い） × 市場シェア（高い・低い）","製品の新規・既存 × 市場の新規・既存","内部環境（強み・弱み） × 外部環境（機会・脅威）"],"correct":0,"reference":"Mbook 1-13 アドバンテージ・マトリクス","weight":2,"explanation":"アドバンテージ・マトリクスの2軸：「競争要因の数（多い・少ない）×優位性構築の可能性（大きい・小さい）」。PPMの市場成長率×市場シェアとは異なる。4象限：規模型（競争要因少・優位性大）・特化型（多・大）・分散型（多・小）・手づまり型（少・小）。"},{"id":200,"subject":"マーケティング","question":"ブランド体系の階層として最も広義のブランドから順に正しく並べているものはどれか？","choices":["コーポレートブランド→事業ブランド→ファミリーブランド→商品群ブランド→商品ブランド","商品ブランド→商品群ブランド→ファミリーブランド→事業ブランド→コーポレートブランド","コーポレートブランド→商品ブランド→ファミリーブランド→商品群ブランド→事業ブランド","ファミリーブランド→コーポレートブランド→商品群ブランド→事業ブランド→商品ブランド"],"correct":0,"reference":"Mbook 2-9 ブランド","weight":3,"explanation":"ブランド体系の階層（広義から狭義の順）：コーポレートブランド（企業全体）→事業ブランド（事業単位）→ファミリーブランド（製品群）→商品群ブランド→商品ブランド（個別製品）。ブランド管理では「どの階層でブランド価値を訴求するか」の戦略判断が重要。"},{id:201,subject:"経営戦略",question:"「戦略」という言葉の起源をもつ言語は次のうちどれか。",choices:["ギリシャ語", "英語", "フランス語", "ドイツ語"],correct:0,reference:"Mexam Ch1-I 戦略コンセプト",explanation:"戦略という言葉は、ギリシャ語のストラテゴス（strategos）に由来し、将軍の術もしくは将軍の職分を意味している。もともと軍事用語であったこの言葉は、1950年の終わりに経営学の分野で広く利用され、現在では経営戦略論として固有の研究領域が確立している。",weight:2},{id:202,subject:"経営戦略",question:"ミンツバーグが定義した戦略の5つのPに含まれないものは次のうちどれか。",choices:["プライオリティ", "プラン", "パターン", "ポジション"],correct:0,reference:"Mexam Ch1-I 戦略コンセプト",explanation:"5つのPは、戦略コンセプトの多様な定義を整理したものである。それらは、将来の行動計画としてのプラン（plan）、競争業者を出し抜くような策略（ploy）、行動の一貫性（pattern）、組織のものの見方や考え方（perspective）、外部環境に組織を位置づける手段（position）であり、各コンセプトの頭文字のPをとって5Pと呼ばれている。",weight:2},{id:203,subject:"経営戦略",question:"企業のタスク環境に当てはまるものは次のうちどれか。",choices:["労働市場の変化", "ライフスタイルの変化", "貯蓄率の上昇", "出生率の低下"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"企業環境は、一般環境とタスク環境に分類される。一般環境は、企業の上位レベルにあるシステムの特性であり、社会、文化、政治・法律、経済、科学技術などがある。タスク環境は、組織の目標設定や目標達成に直接に関わる環境であり、製品市場や労働市場などがある。",weight:3},{id:204,subject:"経営戦略",question:"ポーターの競争の5要因に含まれないものは次のうちどれか。",choices:["買い手との協調関係", "新規参入の脅威", "代替品の脅威", "売り手の交渉力"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"競争の5要因は、企業が属する業界の魅力度、つまり業界の利益率を規定する5つの要素を明らかにしている。それらは業者間の敵対関係、新規参入の脅威、買い手の交渉力、売り手の交渉力、代替品の脅威からなる。それぞれの要因は業界の利益を下げる影響力であるため、各影響が強い業界ほど魅力のない業界となる。",weight:3},{id:205,subject:"経営戦略",question:"新規参入の参入障壁に当てはまるものは次のうちどれか。",choices:["規模の経済性", "買い手の集中", "売り手の多さ", "退出の困難性"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"参入障壁とは、新規参入企業のある業界への参入意欲を低める業界の性質である。参入障壁には、規模の経済の他に規模に無関係なコスト不利益（パテント、立地条件、経験曲線等）、製品差別化、流通チャネルへのアクセス、資金の必要性、政府の政策がある。",weight:3},{id:206,subject:"経営戦略",question:"戦略グループとして正しく説明しているものは次のうちどれか。",choices:["同一業界の中で、行動の違いにより分類される企業グループ", "同一業界の中で、顧客層の違いにより分類される企業グループ", "戦略を遂行するために提携した企業グループ", "資本関係にある企業グループ"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"戦略グループは、業界内で同質的な戦略行動を採用している企業をグループ化したものである。戦略グループは、製品や顧客の専門度などの市場関連行動、製品の品質やコストなどの製品に関連する行動、および垂直統合の程度など、さまざまな行動の同質性を把握することで明確になる。低いグループの企業は、高いグループが生み出す参入障壁、つまり移動障壁により好業績企業のメンバーになることが困難になる。",weight:3},{id:207,subject:"経営戦略",question:"スイッチングコストの意味として正しいものは次のうちどれか。",choices:["顧客が他社製品に切り替えるとき生じるコスト", "企業が設備投資にかけるコスト", "顧客が製品に関する情報を収集するコスト", "企業が新製品を開発するためにかけるコスト"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"スイッチングコストは、ある企業の顧客が他社の製品に切り替えようとするとき生じるコストのことである。顧客がある企業の製品を使いこなすために多くの時間と労力をかけた場合、また他社の製品に切り替えれば、これまで受けていたサービスが受けられない場合、スイッチングコストが生じることになる。",weight:3},{id:208,subject:"経営戦略",question:"移動障壁の意味として正しいものは次のうちどれか。",choices:["異なる戦略グループへ参入しようとするとき生じる障壁", "ある業界に参入しようとするとき生じる障壁", "海外に進出しようとするとき生じる障壁", "業界から撤退しようとするとき生じる障壁"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"移動障壁は、業界内に存在する他の戦略グループへの参入を妨げる要因のことである。業界レベルの参入障壁と同様に、規模の経済や製品差別化、政府の政策などが移動障壁を構成する要因となる。",weight:3},{id:209,subject:"経営戦略",question:"退出障壁に関わる競争要因は次のうちどれか。",choices:["業者間の敵対関係", "新規参入の脅威", "代替品の脅威", "買い手の交渉力"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"退出障壁は、業界からの撤退の困難性を意味している。業界からの撤退が困難な場合、利益が上がらない状況でも競争業者の数が減らないため、業者間の敵対関係は高まることになる。退出障壁は、企業の保有する資産がある業界の事業活動に特殊化され、他の事業に転用できない場合に生じるといわれている。",weight:3},{id:210,subject:"経営戦略",question:"代替品として正しく説明しているものは次のうちどれか。",choices:["異なる方法で同一ニーズを満たす製品", "価格弾力性の高い製品", "異なる方法で異なるニーズを満たす製品", "価格弾力性の低い製品"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"代替品とは、異なる技術を使って同じニーズを満たす製品・サービスである。CDがレコード針に取って代わったように、技術革新からうまれた代替品は、既存業界にとって大きな脅威となる。",weight:3},{id:211,subject:"経営戦略",question:"価格感受性を高める要因に当てはまるものは次のうちどれか。",choices:["製品が買い手コストの大部分を占める", "買い手が儲かっている", "買い手の購入する製品が差別化されている", "買い手の数が少ない"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"製品価格の上昇に敏感に反応し、価格交渉を行う意欲をもつ買い手は、価格感受性の高い買い手である。買い手の価格感受性は、(1)売り手の製品が買い手コストの大部分を占める、(2)買い手の利益水準が小さい、(3)売り手の製品が差別化されていない場合に高まるといわれている。",weight:3},{id:212,subject:"経営戦略",question:"業者間の敵対関係を強める要因は次のうちどれか。",choices:["製品に独自性がない", "競合企業の数が少ない", "固定費が小さい", "業界の成長率が高い"],correct:0,reference:"Mexam Ch1-II 企業環境",explanation:"敵対関係とは、ある業界で直接競合している企業間の競争の激しさである。敵対関係を強める要因としては、(1)競合企業の数が多い、(2)業界の成長率が低い、(3)製品・サービスに独自性がない、(4)固定費が大きい、(5)製品陳腐化が早い、などがある。",weight:3},{id:213,subject:"経営戦略",question:"バリューシステムとして正しく説明しているものは次のうちどれか。",choices:["原材料から最終消費に至る複数企業による価値創出フロー", "競合他社間で価値を創出しあう複数の事業活動の総体", "垂直的に連鎖した価値を生み出す単一の事業活動の総体", "複数企業が連鎖して価値を生み出す複数の事業活動の総体"],correct:0,reference:"Mexam Ch1-III バリューチェーン・経営資源",explanation:"バリューシステムは、ある顧客価値を創造するために複数企業のバリューチェーンが垂直的に連鎖したものである。バリューシステムを分析することで川上、川下に存在する企業のバリューチェーンが明確になり、企業は自社のバリューチェーンを垂直的関係の中で理解することができる。",weight:3},{id:214,subject:"経営戦略",question:"VRIO分析の4つの頭文字が意味するものとして正しいものは次のうちどれか。",choices:["Vは価値、Rは希少性、Iは模倣困難性、Oは組織を指す", "Vは価値、Rは模倣困難性、Iは組織、Oは希少性を指す", "Vは組織、Rは希少性、Iは模倣困難性、Oは価値を指す", "Vは稀少性、Rは価値、Iは模倣困難性、Oは組織を指す"],correct:0,reference:"Mexam Ch1-III バリューチェーン・経営資源",explanation:"VRIOのV（Value）は価値、R（Rarity）は希少性、I（Imitability）は模倣可能性の逆の意味で模倣困難性、O（Organization）は組織を指している。企業は、保有する資源・能力を4つの観点から分析し、資源・能力と企業競争力との関係を明確にすることができる。",weight:3},{id:215,subject:"経営戦略",question:"希少性のある経営資源の特徴として正しいものは次のうちどれか。",choices:["その経営資源はごく少数の競合他社がコントロールしている", "その経営資源は外部環境の脅威に対処できる", "その経営資源を競合他社が開発しようとするときコスト不利益を被る", "いずれでもない"],correct:0,reference:"Mexam Ch1-III バリューチェーン・経営資源",explanation:"VRIOは、持続的競争優位に関わる経営資源の特徴を明らかにするための分析手法である。外部環境の機会や脅威に対処できる資源を価値ある資源（V）、業界内の少数の企業しかコントロールしていない資源を希少性の高い資源（R）、競合他社が模倣するのに高いコストがかかる資源（I）を模倣困難な資源として捉えている。Oは、これらの資源を活用する組織である。",weight:3},{id:216,subject:"経営戦略",question:"ハメル（Hamel, G.）とプラハラド（Prahalad, C.K.）が提示した企業の中核となる経営資源のコンセプトは次のうちどれか。",choices:["コアコンピタンス", "コアテクノロジー", "コアケイパビリティ", "コアコンセプト"],correct:0,reference:"Mexam Ch1-III バリューチェーン・経営資源",explanation:"コアコンピタンスは、企業の競争優位の源泉となる経営資源を示す概念である。ハメルとプラハラドは、コアコンピタンスを「組織における集団的学習であり、特に多様な製造スキルをいかに調整するか、また複数の技術を統合するかを学ぶことである。」と定義している。",weight:3},{id:217,subject:"経営戦略",question:"伊丹敬之が提示した見えざる資産に最も当てはまるものは次のうちどれか。",choices:["顧客との信頼関係", "未熟練労働者", "市販されている設備", "汎用部品"],correct:0,reference:"Mexam Ch1-III バリューチェーン・経営資源",explanation:"見えざる資産は情報的経営資源とも呼ばれ、ブランド、ノウハウ、顧客の信頼、組織風土などがある。見えざる資産は、(1)カネをだしても買えないことが多い、(2)つくるのに時間がかかる、(3)複数の製品や分野で同時多重利用ができる、という特徴を兼ね備えている。",weight:3},{id:218,subject:"経営戦略",question:"競争戦略が目指す最終的な成果は次のうちどれか。",choices:["投資収益率", "マーケットシェア", "売上拡大", "社会的認知度"],correct:0,reference:"Mexam Ch1-IV 事業戦略",explanation:"競争戦略では、規模拡大やシェア拡大よりも利益をいかにうみだすかが重要な成果であると考えられている。ある業界において投資収益率の高い企業ほど競争優位性が高い企業なのである。",weight:3},{id:219,subject:"経営戦略",question:"経験曲線の考え方を示しているものは次のうちどれか。",choices:["累積生産量の増加に伴い単位当たりコストが低下する", "生産規模の拡大に伴い単位当たりコストが低下する", "従業員数が増大するとともに単位当たりコストが低下する", "上のすべて"],correct:0,reference:"Mexam Ch1-IV 事業戦略",explanation:"経験曲線は、BCG（ボストンコンサルティンググループ）によって発見された。累積生産量が2倍になるごとに一定比率で製品の単位当たりコストが低下することが明らかにされている。経験曲線が生じる理由としては、熟練による労働効率の向上、専門化による作業法の改善などさまざまなものがあるといわれている。",weight:3},{id:220,subject:"経営戦略",question:"コストリーダーシップ戦略に当てはまらないものは次のうちどれか。",choices:["付帯サービスの追加", "規模の経済性の活用", "低コスト生産要素へのアクセス", "経験曲線の活用"],correct:0,reference:"Mexam Ch1-IV 事業戦略",explanation:"コストリーダーシップ戦略は、業界内の広い範囲で低コスト化を追求する戦略である。具体的な方法としては、規模の経済性や経験曲線の活用による低コスト化に加え、低コスト資源の獲得やオペレーションの効率化によって達成される。",weight:3},{id:221,subject:"経営戦略",question:"マス・カスタマイゼーションの意味を明らかにしているものは次のうちどれか。",choices:["大衆市場にカスタム化された製品を販売する", "大衆市場に標準製品を販売する", "ニッチ市場に標準品を販売する", "ニッチ市場にカスタム化された製品を販売する"],correct:0,reference:"Mexam Ch1-IV 事業戦略",explanation:"マス・カスタマイゼーションは、大衆市場において顧客ごとにカスタム化された製品・サービスを低コストかつ高い品質をもって届けることである。マス・カスタマイゼーションを実現する方法として、(1)標準化された製品・サービスにカスタム化したサービスを付加する、(2)カスタム化可能な製品・サービスを開発する、(3)配送時点でのカスタム化を推進する、(4)価値連鎖の全体にわたって迅速な対応を実現する、(5)コンポーネントをモジュール化する、がある。",weight:3},{id:222,subject:"経営戦略",question:"ファーストムーバーアドバンテージについて述べているものは次のうちどれか。",choices:["市場に一番乗りすることから得られる優位性", "一番早く戦略提携を行うことから得られる優位性", "一番早く特許を出願することから得られる優位性", "いずれでもない"],correct:0,reference:"Mexam Ch1-IV 事業戦略",explanation:"ファーストムーバーアドバンテージとは、創出しつつある新しい業界に一番早く参入することから獲得される競争優位性を意味している。先発企業は、業界発展の初期段階において自社に有利な競争ルールや業界構造を確立することで競争優位を発揮することができる。",weight:3},{id:223,subject:"経営戦略",question:"エーベル（Abell, D.F.）が提示した事業の定義の次元として正しいものは次のうちどれか。",choices:["技術、顧客層、顧客機能", "競争、顧客層、技術", "価格、商品、仕様", "市場支配力、技術、補完性"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"事業の定義とは、企業がどんな事業を行っているかを明確化することである。その基本次元が顧客機能、顧客層、技術である。つまり、だれの（顧客層）どのようなニーズを（顧客機能）、いかに（技術）満たすかを認識することで、自社の事業ドメインは明確になるのである。",weight:3},{id:224,subject:"経営戦略",question:"PPMが対象とする企業に当てはまるものは次のうちどれか。",choices:["多角化した企業", "単一事業の企業", "ベンチャー企業", "上のすべて"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"PPM（Product Portfolio Management）は、複数事業を有する多角化した企業が、各事業の位置づけと資源配分を適切に行うために開発されたモデルである。PPMにはボストンコンサルティンググループが開発したBCGモデルとジェネラルエレクトリック社が開発したGEモデルがある。",weight:3},{id:225,subject:"経営戦略",question:"PPMにおける問題児について説明しているものは次のうちどれか。",choices:["市場成長率が高く相対的市場シェアが低い事業", "市場成長率が低く相対的市場シェアが高い事業", "市場成長率と相対的市場シェアが高い事業", "市場成長率と相対的市場シェアが低い事業"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"PPM分析では、市場成長率が高く相対的市場シェアが高い花形、市場成長率が低く相対的市場シェアが高い金のなる木、市場成長率は高いが相対的市場シェアの低い問題児、市場成長率と相対的市場シェアのどちらも低い負け犬の4つに事業を分類することで、企業の事業構造を明確化することができる。",weight:3},{id:226,subject:"経営戦略",question:"多角化の説明に該当するものは次のうちどれか。",choices:["新しい事業領域への進出", "製品の新しい用途先の開発", "低価格の製品ラインの追加", "部品の内製化"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"多角化とは、従来とは異なる製品・市場領域への進出、つまり新しい事業を開発することで、企業が営む事業領域を拡大することを意味している。多角化のタイプは、大きく関連型多角化と非関連型多角化に分けられる。",weight:3},{id:227,subject:"経営戦略",question:"原材料の生産や製品の流通を自前で行うようにする戦略は次のうちどれか。",choices:["垂直統合", "事業統合", "水平統合", "外注"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"垂直統合は、企業が既存のバリューチェーンの活動に川上もしくは川下での活動を付加することをいう。ある完成品メーカーが部品生産のような川上の活動を行うことを後方統合、また同メーカーが直接販売方式を採用し川下の活動を行うことを前方統合と呼ぶ。",weight:3},{id:228,subject:"経営戦略",question:"複数の製品を1企業で生産する方が個々の企業で生産するよりもコストが低くなる現象を何と呼ぶか。",choices:["範囲の経済性", "規模の経済性", "垂直統合の経済", "経験曲線効果"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"範囲の経済性は、複数の製品を別々の企業で生産するよりも1企業で生産する方がコストが低くなるという経済効果である。この効果は、ある企業が多品種少量生産のような効率的な生産技術をもつ場合や、経営資源の共有が可能な場合に具体化される。",weight:3},{id:229,subject:"経営戦略",question:"多角化において既存事業の新事業に対する関連性を説明しているコンセプトは次のうちどれか。",choices:["シナジー", "エージェンシー", "パートナーシップ", "セグメンテーション"],correct:0,reference:"Mexam Ch1-V 全社戦略・ドメイン・PPM",explanation:"シナジーは、事業間での技術やノウハウといった経営資源の相互関連効果である。既存事業の資源が新事業に活用できれば、投資コストの削減や事業開発スピードが高まり、多角化が成功する可能性は高まる。シナジーは、大きく技術関連シナジーと市場関連シナジーに分けられる。",weight:3},{id:230,subject:"マーケティング",question:"マーケティングが顧客ニーズを満たす製品・サービスを提供する目的は次のうちどれか。",choices:["市場の創造・維持", "市場の探索", "市場の調査・研究", "市場の運動"],correct:0,reference:"Mexam Ch2-I マーケティングの役割",explanation:"マーケティング（marketing）という語はmarketとingからなっている。すなわち、マーケティングは売り手が市場（market）に対して何らかの働きかけ（ing）を行うことを意味する。この働きかけの中心が、潜在的な顧客ニーズを発見し、それを充足することによって新たな市場を創造・維持することである。",weight:2},{id:231,subject:"マーケティング",question:"マーケティングの発想は、次のうちどの点に基づくものであるか。",choices:["ニーズ", "モノ", "機能", "デザイン"],correct:0,reference:"Mexam Ch2-I マーケティングの役割",explanation:"マーケティングは、製品・サービスという購買・利用対象であるモノからではなく、買い手のニーズから発想する点に大きな特徴がある。こうしたニーズからの発想は、競合製品からどのような点で自社製品を差別化するかだけでなく、誰と競争しているのかという競合関係を明らかにする際にも重要である。",weight:2},{id:232,subject:"マーケティング",question:"「良いものは売れる」という考え方が示す志向は次のうちどれか。",choices:["製品志向", "マーケティング志向", "顧客志向", "販売志向"],correct:0,reference:"Mexam Ch2-I マーケティングの役割",explanation:"「良いものは売れる」という製品志向の考え方は、買い手のニーズではなく売り手の提供するモノに焦点が当てられている。売り手が提供する製品・サービスが「良いもの」であるかどうかを判断するのは買い手であり、売り手ではないことを理解することが重要である。マーケティング志向は、潜在的な買い手のニーズを探り当て、それを満足させることによって最大の顧客価値を生み出す。",weight:2},{id:233,subject:"マーケティング",question:"マーケティング戦略と最も密接に関係するのは次のうちどれか。",choices:["事業戦略", "経営理念", "全社戦略", "機能戦略"],correct:0,reference:"Mexam Ch2-I マーケティングの役割",explanation:"マーケティングは、最も基本的には特定の事業における製品レベルでの市場戦略として位置づけられる。ただし、そこでのマーケティング戦略は、企業の経営理念、全社戦略、他の機能戦略（生産、財務・会計、人事、組織など）と整合的でなければならない。",weight:2},{id:234,subject:"マーケティング",question:"顧客を満足させるうえでマーケティングが他の経営機能とあるべき関係は次のうちどれか。",choices:["他の機能を統合する", "他の機能と独立して活動する", "他の機能を支配する", "他の機能に従う"],correct:0,reference:"Mexam Ch2-I マーケティングの役割",explanation:"顧客ニーズを満たし、顧客満足を提供することを目標とするマーケティングは、マーケティング部門の中で完結するわけではない。あらゆる企業活動の中心には顧客が据えられるべきであり、生産、財務・会計、人事、組織などすべての経営機能が顧客満足の実現に向けて遂行されるように、マーケティングはそれらを統合する重要な役割を担っている。",weight:2},{id:235,subject:"マーケティング",question:"マーケティング戦略策定プロセスの4つのステップとして正しいものは次のうちどれか。",choices:["環境分析→市場細分化・ターゲット設定→ポジショニング→マーケティング・ミックス策定", "環境分析→ポジショニング→市場細分化→マーケティング・ミックス策定", "ポジショニング→環境分析→市場細分化→マーケティング・ミックス策定", "市場細分化→環境分析→ポジショニング→マーケティング・ミックス策定"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"マーケティング戦略策定プロセスは、①環境分析（内外環境の把握）→②市場細分化・ターゲット設定（STP分析）→③ポジショニング（自社の独自性の位置づけ）→④マーケティング・ミックス策定（4P）の4ステップで行われる。",weight:3},{id:236,subject:"マーケティング",question:"市場セグメントとして正しく説明しているのは次のうちどれか。",choices:["同質なニーズや属性をもつ顧客グループ", "同質な製品を購入する顧客グループ", "同一地域に住む顧客グループ", "同一所得水準の顧客グループ"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"市場細分化によって、同質なニーズや属性をもつ顧客層（市場セグメント）が識別される。売り手はその中から成長性や収益性、競争状況、自社の強みが生かせるかなどの観点から、自社にとって魅力的な市場セグメントを抽出し、マーケティング訴求の対象とする。",weight:3},{id:237,subject:"マーケティング",question:"ポジショニングの目的として正しいものは次のうちどれか。",choices:["競合製品と差別化した自社製品・サービスの独自性を顧客に認識させること", "市場全体でシェアを拡大すること", "製品の価格を最適化すること", "顧客データを収集・管理すること"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"ポジショニングは、特定のターゲット・セグメントにおいて、数ある競合製品・サービスの中に自社製品を特長あるものとして位置づけることにより、顧客にその独自性を認識してもらうことを目的とする。買い手からみたこの独自性は、売り手にとっては製品・サービスの差別性を意味する。",weight:3},{id:238,subject:"マーケティング",question:"カニバリゼーション（共食い）として正しく説明しているのは次のうちどれか。",choices:["自社の製品・サービス間で同じ顧客を奪い合うこと", "競合他社の顧客を自社製品で奪うこと", "製品の価格を引き下げて市場シェアを奪うこと", "新製品が旧製品より劣る現象"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"カニバリゼーション（共食い）とは、自社の製品・サービス間で同じ顧客を奪い合い、それぞれの製品・サービスに売上高の低下など負の影響を及ぼすことを指す。ポジショニングに際しては、自社製品とのカニバリゼーションを避けること、顧客にとって魅力的であること、競合他社（製品）と明確に差別化されていることの3つが重要である。",weight:3},{id:239,subject:"マーケティング",question:"マーケティング・ミックス（4P）に含まれないものは次のうちどれか。",choices:["プロセス", "製品", "価格", "プロモーション"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"マーケティング・ミックスは製品（Product）、価格（Price）、プロモーション（Promotion）、および流通チャネル（Place）の4Pで構成される。「プロセス」は4Pには含まれない（7Pでは追加されるが、基本の4Pには含まれない）。",weight:3},{id:240,subject:"マーケティング",question:"市場を単一の同質的なセグメントからなるとみなして行われるマーケティングは何と呼ばれるか。",choices:["無差別型マーケティング", "差別型マーケティング", "集中型マーケティング", "個別型マーケティング"],correct:0,reference:"Mexam Ch2-II 環境分析とポジショニング",explanation:"市場を単一の同質的なセグメントからなるとみなして行われるマーケティングを無差別型マーケティングと呼ぶ。規模の大きな全体市場に向けて行われるため、買い手のニーズへの訴求効果よりも売り手の生産やマーケティング・販売の効率に重点を置いた方法である。",weight:3},{id:241,subject:"マーケティング",question:"製品を核レベル・形態レベル・付属機能レベルの3つで捉えた概念を提唱したのは誰か。",choices:["コトラー", "ポーター", "アンゾフ", "BCG"],correct:0,reference:"Mexam Ch2-III 製品とブランド戦略",explanation:"コトラーは製品を3つのレベルで捉えた。①核レベル（製品の核）：買い手のニーズを満たす基本的な機能・価値、②形態レベル（製品の形態）：スタイル・ブランド名・パッケージ・デザインなど、③付属機能レベル（製品の付属機能）：アフターサービス・保証・取り付け・配達など。",weight:3},{id:242,subject:"マーケティング",question:"ブランドの構成要素として適切でないものは次のうちどれか。",choices:["便益", "パーソナリティ", "ロイヤルティ", "価値観"],correct:0,reference:"Mexam Ch2-III 製品とブランド戦略",explanation:"ブランドの構成要素には、名称、ロゴ・シンボル、スローガン・キャッチコピー、キャラクター、パッケージなどが含まれる。「便益」は製品・サービスそのものの特性・価値であり、ブランドの構成要素ではない。",weight:3},{id:243,subject:"マーケティング",question:"複数のカテゴリーの製品・サービスにわたって付与されたブランドは何と呼ばれるか。",choices:["ファミリー・ブランド", "コーポレート・ブランド", "事業ブランド", "製品ブランド"],correct:0,reference:"Mexam Ch2-III 製品とブランド戦略",explanation:"ファミリー・ブランドとは、複数のカテゴリーの製品・サービスにわたって付与されたブランドのことである。例えばヤマハブランドが楽器・バイク・電子機器など複数カテゴリーに使われる場合がこれに当たる。単一製品ラインへのブランドは個別ブランド、単一製品群へはライン・ブランドと呼ばれる。",weight:3},{id:244,subject:"マーケティング",question:"ブランド拡張のデメリットは次のうちどれか。",choices:["ブランド・イメージの希薄化", "ブランド・イメージの固定化", "投資額の増大", "時間がかかる"],correct:0,reference:"Mexam Ch2-III 製品とブランド戦略",explanation:"ブランド拡張とは、確立されたブランドを新製品カテゴリーに適用することである。デメリットとして、異なる製品カテゴリーに拡張することでブランド・イメージが希薄化（dilution）するリスクがある。また、新製品が失敗した場合に既存ブランドの評判も傷つく可能性がある。",weight:3},{id:245,subject:"マーケティング",question:"ブランドがもつ無形の経営資産としての価値は何と呼ばれるか。",choices:["ブランド・エクイティ", "ブランド・アイデンティティ", "ブランド・イメージ", "ブランド・ロイヤルティ"],correct:0,reference:"Mexam Ch2-III 製品とブランド戦略",explanation:"ブランド・エクイティとは、ブランドがもつ無形の経営資産としての価値のことである。アーカーによればブランド・エクイティは、①ブランド認知、②知覚品質、③ブランド連想、④ブランド・ロイヤルティ、⑤その他の資産（特許・商標など）の5つの要素で構成される。",weight:3},{id:246,subject:"マーケティング",question:"価格設定の上限を決める要因として正しいものは次のうちどれか。",choices:["カスタマー・バリュー（顧客価値）", "製造コスト", "競合他社の価格", "法規制"],correct:0,reference:"Mexam Ch2-IV 戦略的価格設定",explanation:"価格設定の上限を決める要因はカスタマー・バリュー（顧客価値）である。顧客が感じる価値（便益）を超えた価格では購買されないため、顧客価値が価格の上限となる。一方、コスト（費用）が価格の下限を決める。",weight:3},{id:247,subject:"マーケティング",question:"製品差別化が進むと価格設定においてどのような効果が生じるか。",choices:["より高い自由度で価格を設定できる", "完全競争の状態に近づく", "プライス・テイカーになる", "価格競争が激化する"],correct:0,reference:"Mexam Ch2-IV 戦略的価格設定",explanation:"製品差別化が進むほど、競合との価格比較が困難になり、顧客は自社製品固有の価値を認識するため、企業はより高い自由度で価格を設定できる。逆にコモディティ化が進めば価格競争に巻き込まれ、価格設定の自由度は低下する。",weight:3},{id:248,subject:"マーケティング",question:"生産者と消費者との間に流通業者が介在することの根拠となる原理は次のうちどれか。",choices:["取引総数最小化の原理", "価値連鎖の原理", "情報の非対称性原理", "規模の経済の原理"],correct:0,reference:"Mexam Ch2-VI 流通チャネルのマネジメント",explanation:"生産者と消費者の間に流通業者（仲介業者）が介在することで、生産者と消費者の間の総取引数を最小化できる。これを「取引総数最小化の原理」という。仲介業者がいない場合に比べて、仲介業者を通すことで取引数が大幅に減少し、流通の効率化が図られる。",weight:3},{id:249,subject:"マーケティング",question:"企業型VMS（垂直的マーケティングシステム）の特徴として正しいものは次のうちどれか。",choices:["契約型・管理型VMSに比べて最も統制力が強い", "チャネルへの投資が不要", "環境変化に最も柔軟に対応できる", "各メンバーが独立して行動する"],correct:0,reference:"Mexam Ch2-VI 流通チャネルのマネジメント",explanation:"企業型VMS（垂直的マーケティングシステム）とは、チャネル全体（製造・卸・小売）を一つの企業が所有・運営する形態である。チャネル・リーダーが全段階を直接支配するため、契約型・管理型VMSに比べて最も統制力が強い。",weight:3},{id:250,subject:"マーケティング",question:"管理型VMSの説明として正しいものは次のうちどれか。",choices:["顧客データベースやブランド力をもつチャネル・リーダーが販売地域ごとに卸売業者を選定し優先的販売権を与えるシステム", "複数の独立した企業が契約に基づいて統合されたチャネルを運営するシステム", "単一企業が生産から販売まで一貫して管理するシステム", "メーカーが小売業者を支配するシステム"],correct:0,reference:"Mexam Ch2-VI 流通チャネルのマネジメント",explanation:"管理型VMSとは、顧客データベースやブランド力などの経営資源をもつチャネル・リーダーが、販売地域ごとに卸売業者を選定し優先的販売権（エクスクルーシブ・ディーラー）を与えることで、契約によらずにチャネルを管理する形態である。",weight:3},{id:251,subject:"マーケティング",question:"マーケティング・リサーチにおける1次データの説明として正しいものは次のうちどれか。",choices:["調査目的のために独自に収集したデータ", "既存の統計や文献から得られたデータ", "政府機関が収集した統計データ", "競合他社が公開したデータ"],correct:0,reference:"Mexam Ch2-VII マーケティング・リサーチ",explanation:"マーケティング・リサーチにおける1次データとは、特定の調査目的のために独自に収集した新規データのことである。アンケート調査・インタビュー・観察調査などの方法で収集する。一方、2次データは既存の調査結果・統計・レポートなどから収集したデータである。",weight:3},{id:252,subject:"人・組織",question:"マズローの欲求段階説の理論的ベースを構成する2つの動機は次のうちどれか。",choices:["欠乏動機と成長動機", "外発的動機と内発的動機", "生理的動機と社会的動機", "個人的動機と集団的動機"],correct:0,reference:"Mexam Ch3-II モチベーション",explanation:"マズローの欲求段階説は、欠乏動機（生理的欲求・安全欲求・社会的欲求・承認欲求）と成長動機（自己実現欲求）の2つの動機で構成される。欠乏動機は不足を補おうとする動機であり、成長動機は自己実現・成長を目指す動機である。",weight:3},{id:253,subject:"人・組織",question:"ハーズバーグの衛生要因に当てはまるものは次のうちどれか。",choices:["作業条件・給与", "達成感", "承認", "責任"],correct:0,reference:"Mexam Ch3-II モチベーション",explanation:"ハーズバーグの2要因理論では、衛生要因（会社の政策・管理方針・給与・対人関係・作業条件など）はそれ自体では動機づけにはならないが、満たされないと不満足の原因となる。衛生要因を改善しても満足感は生まれず、不満足を防ぐにすぎない。",weight:3},{id:254,subject:"人・組織",question:"ハーズバーグの動機づけ要因に当てはまるものは次のうちどれか。",choices:["達成・承認・責任", "作業条件", "対人関係", "給与"],correct:0,reference:"Mexam Ch3-II モチベーション",explanation:"ハーズバーグの動機づけ要因（達成・承認・仕事そのもの・責任・昇進・成長など）は、満足感をもたらし内発的な動機づけにつながる要因である。動機づけ要因が充足されると積極的な行動・高いパフォーマンスにつながる。",weight:3},{id:255,subject:"人・組織",question:"SD（Self-Development：自己啓発）について正しく説明しているのは次のうちどれか。",choices:["本人の自主性に委ねられた能力開発だが、会社として制度化することができる", "本人の自主性に委ねられた能力開発なので、会社として制度化はできない", "会社主導で実施する能力開発プログラムである", "OJTの一形態として位置づけられる"],correct:0,reference:"Mexam Ch3-III ロジカルシンキングと能力開発",explanation:"SD（Self-Development：自己啓発）は、社員自身が主体的・自主的に取り組む能力開発であるが、会社として費用補助・学習時間の付与・情報提供などの制度を整えて支援・制度化することができる。制度化によって自己啓発を促進することが可能である。",weight:3},{id:256,subject:"人・組織",question:"組織行動学と人的資源管理における「組織構造」の説明として正しいのは次のうちどれか。",choices:["構成員をどのように組み合わせて戦略を遂行させるか", "ビジョンを実現するため組織と人がどうあるべきかを示す", "構成員をどのように活用・管理するか", "構成員が共有する信念・価値観・行動規範の集合体"],correct:0,reference:"Mexam Ch3-I 組織行動学と人的資源管理",explanation:"組織行動学と人的資源管理における「組織構造」とは、構成員をどのように組み合わせて戦略を遂行させるかを規定する仕組みのことである。職能別組織・事業部制組織・マトリクス組織などの形態がある。",weight:3},{id:257,subject:"人・組織",question:"コミュニケーションにおける「大人（A）の自我状態」の特徴として正しいのは次のうちどれか。",choices:["事実を具体的に説明し、データを基に確率等を計算して情報を処理する", "声の調子は静かで、相手に理解を示す言葉を使い相手の行動を制限する", "人間固有の自我であり、自然で創造的な発想の源となる", "相手の行動に感情で反応し、それを言葉や声の調子で表現する"],correct:0,reference:"Mexam Ch3-IV コミュニケーション",explanation:"交流分析における大人（A）の自我状態は、感情や過去の経験に左右されず、現在の事実を具体的に説明し、データを基に確率等を計算して情報を客観的に処理する自我状態である。合理的・論理的な思考と行動が特徴。",weight:3},{id:258,subject:"人・組織",question:"交流分析（TA）において3つのOKな自我状態（NP・NC・A）を多用することで言動を適切化する原理は何と呼ばれるか。",choices:["BCB（Between, Complementary, Between）の原理", "交差的交流の原理", "平行的交流の原理", "裏面的交流の原理"],correct:0,reference:"Mexam Ch3-IV コミュニケーション",explanation:"BCB（Between, Complementary, Between）の原理とは、交流分析（TA）において養育的親（NP）・自由な子供（NC）・大人（A）の3つのOKな自我状態を多用することで言動を適切化する原理である。この3つの自我状態を状況に応じて活用することがコミュニケーションの改善につながる。",weight:3},{id:259,subject:"人・組織",question:"組織における「ロジカルシンキング」で最も重要なスキルとして位置づけられるものは次のうちどれか。",choices:["問題を構造化し、本質把握と解決策を導出するコンセプチュアル・スキル", "手を動かして素早く成果を出すテクニカル・スキル", "他者と良好な関係を築くヒューマン・スキル", "業界知識に基づくドメイン・スキル"],correct:0,reference:"Mexam Ch3-III ロジカルシンキングと能力開発",explanation:"組織におけるロジカルシンキングで最も重要なスキルは、物事を本質的・概念的に捉える「コンセプチュアル・スキル（概念化能力）」とされる。問題を構造化し、本質を把握したうえで解決策を導出するこのスキルは、特に上位管理職において重要とされる。",weight:3},{id:260,subject:"人・組織",question:"人材育成の方法として、職場を離れて行われる教育訓練は何と呼ばれるか。",choices:["OFF-JT（Off the Job Training）", "OJT（On the Job Training）", "SD（Self Development）", "メンタリング"],correct:0,reference:"Mexam Ch3-III ロジカルシンキングと能力開発",explanation:"人材育成の方法のうち、職場を離れて行われる教育訓練をOFF-JT（Off the Job Training）と呼ぶ。集合研修・外部セミナーなどがこれに当たる。一方、OJT（On the Job Training）は職場内で上司・先輩が仕事を通じて指導・訓練を行う方法である。",weight:3},{id:261,subject:"アカウンティング",question:"財務諸表の作成プロセスとして正しい順序は次のうちどれか。",choices:["取引の識別→仕訳→仕訳帳→元帳→試算表→決算整理→財務諸表", "取引の識別→元帳→仕訳→仕訳帳→試算表→決算整理→財務諸表", "仕訳→取引の識別→仕訳帳→元帳→決算整理→試算表→財務諸表", "取引の識別→仕訳帳→仕訳→元帳→決算整理→試算表→財務諸表"],correct:0,reference:"Mexam Ch4-I 企業会計の概要",explanation:"財務諸表は、期中取引を発生順に記録した仕訳帳のデータを元帳が管理する勘定に転記し、その結果計算された各勘定の残高に基づいて作成される。作成プロセスは「取引の識別→仕訳→仕訳帳→元帳→試算表→決算整理→財務諸表」の順序で行われる。",weight:2},{id:262,subject:"アカウンティング",question:"取得原価基準による資産評価の意味として正しいものは次のうちどれか。",choices:["資産の取得にあたって実際に支出した金額をベースにして資産を評価する", "将来キャッシュフローの現在価値で資産を評価する", "購入市場の時価で資産を評価する", "売却市場の時価で資産を評価する"],correct:0,reference:"Mexam Ch4-II 貸借対照表と損益計算書",explanation:"取得原価基準では、資産の取得にあたって実際に支出した金額をベースにして資産を評価する。他方、時価基準による資産評価では、（1）将来キャッシュフローの現在価値、（2）購入市場の時価、（3）売却市場の時価等が用いられる。",weight:3},{id:263,subject:"アカウンティング",question:"減価償却の対象とならないものは次のうちどれか。",choices:["土地", "建物", "機械装置", "車両運搬具"],correct:0,reference:"Mexam Ch4-II 貸借対照表と損益計算書",explanation:"減価償却とは、使用ないし時間の経過に伴って価値が低下する有形固定資産について、適切な期間損益計算を行うために、当該資産の取得原価から残存価額を控除した差額を耐用年数にわたって費用として配分する手続である。土地は有形固定資産であるが、時間の経過や使用によって価値が低下しないため、減価償却の対象とはならない。",weight:3},{id:264,subject:"アカウンティング",question:"負債性引当金の設定要件に含まれないものは次のうちどれか。",choices:["すでに確定した費用または損失であること", "将来の特定の費用または損失であること", "その発生が当期以前の事象に起因していること", "発生の可能性が高いこと"],correct:0,reference:"Mexam Ch4-II 貸借対照表と損益計算書",explanation:"負債性引当金は、期間損益計算を行うにあたって決算で計上される特殊な負債である。設定要件は(1)将来の特定の費用または損失であること、(2)その発生が当期以前の事象に起因していること、(3)発生の可能性が高いこと、(4)その金額を合理的に見積もることができること、の4つ。「すでに確定した費用または損失であること」は要件に含まれない（未確定の将来費用が対象）。",weight:3},{id:265,subject:"アカウンティング",question:"製品原価計算において「直接費」に分類されるものは次のうちどれか。",choices:["直接材料費・直接労務費・直接経費", "補助材料費・間接工賃金・福利施設負担額", "間接材料費・間接労務費・間接経費", "管理可能費・管理不能費・変動費"],correct:0,reference:"Mexam Ch4-VII 製品原価計算",explanation:"製品原価計算において、原価は製品への発生が直接的に認識できるか否かによって直接費と間接費に区別される。「原価計算基準」における直接費の分類は、直接材料費（主要材料費・買入部品費）、直接労務費（直接賃金）、直接経費（外注加工費）の3種類である。",weight:3},{id:266,subject:"アカウンティング",question:"機会原価の説明として正しいものは次のうちどれか。",choices:["ある選択肢を選ぶことで失われる最善の代替案から得られたであろう価値", "すでに支出してしまい回収できないコスト", "変動費の別名", "固定費の別名"],correct:0,reference:"Mexam Ch4-VII 製品原価計算",explanation:"機会原価（機会費用）とは、ある選択肢を選んだことで断念した他の代替案から得られたであろう最大の価値（逸失利益）のことである。意思決定において、選択した場合の便益だけでなく、断念した代替案の価値も考慮すべきコストとして扱う概念である。",weight:3},{id:267,subject:"アカウンティング",question:"管理会計における「アクティビティ・コスト」は何の別名か。",choices:["変動費", "固定費", "直接費", "間接費"],correct:0,reference:"Mexam Ch4-VII 製品原価計算",explanation:"管理会計においてアクティビティ・コストは変動費の別名であり、キャパシティ・コストは固定費の別名である。製品原価計算において原価は、変動費（アクティビティ・コスト）と固定費（キャパシティ・コスト）に区分される。",weight:3},{id:268,subject:"アカウンティング",question:"損益計算書の5つの利益の順序として正しいものは次のうちどれか。",choices:["売上総利益→営業利益→経常利益→税引前当期純利益→当期純利益", "営業利益→売上総利益→経常利益→税引前当期純利益→当期純利益", "売上総利益→経常利益→営業利益→税引前当期純利益→当期純利益", "売上総利益→営業利益→税引前当期純利益→経常利益→当期純利益"],correct:0,reference:"Mexam Ch4-III 損益計算書",explanation:"損益計算書では多段階にわたって利益が計算される。①売上総利益（売上高－売上原価）→②営業利益（売上総利益－販売費及び一般管理費）→③経常利益（営業利益±営業外損益）→④税引前当期純利益（経常利益±特別損益）→⑤当期純利益（税引前当期純利益－法人税等）の順序で計算される。",weight:3},{id:269,subject:"ファイナンス",question:"資本予算に制限がない場合、NPV法とIRR法の関係として正しいものは次のうちどれか。",choices:["正のNPVを有する投資案と資本コストを上回るIRRを有する投資案は一致し、すべて実行すればよい", "NPV法で採択した投資案とIRR法で採択した投資案は常に異なる", "IRR法のみで判断すればNPV法は不要である", "NPV法のみで判断すればIRR法は不要である"],correct:0,reference:"Mexam Ch4-XI 財務的意思決定",explanation:"資本予算に制限がない場合、正の正味現在価値（NPV）を有する投資案と資本コストを上回る内部利益率（IRR）を有する投資案は一致し、すべてを実行すればよい。つまりNPV法とIRR法は同じ投資案を採択することになる。",weight:3},{id:270,subject:"ファイナンス",question:"資本予算に制限がある場合、NPV法とIRR法の優先順位が異なるときはどちらを優先すべきか。",choices:["NPV法（正味現在価値法）を優先し、利益額が最大になる投資案の組み合わせを選択する", "IRR法（内部利益率法）を優先し、利益率が最大になる投資案を選択する", "両方で採択された投資案のみ実行する", "投資規模が小さい順に採択する"],correct:0,reference:"Mexam Ch4-XI 財務的意思決定",explanation:"資本予算に制限がある場合、NPV法とIRR法で優先順位が異なることがある。この場合、正味現在価値法（NPV法）で判断すれば利益額が最大になる投資案の組み合わせを選択することができる。IRR法は相対的な収益率を示すが、絶対的な利益額の最大化にはNPV法が適している。",weight:3},{id:271,subject:"ファイナンス",question:"分割払いと即金払いの比較で分割払いの現在価値の方が大きい場合、どちらを選択すべきか。",choices:["分割払いを利用すべき（支出の現在価値が大きい＝不利なのが即金）", "即金払いを利用すべき", "どちらも同じ価値なので任意でよい", "現在価値では比較できない"],correct:0,reference:"Mexam Ch4-XI 財務的意思決定",explanation:"分割払いと即金払いを比較する場合、支出の現在価値が小さい方が有利である。分割払いの現在価値が即金払いの現在価値よりも大きい（支出の負担が大きい）ということは、即金払いの方が支出の現在価値が小さいため、即金払いの方が不利ではなく有利であることを意味する。問題文では分割払いの現在価値の方が大きい＝分割払いの方が実質的な支出が大きいため、分割払いを利用すべきである。",weight:3},{id:272,subject:"ファイナンス",question:"加重平均資本コスト（WACC）の計算において税引後の負債コストを用いる理由は次のうちどれか。",choices:["負債の利息は損金算入できるため節税効果がある", "負債の利息は課税対象外であるため", "株主資本コストと単純比較するため", "財務省令で定められているため"],correct:0,reference:"Mexam Ch4 ファイナンス",explanation:"WACCの計算において税引後の負債コストを用いる理由は、負債（借入金・社債）の利息は損金算入できるため節税効果（タックスシールド）が生じるからである。実質的な負債コスト＝負債コスト×（1－実効税率）として計算し、この節税効果を反映する。",weight:3},{id:273,subject:"ファイナンス",question:"CAPMにおけるベータ（β）の説明として正しいものは次のうちどれか。",choices:["市場全体の動きに対する個別資産の感応度を示す係数", "企業の財務リスクを示す指標", "負債比率と資本コストの関係を示す係数", "配当成長率を示す指標"],correct:0,reference:"Mexam Ch4 ファイナンス",explanation:"CAPMでは個別資産の期待収益率＝リスクフリーレート＋β×（市場リターン－リスクフリーレート）で表される。βは市場全体の動きに対する個別資産の感応度を示す係数であり、β＝1なら市場と同じリスク、β＞1なら市場より変動が大きいハイリスク・ハイリターン、β＜1なら変動が小さいローリスク・ローリターンを意味する。",weight:3},{id:274,subject:"ファイナンス",question:"フリーキャッシュフロー（FCF）の計算式として正しいものは次のうちどれか。",choices:["営業利益×（1－税率）＋減価償却費－設備投資－運転資本増加額", "当期純利益＋減価償却費", "営業利益－支払利息", "売上高－変動費－固定費"],correct:0,reference:"Mexam Ch4 ファイナンス",explanation:"フリーキャッシュフロー（FCF）は、企業が事業活動で生み出すキャッシュフローから、事業維持・拡大に必要な投資を差し引いた後に、債権者と株主に分配可能なキャッシュフローである。計算式はFCF＝営業利益×（1－税率）＋減価償却費－設備投資－運転資本増加額。",weight:3},{id:275,subject:"ファイナンス",question:"株式の本源的価値を将来配当の現在価値として評価する方法は何と呼ばれるか。",choices:["配当割引モデル（DDM）", "株価収益率（PER）モデル", "株価純資産倍率（PBR）モデル", "加重平均資本コスト（WACC）モデル"],correct:0,reference:"Mexam Ch4 ファイナンス",explanation:"配当割引モデル（DDM：Dividend Discount Model）は、株式の本源的価値を将来の配当の現在価値の総和として評価する方法である。毎期一定配当が永続する場合は株式価値＝配当÷資本コスト（株主資本コスト）として計算できる。",weight:3},{id:276,subject:"ファイナンス",question:"企業価値評価においてDCF法（割引キャッシュフロー法）で用いる割引率として最も適切なものは次のうちどれか。",choices:["WACC（加重平均資本コスト）", "リスクフリーレート", "市場リターン", "負債コスト"],correct:0,reference:"Mexam Ch4 ファイナンス",explanation:"DCF法（割引キャッシュフロー法）では、企業全体の価値を算定するためにフリーキャッシュフロー（FCF）を適切な割引率で割り引く。この割引率にはWACC（加重平均資本コスト：Weighted Average Cost of Capital）を用いる。WACCは負債コスト（税引後）と株主資本コストを資本構成（負債比率・株主資本比率）で加重平均した数値である。",weight:3},
{"id": 201, "subject": "ファイナンス", "question": "企業財務と企業会計の違いとして最も適切な説明はどれか？", "choices": ["財務は過去の実績を記録し、会計は将来のキャッシュフローを管理する", "財務は企業価値の最大化を目指しキャッシュフローを管理し、会計は事業活動を数字で記録・報告する", "財務と会計はほぼ同じ概念で区別する必要はない", "会計は短期の資金計画を、財務は税務申告を担う"], "correct": 1, "reference": "4-1 企業経営と企業財務", "weight": 2, "explanation": "会計は企業の日々の事業活動を所定のルールに従って数字で記録・報告する。財務は経営目標（企業価値の最大化）を目指し、事業から生じるキャッシュフローを管理する。財務では将来のキャッシュフローに重点が置かれる点が会計と大きく異なる。"},
{"id": 202, "subject": "ファイナンス", "question": "割引率5%のとき、1年後に受け取る100万円の現在価値（PV）として最も近いものはどれか？", "choices": ["105万円", "100万円", "約95.2万円", "約90万円"], "correct": 2, "reference": "4-4 DCF法", "weight": 3, "explanation": "PV = C÷(1+r) = 100÷1.05 ≒ 95.2万円。DCF法では将来のキャッシュフローを割引率で割り引いて現在価値を求める。割引率が高いほど現在価値は低くなる。"},
{"id": 203, "subject": "ファイナンス", "question": "コーポレート・ファイナンスの2大テーマの組み合わせとして正しいものはどれか？", "choices": ["損益計算書の分析と貸借対照表の管理", "最適資本構成・配当政策と投資対象の選択・資金調達手段の選択", "為替リスク管理とコスト削減", "経営計画の策定とKPI設定"], "correct": 1, "reference": "4-2 ファイナンスの基本概念", "weight": 2, "explanation": "コーポレート・ファイナンスの2大テーマは「①最適資本構成（負債と株式の最適な組み合わせ）・配当政策」と「②どのような投資対象にいくら投資するか・どのような手段で資金を調達するか」。企業財務戦略の核心となる領域。"},
{"id": 204, "subject": "ファイナンス", "question": "ポートフォリオ全体の期待利回りの計算方法として正しいものはどれか？", "choices": ["各資産の利回りの単純平均", "各資産の利回りを投資割合で加重平均したもの", "最も高い利回りを持つ資産の利回り", "各資産の利回りの標準偏差の平均"], "correct": 1, "reference": "4-6 分散投資の効果（1）ポートフォリオ理論", "weight": 2, "explanation": "ポートフォリオ全体の期待利回りは、個別資産の期待利回りをそれぞれの資産がポートフォリオ全体に占める割合（投資比率）で重み付けした加重平均で求められる。"},
{"id": 205, "subject": "ファイナンス", "question": "効率的市場仮説の「ウィーク・フォーム」の説明として正しいものはどれか？", "choices": ["非公開情報を含むあらゆる情報に基づく取引では恒常的に利益を上げられない", "世間に公表されている情報に基づく取引では恒常的に利益を上げられない", "過去の資産価格や収益率データに基づく取引では恒常的に利益を上げられない", "株価は常に完全に情報を反映しているため取引で利益は出ない"], "correct": 2, "reference": "4-13 効率的市場仮説", "weight": 3, "explanation": "効率的市場仮説の3段階：ウィーク・フォーム（過去の価格データ）、セミストロング・フォーム（公表情報）、ストロング・フォーム（非公開情報含む全情報）。ウィーク・フォームでは株価チャートなどテクニカル分析に基づく取引では恒常的な利益は上げられない。"},
{"id": 206, "subject": "ファイナンス", "question": "完全市場の仮定のもとでの配当政策に関する記述として正しいものはどれか？", "choices": ["配当を多くするほど常に株主価値が高まる", "完全市場では配当で還元しても株の値上がり益で還元しても株主利回りは同じ", "日本では配当への税率とキャピタル・ゲインへの税率は常に同一", "配当政策は株主価値に影響しないため経営者は気にする必要がない"], "correct": 1, "reference": "4-15 配当政策", "weight": 3, "explanation": "モジリアーニ＝ミラーの命題により、完全市場の仮定のもとでは配当政策は企業価値に影響しない。配当還元でも株価上昇でも株主への利回りは同じ。ただし現実には税制・情報の非対称性があるため配当政策は企業価値に影響する。"},
{"id": 207, "subject": "ファイナンス", "question": "株価収益率（PER）の定義として正しいものはどれか？", "choices": ["株価 ÷ 1株当たり純資産", "株価 ÷ 1株当たり税引後利益（EPS）", "時価総額 ÷ 売上高", "1株当たり配当 ÷ 株価"], "correct": 1, "reference": "4-18 企業価値評価", "weight": 2, "explanation": "PER（Price Earnings Ratio）＝ 株価÷EPS（1株当たり税引後利益）。その企業の利益の何倍の価値がついているかを示す。成長企業はPERが高く、成熟・安定企業はPERが低めになる傾向がある。"},
{"id": 208, "subject": "ファイナンス", "question": "ファイナンスにおける投資の「リスク」の定義として正しいものはどれか？", "choices": ["元本を失う可能性の絶対額", "予測される投資利回りの標準偏差（または分散）", "過去の最大損失額", "倒産確率"], "correct": 1, "reference": "4-6 分散投資の効果（1）ポートフォリオ理論", "weight": 2, "explanation": "ファイナンスでは投資リスクを「不確実性」と定義し、予測される利回りの分布の標準偏差（または分散）で表す。標準偏差が大きいほど利回りのばらつきが大きく、リスクが高い。"},
{"id": 209, "subject": "ファイナンス", "question": "社債（負債）による資金調達の特徴として正しいものはどれか？", "choices": ["社債の利息は税務上の費用にならない", "負債コストは株主資本コストより一般的に高い", "社債による調達には利息の損金算入による節税効果がある", "倒産時、社債権者は株主より後順位になる"], "correct": 2, "reference": "4-10 資本コスト", "weight": 2, "explanation": "社債の利息は税務上の費用として損金算入できる（節税効果）。一方、株式の配当は税引後利益から支払うため節税効果がない。倒産時は社債権者（債権者）が株主より優先して弁済を受けられる。負債コスト（利息）は通常、株主資本コストより低い。"},
{"id": 210, "subject": "ファイナンス", "question": "DCF法による企業価値算定で「継続価値（ターミナル・バリュー）」を計算する理由として正しいものはどれか？", "choices": ["過去のキャッシュフローを遡って計算するため", "企業は予測期間後も存続し続けるため、予測期間以降のキャッシュフローも価値に含める必要があるため", "設備投資の見積もりが困難なため", "DCF法では将来予測が5年間に限定されているため"], "correct": 1, "reference": "4-16 企業価値評価", "weight": 3, "explanation": "DCF法では通常5〜10年分の将来FCFを予測して現在価値を計算するが、企業は予測期間後も存続するため、予測期間以降のキャッシュフローを「継続価値（ターミナル・バリュー）」として算定する必要がある。これが企業価値の大部分を占めることも多い。"},
{"id": 211, "subject": "人的資源管理", "question": "人的資源管理（HRM）の目的として最も適切な説明はどれか？", "choices": ["従業員の給与水準を業界平均に揃えること", "企業の戦略目標達成と従業員個人の目標（生活維持・自己実現）をうまく適合させ競争優位の源泉を築くこと", "採用コストを最小化すること", "全員が均等に昇進できる仕組みをつくること"], "correct": 1, "reference": "5-1 企業経営と人・組織のマネジメント", "weight": 2, "explanation": "HRMは企業の戦略目標の達成と、従業員個人の生活維持や自己実現などの目的とをうまく適合させ、競争優位の源泉を築くことを目指す。ヒトを経営資源としてとらえ、能力を最大限に引き出す仕組みをつくることが核心。"},
{"id": 212, "subject": "人的資源管理", "question": "人材の「外部調達」と「内部調達（異動・昇進）」の比較として適切でないものはどれか？", "choices": ["外部調達は内部調達より一般的に短期間で人材を確保できる", "内部調達は組織文化や業務に精通した人材を配置できる", "外部調達は組織内に新しい視点やスキルをもたらすことができる", "内部調達は常に外部調達より金銭的コストが低い"], "correct": 3, "reference": "5-15 人員配置", "weight": 2, "explanation": "内部調達は一見金銭的コストが低く見えるが、その人材が現在のスキルを身につけるまでの能力開発コストが発生している。必ずしも内部調達の方が金銭的コストが低いとは言えない。Mbookでは外部・内部調達のコスト・精度・影響を総合的に判断することが重要とされている。"},
{"id": 213, "subject": "人的資源管理", "question": "目標管理制度（MBO：Management By Objectives）の特徴として最も適切なものはどれか？", "choices": ["上司が部下に一方的に業務指示を出す管理手法", "従業員が自ら目標を設定し達成度によって評価される参加型管理手法", "全従業員に同一の目標を設定することで公平性を確保する手法", "長期的な組織目標だけを管理し個人目標は扱わない手法"], "correct": 1, "reference": "5-16 人事考課", "weight": 2, "explanation": "MBO（目標管理制度）はドラッカーが提唱。従業員が自ら目標を設定・コミットし、その達成度によって評価される参加型管理手法。自律性が高まり、モチベーション向上にも寄与する。"},
{"id": 214, "subject": "人的資源管理", "question": "「コンピテンシー評価」の説明として正しいものはどれか？", "choices": ["担当業務の成果・目標達成度を数値で評価する方法", "高業績者に共通して見られる行動特性・思考特性を基準に評価する方法", "年功序列に基づいて評価する方法", "360度（上司・同僚・部下）からの評価を平均する方法"], "correct": 1, "reference": "5-16 人事考課", "weight": 2, "explanation": "コンピテンシー評価は、高業績者（ハイパフォーマー）に共通して見られる行動特性・思考特性（コンピテンシー）を定義し、それを基準に従業員を評価する手法。成果だけでなく「どのように仕事をしているか」という行動プロセスに着目する。"},
{"id": 215, "subject": "人的資源管理", "question": "報酬を決定する3要素のうち「報酬基準」に当たるものはどれか？", "choices": ["基本給・手当・インセンティブなど報酬をどのように支払うか", "市場水準・生活費など報酬を誰にいくら支払うか", "成果・職務・能力・年功など報酬を何に対して支払うか", "賞与・退職金など一時的に支払われる金額"], "correct": 2, "reference": "5-17 報酬管理", "weight": 2, "explanation": "報酬の3要素：①報酬基準（何に対して支払うか＝評価軸）、②報酬項目（どのように支払うか＝給与・手当・賞与など）、③報酬水準（誰にいくら支払うか）。報酬基準とは「成果基準か・職務基準か・能力基準か・年功基準か」という報酬の根拠となる考え方。"},
{"id": 216, "subject": "人的資源管理", "question": "「インセンティブ・システム」の説明として正しいものはどれか？", "choices": ["従業員に一律で支払われる固定給", "個人・部門・企業の業績が目標に対する達成度に応じて個人に支払われる報酬", "福利厚生として支給される住宅手当や家族手当", "定期的な昇給制度"], "correct": 1, "reference": "5-17 報酬管理", "weight": 2, "explanation": "インセンティブ・システムとは、個人・部門・企業の業績が目標に対する達成度などの基準を満たした場合に、それに応じて個人に支払われるもの。プロフィット・シェアリングやストック・オプションなどがある。"},
{"id": 217, "subject": "人的資源管理", "question": "人事考課における「中心化傾向」の説明として正しいものはどれか？", "choices": ["一部の目立つ特徴によって全体評価が影響される傾向", "評価者が極端な評価を避け中間点に集中してしまう傾向", "最初の印象が評価全体に影響を与える傾向", "部下と仲の良い上司が甘い評価をする傾向"], "correct": 1, "reference": "5-16 人事考課", "weight": 2, "explanation": "中心化傾向とは、評価者が「可もなく不可もなく」という評価に集中させてしまう傾向。評価責任の回避や部下との関係悪化を避けようとする心理が背景にある。ハロー効果（一部の特徴に引きずられる）とは異なる評価エラー。"},
{"id": 218, "subject": "人的資源管理", "question": "OJT（On the Job Training）の説明として正しいものはどれか？", "choices": ["外部研修機関を利用した研修", "実際の業務を通じて上司や先輩が行う訓練", "業務を離れて行う集合研修・セミナー", "eラーニングによる自己学習"], "correct": 1, "reference": "5-14 人材育成", "weight": 1, "explanation": "OJTとは実際の業務の場で、上司や先輩が直接指導する訓練方法。業務を離れて行うOff-JT（集合研修・セミナー・eラーニングなど）と組み合わせることで効果的な人材育成が可能になる。"},
{"id": 219, "subject": "人的資源管理", "question": "機能別組織の特徴として最も適切なものはどれか？", "choices": ["製品や地域ごとに独立した事業部を持ち各事業部が損益責任を持つ", "職能（営業・製造・人事など）ごとに部門を編成し専門性を深めやすい", "特定プロジェクトのために各部門から人材を集め終了後は解散する", "2つの指揮命令系統（職能と事業部）が交差する"], "correct": 1, "reference": "5-11 組織形態", "weight": 2, "explanation": "機能別組織は営業・製造・人事・財務などの職能ごとに部門を編成する形態。専門性を深めやすいが事業部間の連携が難しい面がある。他の選択肢は事業部制組織・プロジェクト組織・マトリクス組織の説明。"},
{"id": 220, "subject": "人的資源管理", "question": "「ストック・オプション」の説明として正しいものはどれか？", "choices": ["企業が従業員に現金ボーナスを支払う制度", "従業員が将来、自社株を一定価格で購入できる権利を付与する制度", "従業員が持ち株会を通じて自社株を市場価格で購入する制度", "企業が市場で自社株を買い戻す制度"], "correct": 1, "reference": "5-17 報酬管理", "weight": 2, "explanation": "ストック・オプションとは、従業員（主に役員・幹部）が将来の一定期間内に、あらかじめ定めた価格（行使価格）で自社株を購入できる権利を付与する制度。株価が行使価格を上回れば利益が得られるため企業価値向上へのインセンティブとなる。"},
{"id": 221, "subject": "人的資源管理", "question": "360度評価（多面評価）の特徴として正しいものはどれか？", "choices": ["上司一人だけが部下を評価する伝統的な評価方式", "上司・同僚・部下・本人など複数の視点から評価を行う方式", "財務指標のみで評価を行う定量的な評価方式", "360問の評価項目で詳細に評価する方式"], "correct": 1, "reference": "5-16 人事考課", "weight": 2, "explanation": "360度評価は上司だけでなく同僚・部下・本人・場合によっては顧客など複数の角度から評価する方式。多面的なフィードバックが得られる反面、評価者の主観や人間関係の影響を受けやすい側面もある。"},
{"id": 222, "subject": "人的資源管理", "question": "組織文化が「障害」となる状況として最も適切なものはどれか？", "choices": ["新入社員が素早く会社のルールを学ぶとき", "強烈な価値観が共有されすぎると環境変化への対応が遅れることがある", "組織文化が弱く従業員の行動がバラバラなとき", "組織文化が意思決定のスピードを高めるとき"], "correct": 1, "reference": "5-12 組織文化", "weight": 2, "explanation": "組織文化は通常、行動指針の提供・情報伝達の簡素化・個人の動機づけという機能を果たす。しかし強烈な価値観が共有されすぎると構成員のものの見方が固定化し、環境変化を見過ごす原因になることがある。"},
{"id": 223, "subject": "人的資源管理", "question": "人事考課の「絶対評価」と「相対評価」について正しいものはどれか？", "choices": ["絶対評価は他者と比較して順位をつける評価方式", "相対評価は事前に設定した基準に対して達成度を評価する方式", "相対評価は評価分布（優・良・可の比率）を事前に決めて評価する方式", "絶対評価と相対評価は同じ結果を生む"], "correct": 2, "reference": "5-16 人事考課", "weight": 2, "explanation": "相対評価は他者との比較によって評価を決定する方式（例：上位10%をS評価）。絶対評価は事前に設定した基準に対して達成度を評価する方式。相対評価は評価分布のコントロールがしやすく、絶対評価は個人の成長を適切に評価できる。"},
{"id": 224, "subject": "人的資源管理", "question": "「職務分析」の説明として正しいものはどれか？", "choices": ["従業員のキャリアパスを分析すること", "各職務の内容・責任・必要スキルを体系的に調査・整理すること", "競合他社の職務体系を調査すること", "従業員の業績を定期的に分析すること"], "correct": 1, "reference": "5-13 人材の採用", "weight": 1, "explanation": "職務分析とは、各職務の業務内容・責任範囲・必要なスキル・知識を体系的に調査・整理すること。採用・配置・評価・報酬など人事施策全般の基礎データとなる重要な作業。"},
{"id": 225, "subject": "人的資源管理", "question": "チャンドラーの「組織は戦略に従う」という命題の意味として正しいものはどれか？", "choices": ["組織変革は戦略変更なしには実施できない", "企業は戦略を先に決め、その実行に適した組織構造を後から設計すべきである", "組織文化が戦略の方向性を決める", "強い組織があればどんな戦略でも実行できる"], "correct": 1, "reference": "5-9 組織構造と戦略の関係", "weight": 2, "explanation": "チャンドラーはデュポンやGMなどを研究し「企業は成長戦略（多角化など）を先に決定し、その戦略を効率的に実行できる組織構造（事業部制など）を後から設計する」という命題を提唱した。"},
{"id": 226, "subject": "人的資源管理", "question": "「カフェテリア・プラン」の説明として正しいものはどれか？", "choices": ["社員食堂での食事補助制度", "従業員が一定のポイント範囲内で希望する福利厚生を選択できる仕組み", "全員に一律で与えられる福利厚生パッケージ", "海外赴任者向けの生活支援制度"], "correct": 1, "reference": "5-17 報酬管理", "weight": 1, "explanation": "カフェテリア・プランとは従業員が一定のポイントを持ち、その範囲内で希望する福利厚生（健康保険・住宅補助・育児支援など各々にポイントあり）を選択できる仕組み。従業員の価値観やライフスタイルの多様化に対応した制度。"},
{"id": 227, "subject": "人的資源管理", "question": "採用における「構造化面接」の特徴として正しいものはどれか？", "choices": ["面接官が自由に質問する雑談形式の面接", "事前に統一した質問項目を設定し同一基準で評価する面接手法", "複数の面接官が同時に面接を行う形式", "志望動機だけを聞く面接形式"], "correct": 1, "reference": "5-13 人材の採用", "weight": 2, "explanation": "構造化面接は事前に統一した質問項目と評価基準を設定し、すべての応募者に同一の質問を行う面接手法。面接官によるばらつきを減らし、予測妥当性（採用後のパフォーマンス予測精度）が非構造化面接より高いとされる。"},
{"id": 228, "subject": "組織行動学", "question": "モチベーションの「内発的動機づけ」の説明として正しいものはどれか？", "choices": ["給与・賞与など金銭的報酬による動機づけ", "仕事そのものの面白さ・達成感・成長実感など内面から生まれる動機づけ", "昇進・昇格などの地位向上による動機づけ", "上司や同僚からの承認・表彰による動機づけ"], "correct": 1, "reference": "5-6 動機づけ", "weight": 2, "explanation": "内発的動機づけとは外部からの報酬ではなく、仕事そのものへの興味・関心・達成感・成長実感など内面から湧き出る動機づけ。デシとライアンの自己決定理論では内発的動機づけが長期的なパフォーマンスに重要とされる。"},
{"id": 229, "subject": "組織行動学", "question": "ハーシーとブランチャードが提唱したSL理論（状況対応リーダーシップ）の核心として正しいものはどれか？", "choices": ["リーダーは常に同じスタイルを維持すべきである", "部下の成熟度（能力と意欲）に応じてリーダーシップスタイルを変えるべきである", "民主型リーダーシップが常に最も効果的である", "状況によらず指示型リーダーシップが最も生産性を高める"], "correct": 1, "reference": "5-3 リーダーシップ理論", "weight": 2, "explanation": "SL理論（状況対応リーダーシップ）ではリーダーシップのベストスタイルは固定されず、部下の成熟度（仕事の能力と意欲）に応じて指示型→コーチング型→支援型→委任型と変えることが効果的とされる。"},

function randInt(base, div, scale) {
  return base + scale * (Math.floor(Math.random() * div));
}
function r(v, digits) {
  const f = Math.pow(10, digits);
  return Math.round(v * f) / f;
}

function generateBreakEven() {
  const uriage = randInt(250, 11, 10);
  const hendon = randInt(50, 10, 5);
  const kotei  = randInt(30, 10, 5);
  const eigyo  = uriage - hendon - kotei;
  const genkai_ritsu = r((uriage - hendon) / uriage, 3);
  const eigyo_ritsu  = r(eigyo / uriage * 100, 1);
  const bep          = r(kotei / genkai_ritsu, 1);

  const questions = [
    {
      type: 'calc', subject: '計算問題', id: 'be1',
      title: '損益分岐点分析',
      formula: '限界利益率 = (売上高 − 変動費) ÷ 売上高\n損益分岐点 = 固定費 ÷ 限界利益率\n営業利益率(%) = 営業利益 ÷ 売上高 × 100',
      tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
        <tr><td>売上高</td><td>${uriage}</td></tr>
        <tr><td>変動費</td><td>${hendon}</td></tr>
        <tr><td>固定費</td><td>${kotei}</td></tr>
        <tr><td>営業利益</td><td>${eigyo}</td></tr></table>`,
      question: `売上高${uriage}、変動費${hendon}、固定費${kotei}の時、<b>損益分岐点売上高</b>はいくらか？`,
      answer: bep,
      decoys: [r(kotei/r((uriage-hendon-5)/uriage,3),1), r(bep*0.9,1), r(kotei/(genkai_ritsu+0.05),1)]
    },
    {
      type: 'calc', subject: '計算問題', id: 'be2',
      title: '損益分岐点分析',
      formula: '限界利益率 = (売上高 − 変動費) ÷ 売上高',
      tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
        <tr><td>売上高</td><td>${uriage}</td></tr>
        <tr><td>変動費</td><td>${hendon}</td></tr></table>`,
      question: `売上高${uriage}、変動費${hendon}の時、<b>限界利益率</b>はいくらか？`,
      answer: genkai_ritsu,
      decoys: [r((uriage-hendon+5)/uriage,3), r((uriage-hendon)/(uriage+10),3), r((uriage-hendon-10)/uriage,3)]
    }
  ];
  return questions[Math.floor(Math.random() * questions.length)];
}

function generateWACC() {
  const D  = randInt(50, 10, 10);
  const E  = randInt(50, 10, 10);
  const rd = randInt(3, 4, 1);
  const re = rd + randInt(0, 3, 1) + 1;
  const t  = 50;
  const wacc = r((D/(D+E))*(1-t/100)*rd/100*100 + (E/(D+E))*re/100*100, 2);
  return {
    type: 'calc', subject: '計算問題', id: 'wacc',
    title: 'WACC（加重平均資本コスト）',
    formula: 'WACC = D/(D+E) × (1−t) × rd + E/(D+E) × re',
    tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
      <tr><td>D: 負債額</td><td>${D}</td></tr>
      <tr><td>E: 株式時価総額</td><td>${E}</td></tr>
      <tr><td>rd: 負債コスト(%)</td><td>${rd}</td></tr>
      <tr><td>re: 株主資本コスト(%)</td><td>${re}</td></tr>
      <tr><td>t: 法人税率(%)</td><td>${t}</td></tr></table>`,
    question: `D=${D}、E=${E}、rd=${rd}%、re=${re}%、t=${t}%の時、<b>WACC(%)</b>はいくらか？`,
    answer: wacc,
    decoys: [r(wacc+0.5,2), r((D/(D+E))*rd/100*100 + (E/(D+E))*re/100*100, 2), r(wacc-0.3,2)]
  };
}

function generateFCF() {
  const ebit = randInt(40, 11, 10);
  const t    = 50;
  const dep  = randInt(3, 4, 1);
  const capx = randInt(6, 3, 1);
  const dwc  = randInt(-3, 7, 1);
  const fcf  = r(ebit*(1-t/100) + dep - capx - dwc, 1);
  return {
    type: 'calc', subject: '計算問題', id: 'fcf',
    title: 'FCF（フリー・キャッシュフロー）',
    formula: 'FCF = EBIT × (1−t) + D − C − ΔWC',
    tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
      <tr><td>EBIT: 支払金利前税引前利益</td><td>${ebit}</td></tr>
      <tr><td>t: 法人税率(%)</td><td>${t}</td></tr>
      <tr><td>D: 減価償却費</td><td>${dep}</td></tr>
      <tr><td>C: 設備投資</td><td>${capx}</td></tr>
      <tr><td>ΔWC: 増加運転資本</td><td>${dwc}</td></tr></table>`,
    question: `EBIT=${ebit}、t=${t}%、D=${dep}、C=${capx}、ΔWC=${dwc}の時、<b>FCF</b>はいくらか？`,
    answer: fcf,
    decoys: [r(ebit*(1-t/100)+dep-capx,1), r(ebit*(1-t/100)-capx-dwc,1), r(fcf+5,1)]
  };
}

function generateNPV() {
  const rate = (randInt(5, 5, 1)) / 100;
  const cf0  = -(randInt(40, 3, 5));
  const cf1  = randInt(15, 5, 1);
  const cf2  = randInt(15, 5, 1);
  const cf3  = randInt(10, 5, 1);
  const pv0  = r(cf0, 2);
  const pv1  = r(cf1 / (1+rate), 2);
  const pv2  = r(cf2 / Math.pow(1+rate,2), 2);
  const pv3  = r(cf3 / Math.pow(1+rate,3), 2);
  const npv  = r(pv0+pv1+pv2+pv3, 2);
  return {
    type: 'calc', subject: '計算問題', id: 'npv',
    title: 'NPV（正味現在価値）',
    formula: 'NPV = Σ CF_i / (1 + 割引率)^i\n（0年目のCFはマイナス＝初期投資）',
    tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
      <tr><td>割引率(%)</td><td>${Math.round(rate*100)}</td></tr>
      <tr><td>0年目（初期投資）</td><td>${cf0}</td></tr>
      <tr><td>1年目 CF</td><td>${cf1}</td></tr>
      <tr><td>2年目 CF</td><td>${cf2}</td></tr>
      <tr><td>3年目 CF</td><td>${cf3}</td></tr></table>`,
    question: `割引率${Math.round(rate*100)}%、CF: ${cf0} / ${cf1} / ${cf2} / ${cf3} の時、<b>NPV</b>はいくらか？`,
    answer: npv,
    decoys: [r(cf0+cf1+cf2+cf3,2), r(npv+5,2), r(pv1+pv2+pv3,2)]
  };
}

function generateCAPM() {
  const rf   = r(randInt(10,30,1)/10, 1);
  const beta = r(randInt(5,10,1)/10, 1);
  const mrp  = r(randInt(25,10,1)/10, 1);
  const ei   = r(rf + beta * mrp, 2);
  return {
    type: 'calc', subject: '計算問題', id: 'capm',
    title: 'CAPM（資本資産価格モデル）',
    formula: 'E(i) = rf + β × (E(m) − rf)',
    tableHtml: `<table class="calc-table"><tr><th></th><th>数値</th></tr>
      <tr><td>rf: 無リスク資産利回り</td><td>${rf}</td></tr>
      <tr><td>β: 個別資産の影響度</td><td>${beta}</td></tr>
      <tr><td>(E(m)−rf): マーケット・リスク・プレミアム</td><td>${mrp}</td></tr></table>`,
    question: `rf=${rf}、β=${beta}、MRP=${mrp}の時、<b>E(i)</b>（個別資産の期待利回り）はいくらか？`,
    answer: ei,
    decoys: [r(rf + mrp, 2), r(rf + beta, 2), r(ei + r(beta*0.1,2), 2)]
  };
}

function generateCalcQuestion() {
  const generators = [generateBreakEven, generateWACC, generateFCF, generateNPV, generateCAPM];
  const gen = generators[Math.floor(Math.random() * generators.length)];
  const q = gen();
  // Build shuffled choices
  const correct = q.answer;
  const decoys = q.decoys.map(d => (d === correct ? r(d + 1, 2) : d));
  const allChoices = [correct, ...decoys].map(v => String(v));
  // shuffle
  for(let i = allChoices.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [allChoices[i],allChoices[j]] = [allChoices[j],allChoices[i]];
  }
  q.shuffledChoices = allChoices;
  q.correctIdx = allChoices.indexOf(String(correct));
  return q;
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem(LS_HISTORY) || '{}'); }
  catch { return {}; }
}
function saveHistory(h) { localStorage.setItem(LS_HISTORY, JSON.stringify(h)); }

function recordAnswer(qid, isCorrect) {
  const h = getHistory();
  if (!h[qid]) h[qid] = { correct: 0, wrong: 0 };
  if (isCorrect) h[qid].correct++; else h[qid].wrong++;
  saveHistory(h);
}

function getWeakIds() {
  const h = getHistory();
  return Object.keys(h).filter(id => {
    const r = h[id];
    const total = r.correct + r.wrong;
    if (total === 0) return false;
    return (r.wrong / total) >= 0.4 || r.wrong > r.correct;
  }).map(id => isNaN(id) ? id : Number(id));
}

function updateTopStats() {
  const h = getHistory();
  const ids = Object.keys(h);
  let totalAnswered = 0, totalCorrect = 0;
  ids.forEach(id => {
    const r = h[id];
    totalAnswered += r.correct + r.wrong;
    totalCorrect  += r.correct;
  });
  document.getElementById('stat-total').textContent   = totalAnswered;
  document.getElementById('stat-correct').textContent = totalCorrect;
  document.getElementById('stat-weak').textContent    = getWeakIds().length;
}

function buildQueue() {
  let pool = [];
  const weakIds = getWeakIds();

  if (selectedSubject === '計算問題') {
    // Calc-only mode: generate calc questions
    const n = selectedCount === 999 ? 10 : Math.min(selectedCount, 20);
    for (let i = 0; i < n; i++) pool.push({ type: 'calc_placeholder', idx: i });
    return pool;
  }

  // Filter regular questions
  let base = selectedSubject === '全科目'
    ? QUESTIONS.filter(q => GMAP_SUBJECTS.includes(q.subject))
    : QUESTIONS.filter(q => q.subject === selectedSubject);

  if (selectedMode === 'weak') {
    base = base.filter(q => weakIds.includes(q.id));
    if (base.length === 0) return [];
  }

  // Weighted shuffle (弱点モードは均等、通常モードはweight比例)
  // Efraimidis-Spirakis法: key = rand^(1/weight) の降順ソートで重みづきサンプリング
  if (selectedMode === 'weak') {
    for (let i = base.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [base[i],base[j]] = [base[j],base[i]];
    }
  } else {
    base = base.map(q => ({ q, key: Math.pow(Math.random(), 1 / (q.weight || 1)) }))
               .sort((a, b) => b.key - a.key)
               .map(x => x.q);
  }

  // Also add calc questions to 全科目/通常 mode
  if (selectedSubject === '全科目' && selectedMode === 'normal') {
    const numCalc = Math.min(3, Math.floor(selectedCount === 999 ? 5 : selectedCount * 0.2));
    for (let i = 0; i < numCalc; i++) base.push({ type: 'calc_placeholder', idx: i });
    // re-shuffle calc placeholders in with uniform random
    for (let i = base.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [base[i],base[j]] = [base[j],base[i]];
    }
  }

  const limit = selectedCount === 999 ? base.length : Math.min(selectedCount, base.length);
  return base.slice(0, limit);
}

function startQuiz() {
  quizQueue = buildQueue();
  if (quizQueue.length === 0) {
    alert('出題できる問題がありません。\n苦手問題を増やしてから試してください。');
    return;
  }
  currentIdx     = 0;
  sessionResults = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  const item = quizQueue[currentIdx];
  const total = quizQueue.length;
  const pct = Math.round((currentIdx / total) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${currentIdx + 1} / ${total}`;
  answered = false;

  // Resolve calc placeholder
  let q = item;
  if (item.type === 'calc_placeholder') {
    q = generateCalcQuestion();
    currentCalcQ = q;
    quizQueue[currentIdx] = q; // replace placeholder
  } else if (item.type === 'calc') {
    currentCalcQ = item;
  } else {
    currentCalcQ = null;
  }

  const body = document.getElementById('quiz-body');

  if (q.type === 'calc') {
    renderCalcQuestion(q, body);
  } else {
    renderMCQuestion(q, body);
  }
}

function renderMCQuestion(q, body) {
  // Shuffle choices with correct tracking
  const indices = [0,1,2,3];
  for (let i=3; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [indices[i],indices[j]] = [indices[j],indices[i]];
  }
  const shuffled = indices.map(i => q.choices[i]);
  const correctShuffledIdx = indices.indexOf(q.correct);

  body.innerHTML = `
    <div class="q-number">第 ${currentIdx+1} 問</div>
    <div class="q-subject-tag">${q.subject}</div>
    <div class="q-text">${q.question}</div>
    <div class="choices" id="choices"></div>
    <button class="skip-btn" id="skip-btn" onclick="skipQuestion(${JSON.stringify(q).replace(/"/g,'&quot;')}, ${correctShuffledIdx})">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      わからない
    </button>
    <div class="feedback-area" id="feedback"></div>`;

  const choicesEl = document.getElementById('choices');
  shuffled.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span style="color:#4a6cf7;font-weight:700;margin-right:8px">${i+1}.</span>${c}`;
    btn.dataset.idx = i;
    btn.onclick = () => answerMC(i, correctShuffledIdx, q, shuffled);
    choicesEl.appendChild(btn);
  });
}

function answerMC(chosen, correct, q, shuffled) {
  if (answered) return;
  answered = true;
  const isCorrect = chosen === correct;
  recordAnswer(q.id, isCorrect);
  sessionResults.push({ q, isCorrect, chosenText: shuffled[chosen], correctText: shuffled[correct] });

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === correct) b.classList.add('reveal');
    if (i === chosen && !isCorrect) b.classList.add('wrong');
    if (i === chosen && isCorrect) { b.classList.remove('reveal'); b.classList.add('correct'); }
  });

  showFeedback(isCorrect, `参照：${q.reference}`, null, q.explanation || null, q);
}

function renderCalcQuestion(q, body) {
  body.innerHTML = `
    <div class="q-number">第 ${currentIdx+1} 問（計算）</div>
    <div class="q-subject-tag">${q.title}</div>
    <div class="q-text">${q.question}</div>
    <div class="calc-table-wrap">${q.tableHtml}</div>
    <div class="choices" id="choices"></div>
    <div class="feedback-area" id="feedback"></div>`;

  const choicesEl = document.getElementById('choices');
  q.shuffledChoices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span style="color:#4a6cf7;font-weight:700;margin-right:8px">${i+1}.</span>${c}`;
    btn.dataset.idx = i;
    btn.onclick = () => answerCalc(i, q);
    choicesEl.appendChild(btn);
  });
}

function answerCalc(chosen, q) {
  if (answered) return;
  answered = true;
  const isCorrect = chosen === q.correctIdx;
  // Use a composite id for calc
  const calcId = 'calc_' + q.id + '_' + Math.round(q.answer * 100);
  recordAnswer(calcId, isCorrect);
  sessionResults.push({ q, isCorrect, chosenText: q.shuffledChoices[chosen], correctText: String(q.answer) });

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.correctIdx) b.classList.add('reveal');
    if (i === chosen && !isCorrect) b.classList.add('wrong');
    if (i === chosen && isCorrect) { b.classList.remove('reveal'); b.classList.add('correct'); }
  });

  const formulaHtml = `<div class="formula-box">${q.formula.replace(/\n/g,'<br>')}</div>`;
  showFeedback(isCorrect, null, formulaHtml);
}

function getChapterPdf(ref) {
  if (!ref) return null;
  const r = ref.replace('参照：','').replace('Mbook ','');
  if (/^1-/.test(r)) return ['Mbook_01_経営戦略.pdf','01 経営戦略'];
  if (/^2-/.test(r)) return ['Mbook_02_マーケティング.pdf','02 マーケティング'];
  if (/^3-/.test(r)) return ['Mbook_03_アカウンティング.pdf','03 アカウンティング'];
  if (/^4-/.test(r)) return ['Mbook_04_ファイナンス.pdf','04 ファイナンス'];
  if (/^5-/.test(r)) return ['Mbook_05_人・組織.pdf','05 人・組織'];
  if (/^IT/.test(r))  return ['Mbook_06_IT.pdf','06 IT'];
  if (/^7-/.test(r)) return ['Mbook_07_ゲーム理論・交渉術.pdf','07 ゲーム理論・交渉術'];
  return null;
}

function showFeedback(isCorrect, refText, extraHtml, explanationText, q) {
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  const skipBtn = document.getElementById('skip-btn');
  if (skipBtn) skipBtn.style.display = 'none';
  const isBm = q ? isBookmarked(q.id) : false;
  const chap = q ? getChapterPdf(q.reference) : null;
  const chapHtml = chap ? `<div style="font-size:12px;color:#4a6cf7;margin-top:6px;display:flex;align-items:center;gap:4px">${SVG_BOOK} Mbook <strong>${chap[1]}</strong> を確認</div>` : '';
  fb.innerHTML = `
    <div class="feedback-icon">${isCorrect ? SVG_OK : SVG_NG}</div>
    <div class="feedback-label ${isCorrect ? 'ok' : 'ng'}">${isCorrect ? '正解！' : '不正解'}</div>
    ${explanationText ? `<div class="explanation-box"><strong>解説</strong>${explanationText}${chapHtml}</div>` : ''}
    ${refText ? `<div class="reference-box"><strong>参照</strong>${refText}${!explanationText ? chapHtml : ''}</div>` : ''}
    ${extraHtml || ''}
    <div class="bookmark-row">
      <button class="bookmark-btn${isBm ? ' active' : ''}" onclick="toggleBookmark(this, ${q ? JSON.stringify(q).replace(/"/g,'&quot;') : 'null'})" title="あとで確認リストに追加">${isBm ? SVG_STAR_ON : SVG_STAR_OFF} あとで確認</button>
      <div class="next-btn-wrap"><button class="next-btn" onclick="nextQuestion()">${currentIdx + 1 < quizQueue.length ? '次の問題へ' : '結果を見る'}</button></div>
    </div>`;
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function skipQuestion(q, correctIdx) {
  if (answered) return;
  answered = true;
  recordAnswer(q.id, false);
  sessionResults.push({ q, isCorrect: false, chosenText: 'わからない', correctText: q.choices[q.correct] });
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === correctIdx) b.classList.add('reveal');
  });
  showFeedback(false, `参照：${q.reference}`, null, q.explanation || null, q);
}

// ===== STATS MODAL =====
let currentStatsType = 'total';

function showStatsList(type) {
  currentStatsType = type;
  const h = getHistory();
  const weakIds = getWeakIds().map(String);
  let items = [];
  if (type === 'total') {
    items = Object.keys(h).map(id => ({ id, ...h[id] }));
  } else if (type === 'correct') {
    items = Object.keys(h).filter(id => h[id].correct > h[id].wrong).map(id => ({ id, ...h[id] }));
  } else {
    items = weakIds.map(id => ({ id, ...h[id] }));
  }
  const titles = { total: '解答済み問題', correct: '得意な問題', weak: '苦手な問題' };
  document.getElementById('stats-modal-title').textContent = `${titles[type]} (${items.length})`;
  const body = document.getElementById('stats-modal-body');
  if (items.length === 0) {
    body.innerHTML = '<div style="text-align:center;color:#888;padding:40px 0">データがありません</div>';
  } else {
    body.innerHTML = items.map(item => {
      const q = QUESTIONS.find(q => String(q.id) === String(item.id));
      const txt = q ? q.question.replace(/<[^>]+>/g,'').substring(0, 45) + (q.question.length > 45 ? '…' : '') : `Q${item.id}`;
      return `<div class="stats-modal-item">
        <div class="stats-modal-qtext">${txt}</div>
        <div class="stats-modal-score">${item.correct}○ ${item.wrong}✗</div>
        <button class="stats-modal-del" onclick="deleteHistoryItem('${item.id}')" title="削除">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`;
    }).join('');
  }
  document.getElementById('stats-modal-overlay').classList.add('open');
}

function deleteHistoryItem(id) {
  const h = getHistory();
  delete h[id];
  saveHistory(h);
  updateTopStats();
  showStatsList(currentStatsType);
}

function closeStatsModal() {
  document.getElementById('stats-modal-overlay').classList.remove('open');
  updateTopStats();
}

function clearHistoryFromModal() {
  if (confirm('学習履歴をすべて削除しますか？')) {
    localStorage.removeItem(LS_HISTORY);
    updateTopStats();
    closeStatsModal();
  }
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizQueue.length) {
    showResult();
  } else {
    renderQuestion();
    document.getElementById('quiz-body').scrollTop = 0;
    window.scrollTo(0,0);
  }
}

function showResult() {
  const total   = sessionResults.length;
  const correct = sessionResults.filter(r => r.isCorrect).length;
  const pct     = total > 0 ? Math.round(correct/total*100) : 0;

  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-total').textContent   = `/ ${total}問`;
  document.getElementById('res-pct').textContent     = `正解率 ${pct}%`;
  document.getElementById('rs-ok').textContent       = correct;
  document.getElementById('rs-ng').textContent       = total - correct;
  document.getElementById('rs-rate').textContent     = pct + '%';

  const msgs = [
    [90,'完璧です！試験本番もこの調子で！'],
    [70,'好調です！苦手問題を重点的に復習しましょう'],
    [50,'まだ伸びしろあり。繰り返し練習が大切です'],
    [0, '基礎から丁寧に復習していきましょう']
  ];
  document.getElementById('res-msg').textContent = msgs.find(([t]) => pct >= t)[1];

  // Wrong questions list
  const wrongs = sessionResults.filter(r => !r.isCorrect);
  const wl = document.getElementById('weak-list');
  const wt = document.getElementById('weak-list-title');
  wl.innerHTML = '';
  if (wrongs.length > 0) {
    wt.textContent = `間違えた問題（${wrongs.length}問）`;
    wrongs.forEach(({ q }) => {
      const div = document.createElement('div');
      div.className = 'weak-item';
      const correctAns = q.type === 'calc'
        ? `正解: ${q.answer}`
        : `正解: ${q.choices[q.correct]}`;
      div.innerHTML = `<div class="wq">${q.question}</div>
        <div class="ws">${q.subject} | ${correctAns}</div>`;
      wl.appendChild(div);
    });
  } else {
    wt.textContent = '全問正解！';
  }

  updateTopStats();
  showScreen('result');
}

// ===================================================
const BM_KEY = 'gmap_bookmarks';

function loadBookmarks() {
  try { return JSON.parse(localStorage.getItem(BM_KEY) || '[]'); } catch(e) { return []; }
}
function saveBookmarks(bms) {
  localStorage.setItem(BM_KEY, JSON.stringify(bms));
}
function isBookmarked(id) {
  return loadBookmarks().some(b => b.id === id);
}
function toggleBookmark(btn, q) {
  if (!q) return;
  let bms = loadBookmarks();
  const idx = bms.findIndex(b => b.id === q.id);
  if (idx >= 0) {
    bms.splice(idx, 1);
    btn.classList.remove('active');
    btn.innerHTML = SVG_STAR_OFF + ' あとで確認';
  } else {
    bms.push({ id: q.id, subject: q.subject, reference: q.reference,
      question: q.question.replace(/<[^>]+>/g,''), savedAt: Date.now() });
    saveBookmarks(bms);
    btn.classList.add('active');
    btn.innerHTML = SVG_STAR_ON + ' あとで確認';
  }
  saveBookmarks(bms);
  updateBmBadge();
}
function updateBmBadge() {
  const n = loadBookmarks().length;
  const badge = document.getElementById('bm-count-badge');
  if (badge) badge.textContent = n > 0 ? `(${n}件)` : '';
}
function renderBookmarks() {
  const bms = loadBookmarks();
  const body = document.getElementById('bm-body');
  if (bms.length === 0) {
    body.innerHTML = '<div class="bm-empty">リストは空です<br>問題を解いて ☆ を押すと<br>ここに追加されます</div>';
    return;
  }
  const items = bms.slice().reverse().map(b => `
    <div class="bm-item" id="bm-item-${b.id}">
      <div class="bm-item-subject">${b.subject || ''}</div>
      <div class="bm-item-q">${b.question}</div>
      <div class="bm-item-ref">📖 ${b.reference}</div>
      <button class="bm-item-del" onclick="removeBookmark(${b.id})">✕ リストから削除</button>
    </div>`).join('');
  body.innerHTML = items + `<button class="bm-clear-btn" onclick="clearBookmarks()" style="display:flex;align-items:center;justify-content:center;gap:6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg> リストをすべて削除</button>`;
}
function removeBookmark(id) {
  let bms = loadBookmarks().filter(b => b.id !== id);
  saveBookmarks(bms);
  const el = document.getElementById('bm-item-' + id);
  if (el) el.remove();
  updateBmBadge();
  if (loadBookmarks().length === 0) renderBookmarks();
}
function clearBookmarks() {
  if (!confirm('リストをすべて削除しますか？')) return;
  localStorage.removeItem(BM_KEY);
  renderBookmarks();
  updateBmBadge();
}

function checkLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  if (u === 'nhiyamizu' && p === '123456naoya') {
    sessionStorage.setItem('gmap_auth', '1');
    showScreen('top');
  } else {
    document.getElementById('login-error').textContent = 'ユーザー名またはパスワードが違います';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-pass').focus();
  }
}

window.addEventListener('DOMContentLoaded', () => {
  updateTopStats();
  updateBmBadge();
  if (sessionStorage.getItem('gmap_auth') === '1') {
    showScreen('top');
  } else {
    showScreen('login');
  }
});
</script>
